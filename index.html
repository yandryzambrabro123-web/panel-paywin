<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Panel Administración Pay Win</title>
<!-- Permite instalarlo en el celular (Agregar a pantalla de inicio) y que abra como app, sin barra de Safari -->
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0D1117">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Win">
<link rel="apple-touch-icon" href="/logo-paywin.png">
<link rel="icon" href="/logo-paywin.png">
</head>
<body>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Montserrat:wght@700;800;900&family=Inter:wght@400;500;600;700&display=swap');
  :root{
    --bg:#0D1117;
    --surface:#161B22;
    --surface-2:#1C2330;
    --border:#2A3140;
    --text:#E7ECF2;
    --muted:#7C8798;
    --accent:#D4AF6A;
    --accent-dim:#4A3A1F;
    --accent-light:#E8D4B0;
    --loss:#E5484D;
    --loss-dim:#5C2427;
    --pending:#E8B339;
    --display:'Montserrat', sans-serif;
    --body:'Inter', system-ui, sans-serif;
    --mono:'IBM Plex Mono', 'Courier New', monospace;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:var(--body); color:var(--text); min-height:100vh;
    background:
      radial-gradient(circle at 15% 0%, rgba(212,175,106,.16), transparent 45%),
      radial-gradient(circle at 85% 100%, rgba(212,175,106,.10), transparent 50%),
      var(--bg);
    background-attachment:fixed;
  }
  #app{display:flex; min-height:100vh;}
  .brand-title{font-family:var(--display); font-weight:800; text-transform:uppercase; letter-spacing:.5px;}

  /* Botón de menú (hamburguesa): solo aparece en pantallas chicas -- abre/cierra la barra lateral como cajón */
  .menu-toggle{
    display:none; position:fixed; top:calc(env(safe-area-inset-top, 0px) + 14px); left:14px; z-index:60;
    width:42px; height:42px;
    border-radius:11px; background:var(--surface-2); border:1px solid var(--border); color:var(--text);
    font-size:19px; align-items:center; justify-content:center; cursor:pointer;
    box-shadow:0 4px 14px rgba(0,0,0,.35);
  }
  .menu-backdrop{ display:none; position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:49; }
  .menu-backdrop.show{ display:block; }

  /* Sidebar */
  #sidebar{width:230px; background:var(--surface); border-right:1px solid var(--border); padding:24px 0; flex-shrink:0; display:flex; flex-direction:column;}
  .brand{display:flex; align-items:center; gap:10px; padding:0 24px 20px; border-bottom:1px solid var(--border); margin-bottom:16px;}
  .brand img{width:38px; height:38px; border-radius:50%; object-fit:cover; flex-shrink:0;}
  .brand-text{font-family:var(--display); font-size:14px; font-weight:800; text-transform:uppercase; letter-spacing:.4px; line-height:1.25;}
  .nav-item{display:flex; align-items:center; gap:10px; padding:12px 24px; color:var(--muted); cursor:pointer; font-size:13.5px; font-weight:600; border-left:3px solid transparent; transition:all .15s;}
  .nav-item:hover{color:var(--text); background:var(--surface-2);}
  .nav-item.active{color:var(--accent); border-left-color:var(--accent); background:var(--surface-2);}
  .nav-icon{width:18px; text-align:center; font-size:15px;}
  .nav-item{position:relative;}
  .nav-alert{margin-left:auto; background:var(--loss); color:#fff; font-size:10.5px; font-weight:800; line-height:1; padding:3px 6px; border-radius:20px; min-width:16px; text-align:center;}

  /* Inactive notification banner (members) */
  .alert-banner{display:flex; align-items:center; gap:10px; background:var(--loss-dim); border:1px solid #7A2E32; color:#FFC7C9; padding:12px 16px; border-radius:8px; margin-bottom:18px; font-size:13.5px;}
  .alert-banner strong{color:#fff;}
  .alert-dot{width:8px; height:8px; border-radius:50%; background:var(--loss); flex-shrink:0; box-shadow:0 0 0 0 rgba(229,72,77,.6); animation:pulseDot 1.6s infinite;}
  @keyframes pulseDot{0%{box-shadow:0 0 0 0 rgba(229,72,77,.55);} 70%{box-shadow:0 0 0 7px rgba(229,72,77,0);} 100%{box-shadow:0 0 0 0 rgba(229,72,77,0);}}
  .badge.inactive{position:relative;}

  /* Main */
  #main{flex:1; padding:28px 36px; max-width:1300px;}
  .page-title{font-family:var(--display); font-size:26px; text-transform:uppercase; letter-spacing:.5px; margin-bottom:4px; font-weight:800;}
  .page-sub{color:var(--muted); font-size:13px; margin-bottom:24px;}

  /* Pantallas de celular: la barra lateral se vuelve un cajón que se abre con el botón de menú,
     en vez de estar siempre fija ocupando espacio -- así el contenido (ej. Win) usa toda la pantalla. */
  @media (max-width: 860px){
    .menu-toggle{ display:flex; }
    #sidebar{
      position:fixed; top:0; left:0; bottom:0; z-index:50; width:78vw; max-width:280px;
      transform:translateX(-100%); transition:transform .25s ease; box-shadow:0 0 30px rgba(0,0,0,.5);
      padding-top:calc(env(safe-area-inset-top, 0px) + 24px);
    }
    #sidebar.sidebar-open{ transform:translateX(0); }
    #main{ padding:calc(env(safe-area-inset-top, 0px) + 68px) 16px 32px; max-width:100%; }
  }

  /* Scoreboard strip */
  .scoreboard{display:grid; grid-template-columns:repeat(4,1fr); gap:1px; background:var(--border); border:1px solid var(--border); border-radius:8px; overflow:hidden; margin-bottom:28px;}
  .score-cell{background:var(--surface); padding:16px 18px;}
  .score-label{font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.8px; margin-bottom:6px; font-weight:600;}
  .score-value{font-family:var(--mono); font-size:26px; font-weight:600;}
  .score-value.win{color:var(--accent);}
  .score-value.loss{color:var(--loss);}
  .score-sub{font-size:12px; color:var(--muted); margin-top:4px;}
  .score-sub .g{color:var(--accent); font-weight:600;}

  .grid-2{display:grid; grid-template-columns:1.3fr 1fr; gap:20px; margin-bottom:24px;}
  .card{background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:20px;}
  .card-title{font-size:13px; text-transform:uppercase; letter-spacing:.6px; color:var(--muted); margin-bottom:14px; font-weight:700;}

  /* Tables */
  table{width:100%; border-collapse:collapse; font-size:13.5px;}
  th{text-align:left; color:var(--muted); font-weight:700; font-size:11px; text-transform:uppercase; letter-spacing:.5px; padding:8px 10px; border-bottom:1px solid var(--border);}
  td{padding:10px; border-bottom:1px solid var(--border); vertical-align:middle;}
  tr:last-child td{border-bottom:none;}
  .mono{font-family:var(--mono);}
  .badge{display:inline-block; padding:3px 9px; border-radius:20px; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.3px;}
  .badge.active{background:var(--accent-dim); color:var(--accent);}
  .badge.inactive{background:#3A2020; color:#B04E52;}
  .badge.won{background:var(--accent-dim); color:var(--accent);}
  .badge.lost{background:var(--loss-dim); color:#FF8A8E;}
  .badge.pending{background:#4A3B14; color:var(--pending);}
  .badge.flag{background:#3A1F4A; color:#D9A6FF;}
  .badge.combo{background:#1C2E4A; color:#8FC1FF;}
  .badge.banco{background:#1C2E4A; color:#8FC1FF;}
  .badge.caja{background:#3A2E12; color:#E8B339;}
  .finance-acc-card{background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:16px; min-width:160px;}
  .finance-acc-card .acc-name{font-size:11.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.3px; font-weight:700; margin-bottom:6px;}
  .finance-acc-card .acc-balance{font-family:var(--mono); font-size:22px; font-weight:600;}
  .finance-acc-card .acc-balance.neg{color:var(--loss);}
  .finance-total-card{background:var(--accent-dim); border:1px solid var(--accent); border-radius:10px; padding:16px; min-width:200px;}
  .finance-total-card .acc-name{color:var(--accent-light);}
  .finance-total-card .acc-balance{color:var(--accent); font-size:26px;}
  .badge.simple{background:var(--surface-2); color:var(--muted);}
  .result-select{padding:4px 10px; border-radius:20px; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.3px; border:1px solid transparent; cursor:pointer; font-family:var(--body);}
  .result-select.pending{background:#4A3B14; color:var(--pending);}
  .result-select.won{background:var(--accent-dim); color:var(--accent);}
  .result-select.lost{background:var(--loss-dim); color:#FF8A8E;}
  .combo-line-row{display:flex; gap:8px; margin-bottom:8px; align-items:center;}
  .search-wrap{position:relative; margin-bottom:16px; max-width:460px;}
  .search-wrap input{width:100%; padding:10px 14px 10px 38px; background:var(--surface); border:1px solid var(--border); border-radius:8px; color:var(--text); font-size:14px; font-family:var(--body);}
  .search-wrap input:focus{outline:none; border-color:var(--accent);}
  .search-icon{position:absolute; left:12px; top:50%; transform:translateY(-50%); font-size:14px; opacity:.7; pointer-events:none;}
  .day-tabs{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px;}
  .day-tab{padding:8px 14px; border-radius:8px; background:var(--surface-2); border:1px solid var(--border); color:var(--muted); font-size:12.5px; font-weight:700; cursor:pointer; white-space:nowrap;}
  .day-tab:hover{border-color:var(--accent);}
  .day-tab.active{background:var(--accent-dim); border-color:var(--accent); color:var(--accent-light);}
  .day-tab .day-tab-sub{font-weight:500; opacity:.75; margin-left:4px;}

  /* Forms / filters */
  .toolbar{display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:16px; gap:16px; flex-wrap:wrap;}
  .filters{display:flex; gap:10px; align-items:flex-end; flex-wrap:wrap;}
  .filters .field{margin-bottom:0;}
  .filters input{padding:8px 10px; font-size:13px;}
  .btn{background:var(--accent); color:#1A1206; border:none; padding:10px 18px; border-radius:6px; font-weight:700; font-size:13.5px; cursor:pointer; font-family:var(--body);}
  .btn:hover{filter:brightness(1.1);}
  .btn.secondary{background:var(--surface-2); color:var(--text); border:1px solid var(--border);}
  .btn.small{padding:5px 10px; font-size:12px;}
  .btn.danger{background:transparent; color:var(--loss); border:1px solid var(--loss-dim);}

  .modal-overlay{display:none; position:fixed; inset:0; background:rgba(0,0,0,.6); align-items:center; justify-content:center; z-index:50;}
  .modal-overlay.open{display:flex;}
  .modal{background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:24px; width:420px; max-height:85vh; overflow-y:auto;}
  .modal h3{font-family:var(--display); text-transform:uppercase; letter-spacing:.5px; margin-bottom:18px; font-size:18px; font-weight:800;}
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:12px; color:var(--muted); margin-bottom:6px; text-transform:uppercase; letter-spacing:.4px; font-weight:600;}
  .field input, .field select, .field textarea{width:100%; background:var(--bg); border:1px solid var(--border); border-radius:6px; padding:9px 10px; color:var(--text); font-family:var(--body); font-size:14px;}
  .field textarea{resize:vertical; min-height:60px;}
  .modal-actions{display:flex; gap:10px; margin-top:20px;}
  .modal-actions .btn{flex:1;}

  .empty{color:var(--muted); font-size:13px; padding:24px; text-align:center;}
  .loading{color:var(--muted); font-size:13px; padding:24px; text-align:center;}
  .row-actions{display:flex; gap:6px;}
  .list-item{padding:12px 0; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:flex-start;}
  .list-item:last-child{border-bottom:none;}
  .list-item .desc{font-size:14px; margin-bottom:3px;}
  .list-item .meta{font-size:12px; color:var(--muted);}

  /* ---------- Efectos "más modernos" (brillos / destellos) ---------- */
  @keyframes glowPulse{0%,100%{box-shadow:0 0 0 0 rgba(212,175,106,.0), 0 2px 10px rgba(0,0,0,.25);} 50%{box-shadow:0 0 22px 2px rgba(212,175,106,.45), 0 2px 10px rgba(0,0,0,.25);}}
  @keyframes shine{0%{transform:translateX(-120%) skewX(-18deg);} 100%{transform:translateX(220%) skewX(-18deg);}}
  @keyframes floatGlow{0%,100%{opacity:.55;} 50%{opacity:1;}}
  @keyframes borderSheen{0%{background-position:0% 50%;} 100%{background-position:200% 50%;}}

  .brand img{filter:drop-shadow(0 0 10px rgba(212,175,106,.55));}
  .brand-text{position:relative;}

  .nav-item{position:relative; transition:color .18s, background .18s, box-shadow .18s;}
  .nav-item.active{box-shadow:inset 3px 0 0 var(--accent), 0 0 18px -4px rgba(212,175,106,.55); text-shadow:0 0 12px rgba(212,175,106,.5);}
  .nav-item:hover{text-shadow:0 0 10px rgba(212,175,106,.35);}

  .card{position:relative; overflow:hidden; transition:border-color .2s, box-shadow .2s, transform .2s; animation:glowPulse 6s ease-in-out infinite;}
  .card:hover{border-color:rgba(212,175,106,.55); box-shadow:0 0 0 1px rgba(212,175,106,.25), 0 10px 30px -10px rgba(212,175,106,.35); transform:translateY(-1px);}

  .btn{position:relative; overflow:hidden; isolation:isolate; box-shadow:0 0 16px -2px rgba(212,175,106,.6), 0 2px 8px rgba(0,0,0,.3); transition:box-shadow .2s, transform .15s;}
  .btn:not(.secondary):not(.danger)::after{
    content:''; position:absolute; top:0; left:0; width:40%; height:100%;
    background:linear-gradient(120deg, transparent, rgba(255,255,255,.55), transparent);
    animation:shine 3.2s ease-in-out infinite; animation-delay:1s; pointer-events:none;
  }
  .btn:hover{box-shadow:0 0 26px 0 rgba(212,175,106,.85), 0 2px 10px rgba(0,0,0,.35); transform:translateY(-1px);}
  .btn:active{transform:translateY(0px) scale(.98);}
  .btn.danger:hover{box-shadow:0 0 18px -2px rgba(229,72,77,.65);}

  .score-value.win{text-shadow:0 0 14px rgba(212,175,106,.55);}
  .score-value.loss{text-shadow:0 0 14px rgba(229,72,77,.5);}

  .page-title{position:relative; display:inline-block;}
  .page-title::after{content:''; position:absolute; left:0; bottom:-6px; width:46px; height:3px; border-radius:3px; background:linear-gradient(90deg, var(--accent), transparent); box-shadow:0 0 10px rgba(212,175,106,.7);}

  .day-tab.active{box-shadow:0 0 14px -2px rgba(212,175,106,.6); border-color:var(--accent);}

  .badge.won{box-shadow:0 0 10px -2px rgba(212,175,106,.5);}

  ::-webkit-scrollbar{width:10px; height:10px;}
  ::-webkit-scrollbar-track{background:var(--bg);}
  ::-webkit-scrollbar-thumb{background:linear-gradient(180deg, var(--accent), var(--accent-dim)); border-radius:10px;}

  /* ---------- Actividades Diarias ---------- */
  .task-priority{
    flex-shrink:0; width:26px; height:26px; border-radius:50%; background:var(--accent-dim); color:var(--accent);
    display:flex; align-items:center; justify-content:center; font-weight:800; font-size:12.5px; font-family:var(--display);
    box-shadow:0 0 10px -2px rgba(212,175,106,.5);
  }
  .task-row{
    flex:1; display:flex; align-items:center; gap:14px; padding:13px 14px; border-radius:8px; margin-bottom:8px;
    background:var(--surface-2); border:1px solid var(--border); cursor:pointer; transition:border-color .18s, background .18s, transform .12s;
  }
  .task-row:hover{border-color:rgba(212,175,106,.5); transform:translateX(2px);}
  .task-row.done{background:var(--accent-dim); border-color:var(--accent);}
  .task-check{
    flex-shrink:0; width:24px; height:24px; border-radius:6px; border:2px solid var(--border);
    display:flex; align-items:center; justify-content:center; color:var(--accent); font-weight:800; font-size:14px;
  }
  .task-row.done .task-check{border-color:var(--accent); box-shadow:0 0 10px -1px rgba(212,175,106,.6);}
  .task-info{flex:1;}
  .task-label{font-size:14px; font-weight:600;}
  .task-row.done .task-label{color:var(--accent-light); text-decoration:line-through; text-decoration-color:rgba(212,175,106,.5);}
  .task-detail{font-size:12px; color:var(--muted); margin-top:2px;}
  .task-time{flex-shrink:0; font-size:11.5px; color:var(--muted); font-weight:700; text-transform:uppercase; letter-spacing:.3px;}
  .task-row.done .task-time{color:var(--accent);}
  .task-amount{flex-shrink:0; font-size:12.5px; font-weight:800; color:var(--accent); background:var(--accent-dim); padding:4px 10px; border-radius:20px; font-family:var(--mono);}
  .task-row.readonly{cursor:default;}
  .task-row.readonly:hover{transform:none; border-color:var(--border);}

  .date-nav{display:flex; align-items:center; gap:8px; background:var(--surface-2); border:1px solid var(--border); border-radius:8px; padding:4px 6px;}
  .date-nav-label{font-size:12.5px; font-weight:700; color:var(--text); min-width:120px; text-align:center; text-transform:capitalize;}
  .date-nav .btn{padding:5px 10px; font-size:13px;}
  .btn:disabled{opacity:.35; cursor:not-allowed; box-shadow:none; filter:none;}
  .btn:disabled::after{display:none;}

  /* ---- Win: pantalla completa del asistente ---- */
  .win-fullscreen{
    min-height:calc(100vh - 60px); display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; position:relative; padding:20px;
  }
  /* Fondo tipo HUD: una cuadrícula tenue centrada en el reactor + una línea de escaneo que
     sube y baja sola -- le mete más "energía" de fondo sin competir con el reactor, que
     sigue siendo lo único realmente vistoso de la pantalla. */
  .win-fullscreen::before{
    content:''; position:absolute; inset:0; z-index:-1; pointer-events:none;
    background-image:
      linear-gradient(rgba(212,175,106,.07) 1px, transparent 1px),
      linear-gradient(90deg, rgba(212,175,106,.07) 1px, transparent 1px);
    background-size:46px 46px;
    -webkit-mask:radial-gradient(ellipse 58% 60% at 50% 46%, #000 0%, transparent 72%);
            mask:radial-gradient(ellipse 58% 60% at 50% 46%, #000 0%, transparent 72%);
  }
  .win-fullscreen::after{
    content:''; position:absolute; left:6%; right:6%; height:1px; z-index:-1; pointer-events:none; top:8%;
    background:linear-gradient(90deg, transparent, rgba(255,222,160,.55), transparent);
    animation:winScanline 7s ease-in-out infinite;
  }
  @keyframes winScanline{
    0%,4%{ top:8%; opacity:0; } 10%{ opacity:.55; } 48%{ top:92%; opacity:.55; } 54%{ opacity:0; } 100%{ top:92%; opacity:0; }
  }
  .win-corner-icons{ position:absolute; top:0; right:0; display:flex; gap:10px; }

  /* Pantalla de Win fija: nada de scroll arriba/abajo, todo centrado y los iconos (menú a la
     izquierda, bandeja/recordatorios/memoria a la derecha) a la misma altura. */
  body.win-locked{ overflow:hidden; }
  body.win-locked #app{ height:100vh; height:100dvh; overflow:hidden; }
  body.win-locked #main{ overflow:hidden; display:flex; }
  body.win-locked .win-fullscreen{ min-height:0; height:100%; width:100%; padding:16px; }
  @media (max-width: 860px){
    .win-corner-icons{ position:fixed; top:calc(env(safe-area-inset-top, 0px) + 14px); right:14px; z-index:45; }
  }
  .win-icon-btn{
    position:relative; width:42px; height:42px; border-radius:50%; background:var(--surface-2);
    border:1px solid var(--border); color:var(--text); font-size:17px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; transition:border-color .15s, transform .15s;
  }
  .win-icon-btn:hover{ border-color:var(--accent); transform:translateY(-1px); }
  .win-icon-badge{
    position:absolute; top:-4px; right:-4px; background:var(--loss); color:#fff; font-size:10.5px; font-weight:800;
    border-radius:20px; min-width:18px; height:18px; display:flex; align-items:center; justify-content:center; padding:0 4px;
  }
  .win-brand{
    display:flex; align-items:center; gap:9px; margin-bottom:8px;
    font-family:var(--mono); font-size:13px; letter-spacing:3px; font-weight:600; color:var(--accent-light);
  }
  .win-brand-dot{
    width:7px; height:7px; border-radius:50%; background:var(--muted); box-shadow:0 0 0 rgba(212,175,106,0);
    transition: background .3s ease, box-shadow .3s ease;
  }
  .win-brand-dot-idle{ background:var(--accent-dim); box-shadow:0 0 8px rgba(212,175,106,.4); }
  .win-brand-dot-listening{ background:var(--accent); box-shadow:0 0 10px rgba(212,175,106,.9); animation:winDotPulse 1.6s ease-in-out infinite; }
  .win-brand-dot-thinking{ background:#fff6e2; box-shadow:0 0 12px rgba(255,235,195,.95); animation:winDotPulse .5s ease-in-out infinite; }
  .win-brand-dot-speaking{ background:#ffd27a; box-shadow:0 0 12px rgba(255,210,130,1); animation:winDotPulse .32s ease-in-out infinite; }
  .win-brand-dot-done{ background:#7adc96; box-shadow:0 0 10px rgba(120,220,150,.9); }
  @keyframes winDotPulse{ 0%,100%{ opacity:1; } 50%{ opacity:.35; } }

  .win-status{ margin-top:22px; font-size:15px; color:var(--muted); min-height:22px; max-width:560px; }
  .win-live-transcript{ font-size:13px; color:var(--accent); min-height:18px; margin-top:6px; max-width:560px; }
  .win-bars{ display:flex; align-items:flex-end; justify-content:center; gap:5px; height:20px; margin-top:14px; }
  .win-bar{ width:4px; min-height:3px; border-radius:2px; background:linear-gradient(180deg, var(--accent-light), var(--accent)); opacity:.3; transition:height .09s ease-out, opacity .2s ease; }
  .win-bars.win-bars-animate .win-bar{ animation:winBarIdle 1.1s ease-in-out infinite; opacity:.85; }
  .win-bars.win-bars-animate .win-bar:nth-child(1){ animation-delay:0s; }
  .win-bars.win-bars-animate .win-bar:nth-child(2){ animation-delay:.08s; }
  .win-bars.win-bars-animate .win-bar:nth-child(3){ animation-delay:.16s; }
  .win-bars.win-bars-animate .win-bar:nth-child(4){ animation-delay:.24s; }
  .win-bars.win-bars-animate .win-bar:nth-child(5){ animation-delay:.16s; }
  .win-bars.win-bars-animate .win-bar:nth-child(6){ animation-delay:.08s; }
  .win-bars.win-bars-animate .win-bar:nth-child(7){ animation-delay:0s; }
  @keyframes winBarIdle{ 0%,100%{ height:3px; } 50%{ height:19px; } }
  .win-type-toggle{
    margin-top:20px; background:transparent; border:none; color:var(--muted); font-size:12px;
    text-decoration:underline; cursor:pointer; opacity:.55;
  }
  .win-type-toggle:hover{ opacity:1; }

  .win-aura-wrap{ position:relative; width:420px; height:420px; display:flex; align-items:center; justify-content:center; }
  @media (max-width: 480px){ .win-aura-wrap{ transform:scale(0.72); } }
  .win-dial{
    position:absolute; width:396px; height:396px; border-radius:50%;
    background: repeating-conic-gradient(from 0deg, rgba(212,175,106,.6) 0deg 1.6deg, transparent 1.6deg 9deg);
    -webkit-mask: radial-gradient(circle, transparent 0 183px, #000 184px 195px, transparent 196px 100%);
            mask: radial-gradient(circle, transparent 0 183px, #000 184px 195px, transparent 196px 100%);
    animation: winDialSpin 50s linear infinite;
    z-index:0; opacity:.5;
  }
  .win-dial-inner{
    position:absolute; width:333px; height:333px; border-radius:50%;
    background: repeating-conic-gradient(from 0deg, rgba(255,220,150,.7) 0deg 3deg, transparent 3deg 14deg);
    -webkit-mask: radial-gradient(circle, transparent 0 151px, #000 152px 159px, transparent 160px 100%);
            mask: radial-gradient(circle, transparent 0 151px, #000 152px 159px, transparent 160px 100%);
    animation: winDialSpin 14s linear infinite reverse;
    z-index:0; opacity:.6;
  }
  @keyframes winDialSpin{ to{ transform:rotate(360deg); } }
  .win-ring{
    position:absolute; width:304px; height:304px; border-radius:50%; border:1px solid rgba(212,175,106,.45); opacity:0;
    animation: winRingPulse 2.8s ease-out infinite;
  }
  .win-ring-2{ animation-delay: 1.4s; }
  @keyframes winRingPulse{
    0%{ transform:scale(.55); opacity:.65; }
    100%{ transform:scale(1.35); opacity:0; }
  }

  /* ---- Ráfaga: cuando registras varios movimientos seguidos (cuadre, stakes) sin que Win
     tenga que hablar en cada uno, esto es la señal visual -- una onda verde que sale del
     reactor en cada registro, y una píldora con la cuenta mientras la ráfaga sigue viva. ---- */
  .win-shock-ring{
    position:absolute; width:260px; height:260px; border-radius:50%; z-index:2; pointer-events:none;
    border:2px solid rgba(120,220,150,.9); box-shadow:0 0 18px rgba(120,220,150,.7);
    opacity:0;
  }
  .win-shock-ring.win-shock-fire{ animation:winShockPulse .6s ease-out; }
  @keyframes winShockPulse{
    0%{ transform:scale(.72); opacity:.9; }
    100%{ transform:scale(1.5); opacity:0; }
  }
  .win-burst-badge{
    position:absolute; top:-6px; left:50%; transform:translate(-50%,-14px);
    display:flex; align-items:center; gap:6px; padding:5px 13px; border-radius:20px;
    background:rgba(15,28,20,.88); border:1px solid rgba(120,220,150,.55);
    color:#c8ffd8; font-family:var(--mono); font-size:12px; font-weight:700; letter-spacing:.5px;
    box-shadow:0 0 16px rgba(120,220,150,.35); opacity:0; pointer-events:none;
    transition:opacity .25s ease, transform .25s ease; z-index:3; white-space:nowrap;
  }
  .win-burst-badge.win-burst-show{ opacity:1; transform:translate(-50%,0); }
  .win-burst-badge .win-burst-dot{
    width:7px; height:7px; border-radius:50%; background:#7adc96; box-shadow:0 0 8px rgba(120,220,150,.95);
    animation:winDotPulse .7s ease-in-out infinite;
  }

  /* ---- Destellos: motas de energia que orbitan y titilan alrededor del nucleo, como un aura ---- */
  .win-sparks{ position:absolute; inset:0; z-index:1; pointer-events:none; }
  .win-spark{
    position:absolute; top:50%; left:50%; width:3px; height:3px; border-radius:50%;
    background:#fff6e2; box-shadow:0 0 6px 1.5px rgba(255,230,170,.95), 0 0 14px 3px rgba(212,175,106,.6);
    transform-origin:0 0;
    animation: winSparkOrbit linear infinite, winSparkTwinkle ease-in-out infinite;
    opacity:0;
  }
  @keyframes winSparkOrbit{ to{ transform: rotate(360deg) translateX(var(--spark-r)) rotate(-360deg); } }
  @keyframes winSparkTwinkle{ 0%,100%{ opacity:0; } 8%{ opacity:var(--spark-op,.9); } 50%{ opacity:calc(var(--spark-op,.9) * .35); } 92%{ opacity:0; } }
  .win-orb-listening ~ .win-sparks .win-spark, .win-orb.win-orb-listening + .win-sparks .win-spark{ filter:brightness(1.25); }

  .win-orb{
    width:260px; height:260px; border-radius:50%; margin:0 auto; cursor:pointer;
    background: radial-gradient(circle, #070502 0%, #0a0703 55%, transparent 76%);
    box-shadow: 0 0 55px -2px rgba(212,175,106,.6);
    transition: box-shadow .25s ease, filter .25s ease;
    transform: scale(0.82);
    filter: saturate(0.7) brightness(0.75);
    position:relative; z-index:1;
    display:flex; align-items:center; justify-content:center;
  }
  /* ---- Núcleo reactor: el anillo segmentado gira solo, sin cara -- la "ruedita" ---- */
  .win-reactor{ width:240px; height:240px; overflow:visible; }
  .win-reactor .r-seg{ stroke:rgba(212,175,106,.38); stroke-width:7; }
  .win-reactor .r-seg-on{ stroke:var(--accent-light); filter:drop-shadow(0 0 7px rgba(212,175,106,.9)); }
  .win-reactor .r-ring{ fill:none; stroke:var(--accent); stroke-width:1.6; opacity:.75; filter:drop-shadow(0 0 3px rgba(212,175,106,.6)); }
  .win-reactor .r-ring-in{ stroke-width:1.2; opacity:.55; }
  .win-reactor .r-tri{
    fill:rgba(212,175,106,.3); stroke:var(--accent-light); stroke-width:2.4; stroke-linejoin:round;
    filter:drop-shadow(0 0 14px rgba(212,175,106,.75));
  }
  .win-reactor .r-tri-in{ fill:rgba(255,246,226,.55); stroke:none; }
  .win-reactor .r-core{ fill:#fff6e2; filter:drop-shadow(0 0 8px rgba(255,246,226,1)); }
  .win-reactor .r-segs-group{ transform-box:fill-box; transform-origin:center; animation:winReactorSpin 14s linear infinite; }
  @keyframes winReactorSpin{ to{ transform:rotate(360deg); } }
  .win-reactor .r-core{ transform-box:fill-box; transform-origin:center; animation:winReactorPulse 3.2s ease-in-out infinite; }
  @keyframes winReactorPulse{ 0%,100%{ transform:scale(.85); opacity:.75; } 50%{ transform:scale(1.08); opacity:1; } }

  .win-orb-listening .win-reactor .r-segs-group{ animation-duration:5s; }
  .win-orb-listening .win-reactor .r-tri, .win-orb-listening .win-reactor .r-core{ filter:brightness(1.2); }

  .win-orb-thinking .win-reactor .r-segs-group{ animation-duration:1.1s; }
  .win-orb-thinking .win-reactor .r-core{ animation:winReactorPulse .5s ease-in-out infinite; }

  .win-orb-speaking .win-reactor .r-core, .win-orb-speaking .win-reactor .r-tri-in{
    animation:winReactorFlicker .22s ease-in-out infinite;
  }
  @keyframes winReactorFlicker{ 0%,100%{ opacity:.55; } 50%{ opacity:1; } }

  .win-orb-done .win-reactor .r-tri{ fill:rgba(120,220,150,.35); }
  .win-orb-done .win-reactor .r-core{ fill:#c8ffd8; filter:drop-shadow(0 0 10px rgba(120,220,150,1)); animation:none; }

  .win-orb.win-orb-idle{ animation: winOrbBreathe 3.6s ease-in-out infinite; }
  @keyframes winOrbBreathe{
    0%,100%{ transform:scale(0.8); filter:saturate(0.65) brightness(0.72); }
    50%{ transform:scale(0.86); filter:saturate(0.75) brightness(0.8); }
  }
  .win-orb.win-orb-listening{
    animation: winOrbHue 3.2s ease-in-out infinite;
    box-shadow: 0 0 85px 0px rgba(212,175,106,.95), inset 0 0 32px rgba(255,255,255,.18);
  }
  @keyframes winOrbHue{
    0%,100%{ filter:saturate(1.15) brightness(1.05) hue-rotate(0deg); transform:scale(0.95); }
    50%{ filter:saturate(1.35) brightness(1.18) hue-rotate(14deg); transform:scale(1.0); }
  }
  .win-orb.win-orb-thinking{
    animation: winOrbSpin 1s linear infinite, winOrbPulseFast 0.65s ease-in-out infinite;
    box-shadow: 0 0 90px -2px rgba(212,175,106,1), inset 0 0 32px rgba(255,255,255,.22);
  }
  .win-orb.win-orb-speaking{
    animation: winOrbPulseFast 0.42s ease-in-out infinite;
    filter:saturate(1.3) brightness(1.25);
    box-shadow: 0 0 100px 0px rgba(255,210,130,1), inset 0 0 32px rgba(255,255,255,.3);
  }
  @keyframes winOrbSpin{ 0%{ background-position:0 0; } 100%{ background-position:40px 40px; } }
  @keyframes winOrbPulseFast{ 0%,100%{ transform:scale(0.96); } 50%{ transform:scale(1.1); } }
  .win-orb.win-orb-done{
    filter:saturate(1.3) brightness(1.2);
    box-shadow: 0 0 95px 4px rgba(120,220,150,.9), inset 0 0 32px rgba(255,255,255,.2);
  }

  /* ---- Secuencia de encendido: solo la primera vez que se activa el micrófono ---- */
  .win-orb.win-boot-in{ animation: winBootOrb .9s cubic-bezier(.34,1.56,.64,1) both; }
  @keyframes winBootOrb{
    0%{ transform:scale(.12); filter:saturate(0) brightness(2); opacity:0; }
    50%{ transform:scale(.92); opacity:1; filter:saturate(1.2) brightness(1.3); }
    72%{ transform:scale(.74); }
    100%{ transform:scale(.95); filter:saturate(1.15) brightness(1.05); }
  }
  .win-orb.win-boot-in .win-reactor .r-core{ animation: winBootCoreOn .9s ease-out both; }
  @keyframes winBootCoreOn{ 0%{ transform:scale(0); opacity:0; } 60%{ transform:scale(0); opacity:0; } 100%{ transform:scale(.85); opacity:.75; } }
  .win-orb.win-boot-in .win-reactor .r-ring, .win-orb.win-boot-in .win-reactor .r-tri, .win-orb.win-boot-in .win-reactor .r-seg{
    animation: winBootLineFade .9s ease-out both;
  }
  @keyframes winBootLineFade{ 0%{ opacity:0; } 65%{ opacity:0; } 100%{ opacity:1; } }
  .win-aura-wrap.win-booting .win-ring{ animation: winBootRing .9s ease-out both; }
  @keyframes winBootRing{
    0%{ transform:scale(.3); opacity:0; }
    60%{ transform:scale(1); opacity:.8; }
    100%{ transform:scale(1.35); opacity:0; }
  }

  /* ---- Pantalla de arranque "tipo Jarvis": barra de carga + anillos que arman el nombre.
     Se reproduce cada vez que se activa el micrófono, encima de todo, y se disuelve sola. ---- */
  .win-intro{
    position:absolute; inset:0; z-index:40; display:none; overflow:hidden;
    background:#050402; border-radius:inherit;
    transition:opacity .7s ease, filter .7s ease;
  }
  .win-intro-bar{
    position:absolute; top:16%; left:0; right:0; padding:0 min(8vw,90px);
    transition:opacity .5s ease, filter .5s ease;
  }
  .win-intro-bar-dim{ opacity:.25; filter:blur(.6px); }
  .win-intro-frame{
    position:relative; border-top:1.5px solid var(--accent); border-bottom:1.5px solid var(--accent);
    padding:13px 20px 11px; clip-path:polygon(3% 0, 97% 0, 100% 42%, 97% 100%, 3% 100%, 0 42%);
    box-shadow: inset 0 0 40px rgba(212,175,106,.12), 0 0 30px rgba(212,175,106,.18);
  }
  .win-intro-title{
    display:inline-flex; align-items:center; font-family:var(--mono); font-size:clamp(13px,2.8vw,20px);
    font-weight:500; letter-spacing:.1em; color:var(--accent-light); text-shadow:0 0 20px rgba(212,175,106,.6);
  }
  .win-intro-dots{ opacity:.6; margin:0 .2em; }
  .win-intro-cursor{
    display:inline-block; width:.5em; height:.9em; margin-left:.15em; background:var(--accent);
    animation:winIntroBlink .7s steps(1) infinite;
  }
  @keyframes winIntroBlink{ 50%{ opacity:0; } }
  .win-intro-seg{ display:flex; gap:3px; margin-top:11px; }
  .win-intro-seg-cell{
    flex:1; height:9px; border:1px solid rgba(212,175,106,.45);
    animation: winIntroSegOn .12s ease forwards;
  }
  @keyframes winIntroSegOn{ to{ background:var(--accent); box-shadow:0 0 10px var(--accent); } }
  .win-intro-log{
    margin-top:11px; font-family:var(--mono); font-size:10px; line-height:1.85; letter-spacing:.04em;
    color:var(--accent-light); opacity:.65;
  }
  .win-intro-log-line{ opacity:0; animation: winIntroLogIn .3s ease forwards; }
  .win-intro-log-line::before{ content:'\203a  '; opacity:.5; }
  @keyframes winIntroLogIn{ from{ opacity:0; transform:translateX(-8px); } to{ opacity:1; transform:translateX(0); } }

  .win-intro-rings-wrap{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    opacity:0; transition:opacity .4s ease;
  }
  .win-intro-rings-wrap.win-intro-rings-in{ opacity:1; }
  .win-intro-rings{ width:min(52vmin,380px); height:min(52vmin,380px); overflow:visible; }
  .win-intro-ring{
    fill:none; stroke:var(--accent); opacity:0; transform-box:fill-box; transform-origin:center;
    filter:drop-shadow(0 0 4px rgba(212,175,106,.5));
    animation:winIntroRingIn .7s ease-out forwards;
  }
  .win-intro-ring:nth-child(1){ animation-delay:0s; }
  .win-intro-ring:nth-child(2){ animation-delay:.08s; }
  .win-intro-ring:nth-child(3){ animation-delay:.16s; }
  .win-intro-ring:nth-child(4){ animation-delay:.24s; }
  .win-intro-ring:nth-child(5){ animation-delay:.34s; }
  @keyframes winIntroRingIn{ from{ opacity:0; transform:rotate(-40deg) scale(1.15); } to{ opacity:.8; transform:rotate(0) scale(1); } }
  .win-intro-name{
    fill:var(--accent-light); font-family:var(--mono); font-size:19px; text-anchor:middle; dominant-baseline:middle;
    opacity:0; letter-spacing:1.3em; animation:winIntroNameIn .7s ease-out forwards; animation-delay:.5s;
    text-shadow:0 0 14px rgba(212,175,106,.6);
  }
  @keyframes winIntroNameIn{ to{ opacity:1; letter-spacing:.5em; } }

  /* =====================================================================
     Win -- versión 2: más profundidad, dock de cristal con iconos de línea, esfera de partículas
     que reacciona a la voz, y menos carga para el navegador.
     ===================================================================== */
  body.win-locked #main{
    background:
      radial-gradient(ellipse 62% 56% at 50% 44%, rgba(212,175,106,.11), transparent 72%),
      radial-gradient(ellipse 90% 38% at 50% 112%, rgba(212,175,106,.09), transparent 70%),
      radial-gradient(ellipse 120% 90% at 50% 50%, transparent 55%, rgba(0,0,0,.45) 100%);
  }
  .win-fx{ position:absolute; left:50%; top:50%; width:520px; height:520px; margin:-260px 0 0 -260px; z-index:0; pointer-events:none; }
  @media (min-width:1100px) and (min-height:820px){ .win-aura-wrap{ transform:scale(1.16); margin:44px 0; } }

  .win-brand{ font-size:15px; letter-spacing:.7em; padding-left:.7em; margin-bottom:12px; gap:12px; color:var(--accent-light); text-shadow:0 0 18px rgba(212,175,106,.55); }
  .win-brand::before, .win-brand::after{ content:''; width:54px; height:1px; background:linear-gradient(90deg, transparent, rgba(212,175,106,.7)); }
  .win-brand::after{ background:linear-gradient(270deg, transparent, rgba(212,175,106,.7)); }
  .win-brand-dot{ order:-1; margin-right:-4px; }
  .win-status{ font-size:16px; color:rgba(231,236,242,.8); letter-spacing:.01em; margin-top:18px; }
  .win-live-transcript{ font-family:var(--mono); font-size:12.5px; }

  /* Dock de cristal con iconos de línea (reemplaza los emojis) */
  .win-corner-icons{
    top:16px; right:18px; gap:2px; padding:6px; border-radius:18px; z-index:30;
    background:linear-gradient(180deg, rgba(30,37,50,.74), rgba(14,18,26,.74));
    border:1px solid rgba(212,175,106,.24);
    -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px);
    box-shadow:0 14px 34px -14px rgba(0,0,0,.85), inset 0 1px 0 rgba(255,255,255,.06);
  }
  .win-icon-btn{
    width:40px; height:40px; border-radius:12px; background:transparent; border:1px solid transparent;
    color:var(--accent-light); transition:background .18s ease, color .18s ease, transform .18s ease, box-shadow .18s ease;
  }
  .win-icon-btn:hover{ background:rgba(212,175,106,.14); color:#fff; border-color:transparent; transform:translateY(-2px); box-shadow:0 8px 18px -10px rgba(212,175,106,.9); }
  .win-icon-btn:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  .win-ico{ width:21px; height:21px; display:block; }
  .win-icon-btn::after{
    content:attr(data-label); position:absolute; top:calc(100% + 10px); left:50%; transform:translate(-50%,-4px);
    white-space:nowrap; font:500 12px var(--body); color:var(--text); padding:6px 10px; border-radius:8px;
    background:rgba(10,13,19,.94); border:1px solid rgba(212,175,106,.3); opacity:0; pointer-events:none;
    transition:opacity .15s ease, transform .15s ease;
  }
  .win-icon-btn:hover::after{ opacity:1; transform:translate(-50%,0); }
  .win-icon-badge{ top:1px; right:1px; min-width:16px; height:16px; font-size:10px; background:var(--accent); color:#1A1206; box-shadow:0 0 10px rgba(212,175,106,.7); }
  .win-icon-badge.win-badge-alert{ background:var(--loss); color:#fff; box-shadow:0 0 10px rgba(229,72,77,.7); }

  @media (max-width:820px){
    .win-corner-icons{
      position:fixed; top:auto; right:auto; left:50%; transform:translateX(-50%);
      bottom:calc(env(safe-area-inset-bottom, 0px) + 12px); gap:0; padding:5px;
    }
    .win-icon-btn{ width:38px; height:38px; }
    .win-icon-btn::after{ display:none; }
    body.win-locked .win-fullscreen{ padding-bottom:84px; }
  }

  /* Botones de encendido */
  .win-power-row{ display:flex; gap:10px; justify-content:center; margin-top:16px; }
  .win-power-btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px; min-width:132px; padding:10px 20px;
    border-radius:999px; font:600 13px var(--body); letter-spacing:.02em; cursor:pointer;
    transition:box-shadow .2s ease, transform .2s ease, opacity .2s ease, border-color .2s ease, color .2s ease;
  }
  .win-group-picker label{ justify-content:flex-start !important; text-align:left !important; }
  .win-group-picker input[type=checkbox]{ width:auto !important; flex:0 0 auto; margin:0; }
  .win-quick-row{ display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:12px; }
  .win-quick-btn{ display:inline-flex; align-items:center; gap:8px; padding:11px 18px; border-radius:12px; border:1px solid rgba(212,175,106,.35); background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.02)); color:#f3ead6; font:600 13px 'Chakra Petch',sans-serif; cursor:pointer; transition:.18s; }
  .win-quick-btn svg{ width:18px; height:18px; color:var(--accent); }
  .win-quick-btn:hover{ transform:translateY(-2px); border-color:var(--accent); box-shadow:0 10px 22px -12px rgba(212,175,106,.9); }
  .win-quick-btn:focus-visible{ outline:2px solid var(--accent); outline-offset:3px; }
  .win-power-btn svg{ width:16px; height:16px; }
  #winPowerOnBtn{
    color:var(--accent-light); border:1px solid rgba(212,175,106,.7);
    background:linear-gradient(180deg, rgba(212,175,106,.28), rgba(212,175,106,.08));
    box-shadow:0 0 26px -8px rgba(212,175,106,.8), inset 0 1px 0 rgba(255,255,255,.12);
  }
  #winPowerOnBtn:hover:not(:disabled){ transform:translateY(-1px); box-shadow:0 0 34px -6px rgba(212,175,106,.95), inset 0 1px 0 rgba(255,255,255,.18); }
  #winPowerOffBtn{ color:var(--muted); border:1px solid rgba(255,255,255,.14); background:rgba(255,255,255,.03); }
  #winPowerOffBtn:hover:not(:disabled){ color:#ff8d92; border-color:rgba(229,72,77,.7); box-shadow:0 0 22px -8px rgba(229,72,77,.8); }
  .win-power-btn:disabled{ opacity:.35; cursor:default; box-shadow:none; }
  .win-power-btn:focus-visible{ outline:2px solid var(--accent); outline-offset:3px; }

  /* Lectura de datos reales abajo a la izquierda */
  .win-hud{
    position:absolute; left:26px; bottom:22px; text-align:left; font-family:var(--mono); font-size:11.5px; line-height:1.9;
    color:var(--muted); letter-spacing:.03em; padding-left:12px; border-left:1px solid rgba(212,175,106,.45);
  }
  .win-hud b{ color:var(--accent-light); font-weight:500; }
  @media (max-width:820px){ .win-hud{ display:none; } }

  /* Menos carga: el brillo del orbe ya no cambia de tono (eso repintaba toda la capa) */
  @keyframes winOrbHue{
    0%,100%{ filter:saturate(1.15) brightness(1.05); transform:scale(0.95); }
    50%{ filter:saturate(1.3) brightness(1.18); transform:scale(1.0); }
  }

function maskName(name){
  if(!name) return '-';
  return String(name).trim().split(/\s+/).map(w => w[0] ? (w[0].toUpperCase() + '*'.repeat(Math.max(w.length-1,2))) : '').join(' ');
}
function maskPhone(phone){
  if(!phone) return '-';
  const digits = String(phone).trim();
  if(digits.length <= 2) return '*'.repeat(digits.length);
  return '*'.repeat(digits.length-2) + digits.slice(-2);
}

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

// Si Google Sheets (o el bot) se queda sin responder, esto evita que un botón se quede pegado
// en "Cargando..." para siempre -- a los `ms` milisegundos, rechaza con un mensaje claro en vez
// de dejar al jefe esperando sin saber si pasó algo o no.
function withTimeout(promise, ms, msg){
  return Promise.race([
    promise,
    new Promise((_, reject) => setTimeout(()=>reject(new Error(msg || `Tardó más de ${Math.round(ms/1000)} segundos -- puede que la hoja de cálculo no esté respondiendo.`)), ms))
  ]);
}

function fmtDateTime(iso){
  if(!iso) return '-';
  try{ return new Date(iso).toLocaleString('es-EC',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}); }catch(e){ return '-'; }
}
// OJO: "new Date('2026-10-11')" lo interpreta como medianoche UTC, y acá en Ecuador (UTC-5)
// eso cae en el día ANTERIOR al mostrarlo — por eso las fechas salían un día atrás. Si viene
// en formato YYYY-MM-DD, se arma la fecha con los números directos (como fecha local), sin
// pasar por ese parseo que resta horas.
function fmtDate(d){
  if(!d) return '-';
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(d));
  const dt = m ? new Date(Number(m[1]), Number(m[2])-1, Number(m[3])) : new Date(d);
  return dt.toLocaleDateString('es-EC',{day:'2-digit',month:'short',year:'numeric'});
}

function coerceRow(key, row){
  if(key === 'vips'){
    return { id:String(row.id||''), name:row.name||'', contact:row.contact||'', cedula:row.cedula||'', city:row.city||'', plan:row.plan||'mensual', joinDate:row.joinDate||'', notes:row.notes||'', status:row.status||'active', noReconsumo: row.noReconsumo===true||row.noReconsumo==='true', giftPending: row.giftPending===true||row.giftPending==='true', removidoVip: String(row.removidoVip||'') };
  }
  if(key === 'freeBets' || key === 'vipBets' || key === 'liveBets'){
    return { id:String(row.id||''), sport:row.sport||'', event:row.event||'', betType: row.betType==='combo' ? 'combo' : 'simple', pick:row.pick||'', odds:Number(row.odds)||0, stake:Number(row.stake)||0, date:row.date||'', result:row.result||'pending', lines: typeof row.lines==='string' ? row.lines : (row.lines ? JSON.stringify(row.lines) : '[]'), imageUrl:String(row.imageUrl||''), returned:Number(row.returned)||0, ganancia:Number(row.ganancia)||0 };
  }
  if(key === 'stakeSales'){
    // name/phone forzados a String: si en la hoja alguien quedó con el nombre o el teléfono
    // guardado como número (ej. un nombre que es puro dígitos), JSON.parse los trae como number,
    // no como string -- y un .trim() más adelante (ver getKnownBuyers) tronaba con "no es una
    // función" sobre ese valor, dejando sin cargar a TODOS los compradores, no solo a ese.
    return { id:String(row.id||''), sectionId:String(row.sectionId||''), day:row.day||'', name:String(row.name||''), phone:String(row.phone||''), amount:Number(row.amount)||0, status:row.status||'paid' };
  }
  if(key === 'stakeSections'){
    return { id:String(row.id||''), day:row.day||'', title:row.title||'Stake', price:Number(row.price)||0 };
  }
  if(key === 'stakes'){
    return { id:String(row.id||''), description:row.description||'', amount:Number(row.amount)||0, date:row.date||'', result:row.result||'pending', imageUrl:String(row.imageUrl||'') };
  }
  if(key === 'financeMovements'){
    return { id:String(row.id||''), date:row.date||'', accountId:row.accountId||'', type:row.type==='out'?'out':'in', amount:Number(row.amount)||0, note:row.note||'', transferId:row.transferId||'', comprobanteNumero:row.comprobanteNumero||'', receiptImage:row.receiptImage||'', createdAt:row.createdAt||'', createdBy:row.createdBy||'' };
  }
  if(key === 'winGanadas'){
    return { id:String(row.id||''), date:String(row.date||'').slice(0,10), caption:String(row.caption||''), imageUrl:String(row.imageUrl||''), grupos:String(row.grupos||''), status:row.status||'pendiente', publishedAt:String(row.publishedAt||'') };
  }
  if(key === 'novedades'){
    return { id:String(row.id||''), tipo:String(row.tipo||'info'), titulo:String(row.titulo||''), detalle:String(row.detalle||''), createdAt:String(row.createdAt||''), leido: row.leido===true||row.leido==='true' };
  }
  if(key === 'winOutbox'){
    return { id:String(row.id||''), kind:row.kind||'otro', destino:row.destino||'', caption:row.caption||'', image:row.image||'', status:row.status||'pendiente', createdAt:row.createdAt||'' };
  }
  if(key === 'winReminders'){
    return { id:String(row.id||''), text:row.text||'', dueDate:row.dueDate||'', dueTime:row.dueTime||'', done: row.done===true||row.done==='true', createdAt:row.createdAt||'', tipo: row.tipo==='cita' ? 'cita' : 'recordatorio' };
  }
  if(key === 'winMemory'){
    return { id:String(row.id||''), text:row.text||'', createdAt:row.createdAt||'' };
  }
  if(key === 'winTemplates'){
    // "imageUrl" es la foto en buena calidad guardada en Vercel Blob (ver api/win-imagen.js) --
    // "base64" queda solo por compatibilidad con publicidades guardadas ANTES de este cambio
    // (esas sí quedaron comprimidas dentro de la celda; si el jefe quiere mejor calidad en
    // alguna vieja, tiene que volver a subirla).
    return {
      id:String(row.id||''), nombre:row.nombre||'', texto:row.texto||'',
      base64:row.base64||'', mediaType:row.mediaType||'image/jpeg', imageUrl:row.imageUrl||'', thumb:row.thumb||'',
      createdAt:row.createdAt||''
    };
  }
  if(key === 'winDifusion'){
    // "listas" es un string con los ids de lista separados por coma (ej: "fuertes,ecuabet") --
    // un mismo contacto puede estar en varias listas de difusión a la vez.
    // String(...) a la fuerza en nombre/telefono/listas -- un teléfono guardado sin el "0" de
    // adelante (ej: "991234567") puede volver de Sheets como NÚMERO en vez de texto, y un
    // .trim() más adelante (ver getDifusionContactos) tronaba con "no es una función", dejando
    // sin cargar la lista COMPLETA de difusión, no solo ese contacto.
    return { id:String(row.id||''), nombre:String(row.nombre||''), telefono:String(row.telefono||''), listas:String(row.listas||''), createdAt:row.createdAt||'' };
  }
  return { id:String(row.id||''), sport:row.sport||'', pick:row.pick||'', odds:Number(row.odds)||0, stake:Number(row.stake)||0, recipient:row.recipient||'', date:row.date||'', result:row.result||'pending', imageUrl:String(row.imageUrl||'') };
}

async function fetchSheetKey(key){
  try{
    const res = await fetch(`${SHEETS_API_URL}?sheet=${SHEET_NAMES[key]}`);
    const json = await res.json();
    state[key] = filtrarCorte(key, (json.data || []).map(row => coerceRow(key, row)));
  }catch(e){ console.error('Error cargando', key, e); state[key] = []; state.syncError = true; state.failedKeys.push(key); }
}

// Antes esto traía las 19 hojas de Google Sheets UNA POR UNA (await adentro de un for), así que
// la pantalla se quedaba en "Conectando..." casi 2 minutos antes de mostrar nada. Ahora se piden
// todas al mismo tiempo (Promise.all) -- y si entras directo a Win (ej. desde el acceso directo del
// celular), primero se cargan solo sus 3 hojitas (rapidísimo) y Win ya se muestra y funciona,
// mientras el resto del panel se sigue cargando atrás sin que tengas que esperarlo.
async function loadAll(){
  const main = document.getElementById('main');
  const winKeys = ['winMemory', 'winOutbox', 'winReminders', 'winTemplates', 'winDifusion', 'winGanadas'];
  const otherKeys = Object.keys(SHEET_NAMES).filter(k => !winKeys.includes(k));

  if(state.view === 'win'){
    await Promise.all(winKeys.map(fetchSheetKey));
    state.loaded = true;
    render();
    await Promise.all(otherKeys.map(fetchSheetKey));
    await migrateStakeSales();
    render();
    return;
  }

  main.innerHTML = '<div class="loading">Conectando con tu hoja de Google Sheets...</div>';
  await Promise.all(Object.keys(SHEET_NAMES).map(fetchSheetKey));
  await migrateStakeSales();
  state.loaded = true;
  render();
  animateCounts(document.getElementById('main'));
}

// IMPORTANTE (varios dispositivos a la vez): antes esto mandaba SIEMPRE el arreglo completo
// que tenía cada dispositivo en memoria, pisando entero lo que hubiera en la hoja. Si un
// dispositivo cargó con algún fallo de red, o simplemente llevaba un rato abierto mientras
// otro guardaba cosas nuevas, su próximo guardado borraba todo lo que el otro había agregado.
// Ahora, antes de guardar, se trae lo último del servidor y se MEZCLA: lo que edites/agregues
// tú manda, lo que hayan agregado otros dispositivos mientras tanto se conserva, y solo se
// quita lo que tú explícitamente borraste (deletedIds). "force:true" se usa nada más para un
// reinicio explícito (como "Reiniciar todo" en Cuadre Financiero), donde sí quieres pisarlo todo.
async function persist(key, options = {}){
  const deletedIds = options.deletedIds || [];
  const force = !!options.force;

  if(force){
    try{
      let aGuardar = state[key];
      if(CLAVES_CORTE.includes(key)){
        // lo anterior al corte NO se pisa nunca: se vuelve a guardar junto con lo nuevo
        const r = await fetch(`${SHEETS_API_URL}?sheet=${SHEET_NAMES[key]}`);
        const viejos = ((await r.json()).data || []).map(row => coerceRow(key, row)).filter(esAnteriorAlCorte);
        aGuardar = viejos.concat(state[key]);
      }
      await fetch(SHEETS_API_URL, {
        method: 'POST', mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ sheet: SHEET_NAMES[key], data: aGuardar })
      });
      state.syncError = false;
    }catch(e){
      console.error('Error guardando', key, e);
      state.syncError = true;
    }
    return;
  }

  try{
    let serverArr = null;
    try{
      const res = await fetch(`${SHEETS_API_URL}?sheet=${SHEET_NAMES[key]}`);
      const json = await res.json();
      serverArr = (json.data || []).map(row => coerceRow(key, row));
    }catch(e){
      serverArr = null; // no se pudo refrescar — se guarda igual lo que hay localmente, sin mezclar
    }
    if(!serverArr && CLAVES_CORTE.includes(key)){
      // sin poder leer el Excel no se guarda: así jamás se pisa lo anterior al corte
      state.syncError = true;
      return;
    }

    let toSend = state[key];
    if(serverArr){
      const map = new Map();
      serverArr.forEach(item => { if(item && item.id) map.set(item.id, item); });
      state[key].forEach(item => { if(item && item.id) map.set(item.id, item); }); // local manda sobre servidor
      deletedIds.forEach(id => map.delete(id));
      toSend = Array.from(map.values());
      state[key] = filtrarCorte(key, toSend); // lo anterior al corte se guarda pero no se muestra
    }

    await fetch(SHEETS_API_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ sheet: SHEET_NAMES[key], data: toSend })
    });
    state.syncError = false;
    render(); // por si llegó algo nuevo de otro dispositivo en la mezcla
  }catch(e){
    console.error('Error guardando', key, e);
    state.syncError = true;
  }
}

function exportCSV(key){
  const rows = state[key];
  if(!rows.length){ alert('No hay datos para exportar todavía.'); return; }
  const headers = Object.keys(rows[0]);
  const csvLines = [headers.join(',')].concat(
    rows.map(r => headers.map(h => `"${String(r[h]??'').replace(/"/g,'""')}"`).join(','))
  );
  const blob = new Blob([csvLines.join('\n')], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${SHEET_NAMES[key]}_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  URL.revokeObjectURL(url);
}

// ---------- Efectos suaves: lupa del dock, luz del cursor, números que suben, entrada de sección ----------
(function(){
  const fino = window.matchMedia && window.matchMedia('(hover:hover) and (pointer:fine)').matches;
  if(fino){
    const dock = document.getElementById('sidebar');
    const items = ()=>Array.prototype.slice.call(dock.querySelectorAll('.nav-item'));
    dock.addEventListener('pointermove', (e)=>{
      if(window.innerWidth <= 860) return;
      items().forEach(it=>{
        const r = it.getBoundingClientRect(), c = r.left + r.width/2;
        const k = Math.max(0, 1 - Math.abs(e.clientX - c)/120), q = k*k;
        it.style.setProperty('--s', (1 + 0.2*q).toFixed(3));
        it.style.setProperty('--ty', (-5*q).toFixed(1) + 'px');
      });
    }, { passive:true });
    dock.addEventListener('pointerleave', ()=>items().forEach(it=>{ it.style.removeProperty('--s'); it.style.removeProperty('--ty'); }));
    const glow = document.createElement('div'); glow.id = 'cursorGlow'; document.body.appendChild(glow);
    let gx = window.innerWidth/2, gy = window.innerHeight*0.4, raf = 0;
    glow.style.transform = `translate3d(${gx}px,${gy}px,0)`;
    window.addEventListener('pointermove', (e)=>{
      gx = e.clientX; gy = e.clientY;
      if(!raf) raf = requestAnimationFrame(()=>{ raf = 0; glow.style.transform = `translate3d(${gx}px,${gy}px,0)`; });
      const t = e.target && e.target.closest ? e.target.closest('.card, .score-cell, .finance-acc-card') : null;
      if(t){ const r = t.getBoundingClientRect(); t.style.setProperty('--mx', (e.clientX - r.left) + 'px'); t.style.setProperty('--my', (e.clientY - r.top) + 'px'); }
    }, { passive:true });
  }
})();
// Los números grandes del tablero suben de 0 hasta su valor (una vez por cambio de sección).
function animateCounts(root){
  if(!root || (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches)) return;
  root.querySelectorAll('.score-value').forEach(el=>{
    const txt = el.textContent.trim();
    const m = txt.match(/^(\D*?)(\d[\d,]*(?:\.\d+)?)(\D*)$/);
    if(!m) return;
    const target = parseFloat(m[2].replace(/,/g,'')); if(!isFinite(target) || target === 0) return;
    const dec = (m[2].split('.')[1] || '').length, t0 = performance.now(), dur = 650;
    const step = (now)=>{
      const k = Math.min(1, (now - t0)/dur), v = target * (1 - Math.pow(1 - k, 3));
      if(k < 1){ el.textContent = m[1] + v.toLocaleString('en-US', { minimumFractionDigits:dec, maximumFractionDigits:dec }) + m[3]; requestAnimationFrame(step); }
      else el.textContent = txt;
    };
    requestAnimationFrame(step);
  });
}

function filterByDate(rows, dateField, filterKey){
  const f = state.filters[filterKey];
  if(!f || (!f.from && !f.to)) return rows;
  return rows.filter(r=>{
    const d = r[dateField];
    if(!d) return false;
    if(f.from && d < f.from) return false;
    if(f.to && d > f.to) return false;
    return true;
  });
}

/* ---------- WEEK HELPERS ---------- */
function getWeekRange(){
  const now = new Date();
  const day = now.getDay(); // 0=Sun
  const diffToMonday = (day === 0 ? -6 : 1 - day);
  const monday = new Date(now); monday.setDate(now.getDate() + diffToMonday); monday.setHours(0,0,0,0);
  const sunday = new Date(monday); sunday.setDate(monday.getDate() + 6); sunday.setHours(23,59,59,999);
  return { start: monday, end: sunday };
}
function inCurrentWeek(dateStr){
  if(!dateStr) return false;
  const { start, end } = getWeekRange();
  const d = new Date(dateStr);
  return d >= start && d <= end;
}

const PLAN_MONTHS = { mensual:1, trimestral:3, anual:12 };
const DAILY_VIP_GROUPS = []; // ya no hay grupos VIP de 7 días (se quitaron VIP 1X2 y VIP 1XBET)
function isDailyGroup(key){ return DAILY_VIP_GROUPS.includes(key); }

function computeExpiration(v, key){
  if(!v.joinDate) return '';
  if(isDailyGroup(key)){
    const d = new Date(v.joinDate);
    d.setDate(d.getDate() + 7);
    return d.toISOString().slice(0,10);
  }
  const months = PLAN_MONTHS[(v.plan||'mensual').toLowerCase()] || 1;
  const d = new Date(v.joinDate);
  d.setMonth(d.getMonth() + months);
  return d.toISOString().slice(0,10);
}
function membershipStatus(v, key){
  const exp = computeExpiration(v, key);
  if(!exp) return { label:'-', cls:'', expired:false };
  const today = new Date().toISOString().slice(0,10);
  const daysLeft = Math.ceil((new Date(exp) - new Date(today)) / 86400000);
  const warnThreshold = isDailyGroup(key) ? 2 : 5;
  if(daysLeft < 0) return { label:'Vencida', cls:'inactive', exp, expired:true };
  if(daysLeft <= warnThreshold) return { label:`Vence en ${daysLeft}d`, cls:'pending', exp, expired:false };
  return { label:'Vigente', cls:'active', exp, expired:false };
}
// Estado real de un miembro: si su membresía ya venció, siempre se muestra Inactivo aunque el
// campo "status" guardado diga otra cosa (evita el bug de ver "Activo" con fecha vencida).
// Si aún no vence, respeta el estado manual (permite desactivar antes de tiempo).
function effectiveStatus(v, key){
  const m = membershipStatus(v, key);
  if(m.expired) return 'inactive';
  return v.status || 'active';
}

// ---------- Archivar miembros (se quitan del panel, pero quedan guardados en el Excel) ----------
// Los miembros que se "eliminan" ya no se borran del Excel: se copian a la hoja "VIPsArchivo"
// (con la fecha en que se archivaron) y SOLO DESPUÉS de comprobar que quedaron ahí se quitan de
// la hoja "VIPs", que es la que lee el panel.
const SHEET_VIPS_ARCHIVO = 'VIPsArchivo';
async function archivarMiembrosVip(ids){
  const lista = (state.vips || []).filter(v=>ids.includes(v.id));
  if(!lista.length) return { archivados: 0 };
  const ahora = new Date(Date.now() - 5*60*60*1000).toISOString().slice(0,10);
  // 1) leer lo que ya hay en el archivo (para no pisarlo) y mezclar
  let previo = [];
  try{
    const r = await fetch(`${SHEETS_API_URL}?sheet=${SHEET_VIPS_ARCHIVO}`);
    const j = await r.json();
    previo = (j.data || []);
  }catch(e){ throw new Error('No pude leer el archivo del Excel. No se borró nada.'); }
  const mapa = new Map();
  previo.forEach(x=>{ if(x && x.id) mapa.set(String(x.id), x); });
  lista.forEach(v=>mapa.set(String(v.id), { ...v, archivedAt: ahora }));
  await fetch(SHEETS_API_URL, {
    method:'POST', mode:'no-cors', headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify({ sheet: SHEET_VIPS_ARCHIVO, data: Array.from(mapa.values()) })
  });
  // 2) comprobar que de verdad quedaron guardados antes de quitarlos del panel
  await new Promise(ok=>setTimeout(ok, 2500));
  const chk = await (await fetch(`${SHEETS_API_URL}?sheet=${SHEET_VIPS_ARCHIVO}&t=${Date.now()}`)).json();
  const guardados = new Set((chk.data || []).map(x=>String(x.id)));
  const seguros = lista.filter(v=>guardados.has(String(v.id)));
  if(seguros.length !== lista.length) throw new Error(`Solo ${seguros.length} de ${lista.length} quedaron guardados en el Excel. No quité a nadie del panel.`);
  // 3) quitarlos del panel
  const idsOk = seguros.map(v=>v.id);
  state.vips = state.vips.filter(v=>!idsOk.includes(v.id));
  await persist('vips', { deletedIds: idsOk });
  return { archivados: idsOk.length };
}

async function delItem(key, id, rerenderFn){
  if(key === 'vips'){
    if(!confirm('¿Quitar a este miembro del panel? Sigue guardado en el Excel (hoja VIPsArchivo).')) return;
    try{ await archivarMiembrosVip([id]); }catch(e){ alert(e.message); return; }
    rerenderFn ? rerenderFn() : render();
    return;
  }
  if(!confirm('¿Eliminar este registro?')) return;
  state[key] = state[key].filter(x=>x.id!==id);
  rerenderFn ? rerenderFn() : render();
  await persist(key, { deletedIds: [id] });
}

// ---------- Limpiar apuestas viejas (con respaldo en el Excel) ----------
// Copia las filas a la hoja "ApuestasRespaldo" (con la hoja de origen y la fecha del respaldo),
// comprueba que quedaron guardadas, y recién ahí las borra del panel.
async function limpiarApuestasAnteriores(key, rerender){
  const ayer = new Date(Date.now() - 29*60*60*1000).toISOString().slice(0,10); // ayer en Ecuador
  const entrada = prompt('Se van a borrar las apuestas con fecha ANTERIOR a esta (AAAA-MM-DD). Ayer es ' + ayer + ', así que si dejas esa fecha se conserva ayer y hoy:', ayer);
  if(entrada === null) return;
  const corte = entrada.trim();
  if(!/^\d{4}-\d{2}-\d{2}$/.test(corte)){ alert('Fecha inválida. Usa el formato AAAA-MM-DD, por ejemplo ' + ayer + '.'); return; }
  const viejas = (state[key] || []).filter(b => String(b.date || '').slice(0,10) < corte);
  if(!viejas.length){ alert('No hay apuestas anteriores a ' + corte + '.'); return; }
  if(!confirm(`Voy a borrar ${viejas.length} apuestas anteriores al ${corte} de esta lista y guardar una copia en el Excel (hoja ApuestasRespaldo). Se conservan las demás (${state[key].length - viejas.length}). ¿Seguimos?`)) return;
  try{
    const hoja = SHEET_NAMES[key];
    const fecha = new Date(Date.now() - 5*60*60*1000).toISOString().slice(0,16).replace('T',' ');
    let previo = [];
    try{ previo = (await (await fetch(`${SHEETS_API_URL}?sheet=ApuestasRespaldo`)).json()).data || []; }
    catch(e){ throw new Error('No pude leer el respaldo del Excel. No se borró nada.'); }
    const mapa = new Map();
    previo.forEach(x=>{ if(x && x.id) mapa.set(String(x.hoja) + '|' + String(x.id), x); });
    viejas.forEach(b=>mapa.set(hoja + '|' + b.id, { ...b, hoja, respaldoFecha: fecha }));
    await fetch(SHEETS_API_URL, { method:'POST', mode:'no-cors', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({ sheet:'ApuestasRespaldo', data: Array.from(mapa.values()) }) });
    await new Promise(ok=>setTimeout(ok, 3000));
    const chk = (await (await fetch(`${SHEETS_API_URL}?sheet=ApuestasRespaldo&t=${Date.now()}`)).json()).data || [];
    const guardados = new Set(chk.map(x=>String(x.hoja) + '|' + String(x.id)));
    if(!viejas.every(b=>guardados.has(hoja + '|' + b.id))) throw new Error('El respaldo en el Excel no quedó completo. No se borró nada.');
    const ids = viejas.map(b=>b.id);
    state[key] = state[key].filter(b=>!ids.includes(b.id));
    await persist(key, { deletedIds: ids });
    alert(`Listo: ${ids.length} apuestas borradas del panel y respaldadas en el Excel (ApuestasRespaldo).`);
  }catch(e){ alert(e.message); }
  rerender();
}

      <button class="btn" id="savePick">Guardar</button>

  function paintComboLines(){
    const wrap = document.getElementById('comboLines');
    wrap.innerHTML = comboLinesData.map((l,i)=>`
      <div class="combo-line-row">
        <input class="combo-pick" data-i="${i}" placeholder="Línea ${i+1}: ej. Real Madrid gana" value="${(l.pick||'').replace(/"/g,'&quot;')}" style="flex:2;">

    wrap.querySelectorAll('[data-remove-line]').forEach(b=>b.onclick=()=>{

      comboLinesData.splice(Number(b.dataset.removeLine),1);
      paintComboLines();
    });
    updateComboTotal();
  }

      sport: document.getElementById('f-sport').value.trim(),
      event, betType, pick, odds,
      stake: Number(document.getElementById('f-stake').value)||0,
      date: document.getElementById('f-bdate').value || new Date().toISOString().slice(0,10),
      result: document.getElementById('f-result').value,
      lines: linesStr
    };
    if(existing){
      Object.assign(existing, data);
    } else {
      state[key].push({ id: uid(), ...data });
    }
    closeModal();
    rerender();
    await persist(key);
  };
}

/* ---------- VENTA DE STAKES (secciones creadas por ti: título + fecha + precio) ---------- */
function saleAmount(s){
  const sec = state.stakeSections.find(x=>x.id===s.sectionId);
  return sec ? (Number(sec.price)||0) : (Number(s.amount)||0);
}
function sectionTotal(secId){
  return state.stakeSales.filter(s=>s.sectionId===secId && s.status==='paid').reduce((sum,s)=>sum+saleAmount(s),0);
}
// Registros viejos (creados antes de existir las secciones) se agrupan por día en una sección "Stake".
async function migrateStakeSales(){
  const legacy = state.stakeSales.filter(s=>!s.sectionId);
  if(!legacy.length) return;
  const byDay = {};
  legacy.forEach(s=>{ const d = s.day || ''; (byDay[d] = byDay[d] || []).push(s); });
  Object.entries(byDay).forEach(([day, list])=>{
    const sec = { id: uid(), day, title:'Stake', price: Number(list[0].amount)||0 };
    state.stakeSections.push(sec);
    list.forEach(x=>{ x.sectionId = sec.id; });
  });
  const ok = !state.failedKeys.includes('stakeSections') && !state.failedKeys.includes('stakeSales');
  if(ok){ await persist('stakeSections'); await persist('stakeSales'); }
}

// "Memoria" de compradores: junta nombre+teléfono de TODAS las secciones/días anteriores,
// quedándose con el teléfono más reciente registrado para cada nombre.
function getKnownBuyers(){
  const map = new Map();
  state.stakeSales.forEach(s=>{
    // String(...) por si acaso -- si algún registro viejo quedó con el nombre o teléfono como
    // número en vez de texto, un .trim() directo sobre eso tronaba y dejaba sin cargar a nadie.
    const name = String(s.name||'').trim();
    const phone = String(s.phone||'').trim();
    if(!name) return;
    map.set(name.toLowerCase(), { name, phone });
  });
  return [...map.values()].sort((a,b)=>a.name.localeCompare(b.name));
}

function openStakeSaleForm(sectionId){
  const sec = state.stakeSections.find(x=>x.id===sectionId);
  if(!sec) return;

function financeAccount(id){ return FINANCE_ACCOUNTS.find(a=>a.id===id); }

  return state.financeMovements.filter(m=>m.accountId===accountId).reduce((sum,m)=> sum + (m.type==='in' ? Number(m.amount) : -Number(m.amount)), 0);

  return FINANCE_ACCOUNTS.reduce((sum,a)=>sum+financeBalance(a.id), 0);

// Borra TODO el historial de Cuadre Financiero (pruebas y movimientos incluidos) para empezar
// limpio, y abre de una vez el formulario de saldo del día. Pide doble confirmación por ser irreversible.
// Antes de borrar el historial se COPIA al Excel (hoja "CuadreRespaldo", con la fecha del respaldo)
// y solo si se comprueba que quedó guardado se borra del panel.
async function respaldarCuadre(){
  const movs = state.financeMovements || [];
  if(!movs.length) return 0;
  const fecha = new Date(Date.now() - 5*60*60*1000).toISOString().slice(0,16).replace('T',' ');
  let previo = [];
  try{
    const j = await (await fetch(`${SHEETS_API_URL}?sheet=CuadreRespaldo`)).json();
    previo = j.data || [];
  }catch(e){ throw new Error('No pude leer el respaldo del Excel. No se borró nada.'); }
  const mapa = new Map();
  previo.forEach(x=>{ if(x && x.id) mapa.set(String(x.id), x); });
  movs.forEach(m=>mapa.set(String(m.id), { ...m, respaldoFecha: fecha }));
  await fetch(SHEETS_API_URL, {
    method:'POST', mode:'no-cors', headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify({ sheet:'CuadreRespaldo', data: Array.from(mapa.values()) })
  });
  await new Promise(ok=>setTimeout(ok, 3000));
  const chk = await (await fetch(`${SHEETS_API_URL}?sheet=CuadreRespaldo&t=${Date.now()}`)).json();
  const guardados = new Set((chk.data || []).map(x=>String(x.id)));
  if(!movs.every(m=>guardados.has(String(m.id)))) throw new Error('El respaldo en el Excel no quedó completo. No se borró nada.');
  return movs.length;
}
async function resetFinanceAll(rerender){
  if(!confirm('Esto va a dejar el Cuadre Financiero en cero (' + state.financeMovements.length + ' movimientos). Antes se guarda una copia en el Excel, en la hoja CuadreRespaldo. ¿Seguimos?')) return;
  const typed = prompt('Para confirmar, escribe BORRAR (en mayúsculas) y presiona aceptar:');
  if(typed !== 'BORRAR'){ alert('No escribiste "BORRAR" exactamente — no se borró nada.'); return; }
  let n = 0;
  try{ n = await respaldarCuadre(); }catch(e){ alert(e.message); return; }
  state.financeMovements = [];
  rerender();
  await persist('financeMovements', { force: true }); // reinicio explícito: sí se pisa lo del servidor
  alert(`Listo: el cuadre quedó en cero${n ? ` y ${n} movimientos quedaron respaldados en el Excel (CuadreRespaldo)` : ''}. Ahora dile a Win los saldos de cada cuenta.`);
}

// Gráficos de Cuadre Financiero: barras de saldo actual por cuenta, y línea del total
// acumulado día a día a partir del historial de movimientos.
let _financeBarChart = null, _financeLineChart = null;
function renderFinanceCharts(rows){
  if(typeof Chart === 'undefined') return;
  const barCanvas = document.getElementById('financeBarChart');
  const lineCanvas = document.getElementById('financeLineChart');
  if(!barCanvas || !lineCanvas) return;

  if(_financeBarChart){ _financeBarChart.destroy(); _financeBarChart = null; }
  if(_financeLineChart){ _financeLineChart.destroy(); _financeLineChart = null; }

  _financeBarChart = new Chart(barCanvas, {
    type: 'bar',
    data: {
      labels: FINANCE_ACCOUNTS.map(a=>a.name),
      datasets: [{
        label: 'Saldo actual',
        data: FINANCE_ACCOUNTS.map(a=>financeBalance(a.id)),
        backgroundColor: FINANCE_ACCOUNTS.map(a=>a.type==='banco' ? '#3B82F6' : '#D4A017')
      }]
    },
    options: { plugins:{ legend:{ display:false } }, scales:{ y:{ ticks:{ color:'#9AA7BD' } }, x:{ ticks:{ color:'#9AA7BD', font:{size:10} } } } }
  });

  // Línea: total acumulado por fecha, usando TODOS los movimientos (no solo los filtrados) para que la tendencia sea real.
  const byDate = {};
  [...state.financeMovements].sort((a,b)=>new Date(a.date)-new Date(b.date)).forEach(m=>{
    const d = m.date || '-';
    byDate[d] = (byDate[d]||0) + (m.type==='in' ? Number(m.amount) : -Number(m.amount));
  });
  const dates = Object.keys(byDate).sort((a,b)=>new Date(a)-new Date(b));
  let running = 0;
  const totals = dates.map(d=>{ running += byDate[d]; return running; });

  _financeLineChart = new Chart(lineCanvas, {
    type: 'line',
    data: {
      labels: dates.map(d=>fmtDate(d)),
      datasets: [{ label:'Total general', data: totals, borderColor:'#22C55E', backgroundColor:'rgba(34,197,94,0.15)', fill:true, tension:0.25 }]
    },
    options: { plugins:{ legend:{ display:false } }, scales:{ y:{ ticks:{ color:'#9AA7BD' } }, x:{ ticks:{ color:'#9AA7BD', font:{size:10} } } } }
  });
}

// Comprime y convierte la imagen del comprobante a base64 antes de mandarla a leer,
// para que la subida sea rápida y liviana en datos móviles.
function fileToCompressedImage(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        const maxW = 1100;
        const scale = Math.min(1, maxW / img.width);
        const w = Math.max(1, Math.round(img.width * scale));
        const h = Math.max(1, Math.round(img.height * scale));
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        const dataUrl = canvas.toDataURL('image/jpeg', 0.82);
        resolve({ base64: dataUrl.split(',')[1], mediaType: 'image/jpeg', previewUrl: dataUrl });
      };
      img.onerror = ()=>reject(new Error('No se pudo leer la imagen.'));
      img.src = reader.result;
    };
    reader.onerror = ()=>reject(new Error('No se pudo leer el archivo.'));
    reader.readAsDataURL(file);
  });
}

// Versión chiquita de la misma imagen, solo para guardarla en el historial (Google Sheets
// tiene un límite de ~50.000 caracteres por celda). Va probando con tamaños y calidades cada
// vez más chicos hasta que el resultado entre bien holgado en ese límite — las capturas de
// pantalla con texto nítido a veces pesan más de lo esperado aunque se vean "chiquitas".
function fileToThumbnail(file){
  const MAX_CHARS = 38000;
  const steps = [
    { w: 480, q: 0.55 }, { w: 480, q: 0.4 }, { w: 360, q: 0.5 },
    { w: 360, q: 0.35 }, { w: 260, q: 0.4 }, { w: 200, q: 0.35 }, { w: 160, q: 0.3 }
  ];
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        let result = '';
        for(const step of steps){
          const scale = Math.min(1, step.w / img.width);
          const w = Math.max(1, Math.round(img.width * scale));
          const h = Math.max(1, Math.round(img.height * scale));
          canvas.width = w; canvas.height = h;
          ctx.drawImage(img, 0, 0, w, h);
          const dataUrl = canvas.toDataURL('image/jpeg', step.q);
          if(dataUrl.length <= MAX_CHARS){ result = dataUrl; break; }
          result = dataUrl; // nos quedamos con el más chico probado por si ninguno entra
        }
        resolve(result.length <= MAX_CHARS ? result : '');
      };
      img.onerror = ()=>reject(new Error('No se pudo leer la imagen.'));
      img.src = reader.result;
    };
    reader.onerror = ()=>reject(new Error('No se pudo leer el archivo.'));
    reader.readAsDataURL(file);
  });
}

// Como fileToCompressedImage, pero apuntando a la mejor calidad posible que SIGA cabiendo en
// una celda de Google Sheets (~50.000 caracteres). Úsala solo cuando el base64 completo se va
// a GUARDAR en una hoja (ej: "Imágenes guardadas"/winTemplates) -- los envíos directos de una
// apuesta/contenido/testimonio no la necesitan, porque esos nunca persisten el base64 en
// Sheets (solo el "thumb", que ya tenía este mismo cuidado). Si no se guardara con este límite,
// la celda queda truncada/corrupta en silencio: el texto se manda bien pero la imagen nunca
// llega -- así se perdieron las primeras 4 publicidades del protocolo de la mañana.
function fileToStorableImage(file){
  const MAX_CHARS = 48000;
  const steps = [
    { w: 900, q: 0.75 }, { w: 900, q: 0.6 }, { w: 700, q: 0.65 }, { w: 700, q: 0.5 },
    { w: 540, q: 0.55 }, { w: 480, q: 0.5 }, { w: 400, q: 0.45 }, { w: 320, q: 0.4 }
  ];
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        let result = '';
        for(const step of steps){
          const scale = Math.min(1, step.w / img.width);
          const w = Math.max(1, Math.round(img.width * scale));
          const h = Math.max(1, Math.round(img.height * scale));
          canvas.width = w; canvas.height = h;
          ctx.drawImage(img, 0, 0, w, h);
          const dataUrl = canvas.toDataURL('image/jpeg', step.q);
          result = dataUrl;
          if(dataUrl.length <= MAX_CHARS) break;
        }
        if(result.length > MAX_CHARS){ reject(new Error('La imagen sigue muy pesada incluso reducida al mínimo. Prueba con otra.')); return; }
        resolve({ base64: result.split(',')[1], mediaType: 'image/jpeg', previewUrl: result });
      };
      img.onerror = ()=>reject(new Error('No se pudo leer la imagen.'));
      img.src = reader.result;
    };
    reader.onerror = ()=>reject(new Error('No se pudo leer el archivo.'));
    reader.readAsDataURL(file);
  });
}
