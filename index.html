async function handleReceiptFile(file, rerender){
  openModal(`
    <h3>Leyendo comprobante...</h3>
    <div style="text-align:center; padding:30px 0; color:var(--muted); font-size:13.5px;">Esto toma unos segundos.</div>
  `);
  try{
    const { base64, mediaType, previewUrl } = await fileToCompressedImage(file);
    let thumb = '';
    try{ thumb = await fileToThumbnail(file); }catch(e){ thumb = ''; }
    const res = await fetch('/api/leer-comprobante', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ imageBase64: base64, mediaType })
    });
    const result = await res.json();
    if(!res.ok){
      showReceiptError(result.error || 'No se pudo leer el comprobante.', rerender);
      return;
    }
    showReceiptConfirm(result, previewUrl, thumb, rerender);
  }catch(e){
    console.error(e);
    showReceiptError('No se pudo leer el comprobante. Revisa tu conexión e intenta de nuevo.', rerender);
  }
}

// Modo rápido para cuando entran muchos comprobantes seguidos: estando en Cuadre Financiero,
// arrastra la imagen (desde la carpeta de Descargas, por ejemplo) a CUALQUIER parte de la
// pantalla, o cópiala (Ctrl+C en WhatsApp/galería) y pégala con Ctrl+V — sin tener que abrir
// el botón "Leer comprobante" primero. Así el flujo queda: pega y confirma, pega y confirma...
let _financeDragDepth = 0;
function financeDropOverlay(show){
  let el = document.getElementById('financeDropOverlay');
  if(show && !el){
    el = document.createElement('div');
    el.id = 'financeDropOverlay';
    el.style.cssText = 'position:fixed; inset:0; z-index:500; background:rgba(212,175,106,0.12); border:3px dashed var(--accent); display:flex; align-items:center; justify-content:center; pointer-events:none;';
    el.innerHTML = '<div style="background:var(--surface); border:1px solid var(--accent); border-radius:10px; padding:18px 26px; font-size:15px; font-weight:700; color:var(--accent);">📎 Suelta aquí para leer el comprobante</div>';
    document.body.appendChild(el);
  } else if(!show && el){
    el.remove();
  }
}
window.addEventListener('dragenter', (e)=>{
  if(state.view !== 'finance' || !state.loaded) return;
  e.preventDefault();
  _financeDragDepth++;
  financeDropOverlay(true);
});
window.addEventListener('dragover', (e)=>{
  if(state.view !== 'finance' || !state.loaded) return;
  e.preventDefault();
});
window.addEventListener('dragleave', (e)=>{
  if(state.view !== 'finance' || !state.loaded) return;
  _financeDragDepth = Math.max(0, _financeDragDepth-1);
  if(_financeDragDepth === 0) financeDropOverlay(false);
});
window.addEventListener('drop', (e)=>{
  if(state.view !== 'finance' || !state.loaded) return;
  e.preventDefault();
  _financeDragDepth = 0;
  financeDropOverlay(false);
  const file = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
  if(file && file.type && file.type.startsWith('image/')) handleReceiptFile(file, renderFinance);
});
window.addEventListener('paste', (e)=>{
  if(state.view !== 'finance' || !state.loaded) return;
  const items = (e.clipboardData && e.clipboardData.items) || [];
  for(const item of items){
    if(item.type && item.type.startsWith('image/')){
      const file = item.getAsFile();
      if(file){ e.preventDefault(); handleReceiptFile(file, renderFinance); }
      break;
    }
  }
});

function showReceiptConfirm(result, previewUrl, thumb, rerender){
  const accountId = FINANCE_ACCOUNTS.find(a=>a.id===result.accountId) ? result.accountId : '';
  const type = result.type === 'out' ? 'out' : (result.type === 'in' ? 'in' : 'in');
  const amount = typeof result.amount === 'number' ? result.amount : '';
  const comprobanteNumero = result.comprobanteNumero ? String(result.comprobanteNumero) : '';
  const lowConfidence = result.confidence === 'baja' || !accountId || !amount;

  openModal(`
    <h3>Confirmar movimiento</h3>
    <img src="${previewUrl}" style="max-width:100%; max-height:160px; border-radius:8px; margin-bottom:12px; display:block;">
    ${lowConfidence ? `<div style="background:#4A3B14; color:var(--pending); border-radius:8px; padding:10px 12px; font-size:12.5px; margin-bottom:14px;">No estoy 100% seguro de algunos datos — revísalos antes de confirmar.${result.reason ? ' ' + result.reason : ''}</div>` : ''}
    ${!thumb ? `<div style="background:#4A3B14; color:var(--pending); border-radius:8px; padding:10px 12px; font-size:12.5px; margin-bottom:14px;">⚠️ Esta foto pesa demasiado y no se pudo guardar en el historial (sí se registrará el movimiento, solo que sin la foto).</div>` : ''}
    ${result.detectedText ? `<div style="font-size:12px; color:var(--muted); margin-bottom:14px;">Leído: "${String(result.detectedText).replace(/"/g,'&quot;')}"</div>` : ''}
    <div id="dupWarning"></div>
    <div class="field"><label>Cuenta</label>
      <select id="f-rcAcc">
        <option value="">Selecciona una cuenta</option>
        ${FINANCE_ACCOUNTS.map(a=>`<option value="${a.id}" ${accountId===a.id?'selected':''}>${a.name} (${a.type==='banco'?'Banco':'Caja'})</option>`).join('')}
      </select>
    </div>
    <div class="field"><label>Tipo</label>
      <select id="f-rcType">
        <option value="in" ${type==='in'?'selected':''}>Ingreso (entra dinero)</option>
        <option value="out" ${type==='out'?'selected':''}>Egreso (sale dinero)</option>
      </select>
    </div>
    <div class="field"><label>Monto ($)</label><input id="f-rcAmount" type="number" step="0.01" value="${amount}"></div>
    <div class="field"><label>N° de comprobante</label><input id="f-rcNum" placeholder="Ej: 64817155" value="${comprobanteNumero.replace(/"/g,'&quot;')}"></div>
    <div class="field"><label>Fecha</label><input id="f-rcDate" type="date" value="${new Date().toISOString().slice(0,10)}"></div>
    <div class="field"><label>Nota</label><input id="f-rcNote" value="${result.detectedText ? String(result.detectedText).replace(/"/g,'&quot;') : ''}"></div>
    <div class="modal-actions">
      <button class="btn secondary" onclick="closeModal()">Cancelar</button>
      <button class="btn" id="confirmReceiptBtn">Confirmar y registrar</button>
    </div>
  `);

  // Aviso "inteligente" de posible duplicado: mismo número de comprobante ya registrado antes.
  const checkDup = ()=>{
    const num = document.getElementById('f-rcNum').value.trim();
    const box = document.getElementById('dupWarning');
    if(!num){ box.innerHTML = ''; return; }
    const dup = state.financeMovements.find(m=>m.comprobanteNumero && m.comprobanteNumero===num);
    if(dup){
      const a = financeAccount(dup.accountId);
      box.innerHTML = `<div style="background:var(--loss-dim); color:#FF8A8E; border-radius:8px; padding:10px 12px; font-size:12.5px; margin-bottom:14px;">⚠️ Ya existe un movimiento con el N° de comprobante <b>${num}</b> (${a?a.name:dup.accountId}, ${fmtMoney(dup.amount)}, ${fmtDate(dup.date)}). Revisa que no sea el mismo comprobante repetido.</div>`;
    } else {
      box.innerHTML = '';
    }
  };
  checkDup();
  document.getElementById('f-rcNum').oninput = checkDup;

  document.getElementById('confirmReceiptBtn').onclick = async ()=>{
    const acc = document.getElementById('f-rcAcc').value;
    const amt = Number(document.getElementById('f-rcAmount').value);
    const num = document.getElementById('f-rcNum').value.trim();
    if(!acc){ alert('Elige a qué cuenta pertenece.'); return; }
    if(!amt || amt<=0){ alert('Pon un monto válido.'); return; }
    if(num && state.financeMovements.some(m=>m.comprobanteNumero && m.comprobanteNumero===num)){
      if(!confirm('Ese N° de comprobante ya está registrado antes. ¿Seguro que quieres registrarlo de todos modos?')) return;
    }
    state.financeMovements.push({
      id: uid(),
      accountId: acc,
      type: document.getElementById('f-rcType').value,
      amount: amt,
      date: document.getElementById('f-rcDate').value || new Date().toISOString().slice(0,10),
      note: document.getElementById('f-rcNote').value.trim(),
      comprobanteNumero: num,
      receiptImage: thumb || '',
      transferId: '',
      createdAt: new Date().toISOString(),
      createdBy: currentUserLabel()
    });
    closeModal();
    rerender();
    await persist('financeMovements');
  };
}

  const N = window.innerWidth < 600 ? 300 : 520;
  const pts = [], ga = Math.PI * (3 - Math.sqrt(5));
  for(let i=0;i<N;i++){
    const y = 1 - (i/(N-1))*2, r = Math.sqrt(1 - y*y), th = ga*i;
    pts.push({ x:Math.cos(th)*r, y, z:Math.sin(th)*r, ph:Math.random()*6.283, sz:1.0 + Math.random()*1.5 });
  }
  const arcs = Array.from({length:5}, (_,i)=>({ tilt:0.3 + i*0.63, spin:(i%2 ? 1 : -1) * (0.35 + i*0.09), ph:Math.random()*6.283 }));
  let rotY = 0, speed = 0.12, amp = 0.06, last = performance.now();
  const TILT_X = 0.38, cx = Math.cos(TILT_X), sx = Math.sin(TILT_X);
  const proj = (x, y, z, cy, sy, R)=>{
    const x1 = x*cy + z*sy, z1 = -x*sy + z*cy;
    const y2 = y*cx - z1*sx, z2 = y*sx + z1*cx;
    const p = 1/(1 - z2*0.32);
    return { px:C + x1*R*p, py:C + y2*R*p, d:z2, p };
  };
  function frame(now){
    if(!document.getElementById('winFx')) return;
    const dt = Math.min((now - last)/1000, 0.05); last = now;
    const orb = document.getElementById('winOrb');
    const cls = orb ? orb.className : '';
    const mode = cls.indexOf('thinking') >= 0 ? 'thinking' : cls.indexOf('speaking') >= 0 ? 'speaking' : cls.indexOf('listening') >= 0 ? 'listening' : cls.indexOf('done') >= 0 ? 'done' : 'idle';
    const targetSpeed = { idle:0.12, listening:0.3, thinking:1.5, speaking:0.55, done:0.2 }[mode];
    speed += (targetSpeed - speed) * Math.min(1, dt*3);
    winFxLevel *= 0.9; // el volumen real lo manda winVolumeLoop; si no llega, se apaga solo
    let lvl;
    if(mode === 'listening') lvl = winFxLevel;
    else if(mode === 'speaking') lvl = 0.45 + 0.3*Math.sin(now/90) + 0.2*Math.sin(now/37);
    else if(mode === 'thinking') lvl = 0.5 + 0.3*Math.sin(now/160);
    else lvl = 0.07 + 0.04*Math.sin(now/900);
    amp += (lvl - amp) * Math.min(1, dt*10);
    rotY += speed*dt;
    const cy = Math.cos(rotY), sy = Math.sin(rotY);
    const R = 178 * (1 + amp*0.13);
    ctx.clearRect(0, 0, SIZE, SIZE);
    ctx.globalCompositeOperation = 'lighter';
    for(let i=0;i<N;i++){
      const q = pts[i];
      const k = proj(q.x, q.y, q.z, cy, sy, R);
      const t = (k.d + 1)/2;                                    // 0 = atrás, 1 = adelante
      const a = (0.14 + 0.86*t) * (0.78 + 0.22*Math.sin(now/650 + q.ph));
      const r = 255*(0.55 + 0.45*t), g = 226*(0.5 + 0.5*t), b = 160*(0.35 + 0.65*t);
      ctx.fillStyle = `rgba(${r|0},${g|0},${b|0},${a.toFixed(3)})`;
      const size = q.sz * (0.65 + t*0.9) * (1 + amp*0.9);
      ctx.fillRect(k.px - size/2, k.py - size/2, size, size);
    }
    // arcos de energía: estelas que recorren la esfera
    for(let j=0;j<arcs.length;j++){
      const ar = arcs[j], head = now/1000*ar.spin + ar.ph;
      const ct = Math.cos(ar.tilt), st = Math.sin(ar.tilt);
      for(let s=0;s<30;s++){
        const ang = head - s*0.04*(ar.spin>0 ? 1 : -1);
        const x = Math.cos(ang), y = Math.sin(ang)*ct, z = Math.sin(ang)*st;
        const k = proj(x, y, z, cy, sy, R*1.07);
        const fade = 1 - s/30, t = (k.d + 1)/2;
        ctx.fillStyle = `rgba(255,232,180,${(fade*fade*(0.18 + 0.7*t)*(0.7 + amp)).toFixed(3)})`;
        const size = (s === 0 ? 4.6 : 3) * fade + 0.5;
        ctx.fillRect(k.px - size/2, k.py - size/2, size, size);
      }
    }
    ctx.globalCompositeOperation = 'source-over';
    if(!reduce) winFxRaf = requestAnimationFrame(frame);
  }
  winFxRaf = requestAnimationFrame(frame);
}

// Busca una publicidad guardada por nombre -- coincidencia flexible (no hace falta que sea exacta).
function findWinTemplateByName(nombre){
  if(!nombre) return null;
  const norm = s => (s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').trim();
  const q = norm(nombre);
  if(!q) return null;
  let match = state.winTemplates.find(t => norm(t.nombre) === q);
  if(match) return match;
  match = state.winTemplates.find(t => norm(t.nombre).includes(q) || q.includes(norm(t.nombre)));
  return match || null;
}

// Listas de clientes para mandar avisos/promos masivos por WhatsApp (uno por minuto, con

// así la lista no depende de que esa otra hoja haya terminado de cargar para mostrar algo, y el
// jefe manda manualmente cuando quiera, sin sorpresas). Quedan guardados en la hoja WinDifusion,
// con sus listas separadas por coma -- un mismo contacto puede estar en varias.
const WIN_DIFUSION_LISTAS = [

  { id: 'fuertes', nombre: 'Clientes Fuertes' },
  { id: 'mas_parlay', nombre: 'Clientes Más Parlay' },

  return l ? l.nombre : id;

// Devuelve [{nombre, telefono}, ...] de una lista, sin duplicar por teléfono.
function getDifusionContactos(listaId){
  const vistos = new Set();
  const out = [];
  state.winDifusion.forEach(c=>{
    const listas = String(c.listas||'').split(',').map(s=>s.trim()).filter(Boolean);
    if(!listas.includes(listaId)) return;
    const tel = String(c.telefono||'').trim();
    const clave = waNumberFromPhone(tel);
    if(!tel || !clave || vistos.has(clave)) return;
    vistos.add(clave);
    out.push({ nombre: c.nombre || '', telefono: tel });
  });
  return out;
}

// Etiqueta interna que se guarda en la columna "listas" de un contacto cuando el dueño lo quita de
// "Clientes de Stakes" a propósito: así el botón de actualizar compradores NO lo vuelve a meter
// (sin esto, cualquier persona quitada reaparecería en la siguiente actualización).
const WIN_DIF_EXCLUIDO_STAKES = 'no_stakes';

// Pone al día la lista "Clientes de Stakes" con todos los compradores conocidos de Venta de
// Stakes que tengan teléfono: agrega los nuevos, y no duplica ni pisa a los que ya estén
// (combina por número normalizado, así "0991234567" y "593991234567" cuentan como el mismo).
// Los que fueron quitados a propósito (etiqueta no_stakes) se respetan y no vuelven.
function sincronizarCompradoresStakes(){
  const compradores = getKnownBuyers().filter(b=>b.phone);
  const existentes = new Map();
  state.winDifusion.forEach(c=>{ const k = waNumberFromPhone(c.telefono); if(k && !existentes.has(k)) existentes.set(k, c); });
  let agregados = 0, actualizados = 0, omitidos = 0;
  compradores.forEach(b=>{
    const tel = String(b.phone||'').trim();
    const clave = waNumberFromPhone(tel);
    if(!tel || !clave) return;
    const existente = existentes.get(clave);
    if(existente){
      const listas = String(existente.listas||'').split(',').map(s=>s.trim()).filter(Boolean);
      if(listas.includes(WIN_DIF_EXCLUIDO_STAKES)){ omitidos++; return; }
      if(!listas.includes('stakes')){ listas.push('stakes'); existente.listas = listas.join(','); actualizados++; }
    } else {
      const nuevo = { id: uid(), nombre: b.name || '', telefono: tel, listas: 'stakes', createdAt: new Date().toISOString() };
      state.winDifusion.push(nuevo);
      existentes.set(clave, nuevo);
      agregados++;
    }
  });
  return { agregados, actualizados, omitidos };
}

// Botón "🔄 Actualizar compradores": corre la sincronización y guarda. "reabrir" (opcional) es la
// pantalla que se vuelve a abrir después, para ver el conteo nuevo sin perder el lugar.
async function cargarContactosDeVentaStakes(reabrir){
  const btn = document.getElementById('winDifCargarStakesBtn') || document.getElementById('winDifRefreshBtn');
  const textoBtn = btn ? btn.textContent : '';
  if(btn){ btn.disabled = true; btn.textContent = 'Actualizando...'; }

    const total = getDifusionContactos('stakes').length;
    alert(r.agregados || r.actualizados
      ? `Listo -- ${r.agregados} comprador${r.agregados===1?'':'es'} nuevo${r.agregados===1?'':'s'} agregado${r.agregados===1?'':'s'} a "Clientes de Stakes"${r.actualizados ? ` y ${r.actualizados} que ya estaban se sumaron a esta lista` : ''}. En total hay ${total}.`
      : `La lista ya estaba al día. Hay ${total} compradores.`);
    if(typeof reabrir === 'function') reabrir(); else openWinDifusionModal();

    console.error(e);
    alert(`No se pudo actualizar la lista: ${e && e.message ? e.message : e}`);

    </div>`;

    <h3 style="margin-bottom:4px;">🔔 Reconsumos VIP</h3>
    <p style="color:var(--muted); font-size:13px; margin-bottom:14px;">Sacar quita a la persona de VIP y VIP Más Parley (el bot tiene que ser admin). "Escribirle" abre tu WhatsApp con el mensaje listo.</p>

    ${vencidos.length ? `<button class="btn secondary small" id="winReconLimpiar" style="margin-bottom:10px;">🧹 Quitar de la lista a los que ya no están en el grupo</button>` : ''}

    ${porVencer.length ? porVencer.map(x=>fila(x,false)).join('') : '<div class="empty">Nadie por vencer.</div>'}
    <div style="display:flex; justify-content:flex-end; margin-top:12px;"><button class="btn secondary" id="winReconCerrar">Cerrar</button></div>
  `);
  document.getElementById('winReconCerrar').onclick = closeModal;
  const sacarTodos = document.getElementById('winReconSacarTodos');
  if(sacarTodos) sacarTodos.onclick = async ()=>{
    const lista = vencidos.map(x=>({ v:x.v, num:waNumberFromPhone(x.v.contact || '') })).filter(x=>x.num);
    if(!confirm(`Voy a sacar de VIP y VIP Más Parley a los ${lista.length} miembros vencidos que sigan en el grupo, uno por uno con unos segundos de pausa (tarda unos ${Math.ceil(lista.length*5/60)} min). Siguen guardados en Miembros VIP como inactivos. No cierres esta ventana mientras corre. ¿Los saco a todos?`)) return;
    sacarTodos.disabled = true;
    let sacados = 0, noEstaban = 0, fallos = [];
    for(let i=0; i<lista.length; i++){
      const { v, num } = lista[i];
      sacarTodos.textContent = `Sacando ${i+1} de ${lista.length}…`;
      try{
        const r = await withTimeout(fetch('/api/win-enviar', {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ modo:'sacar', numero:num, grupoIds:WIN_VIP_JIDS })
        }), 45000);
        const data = await r.json().catch(()=>({}));
        if(!r.ok) throw new Error(data.error || 'No se pudo sacar.');
        const res = data.resultados || [];
        const malos = res.filter(x=>!x.ok);
        if(malos.length){
          fallos.push(`${v.name}: ${malos[0].error || malos[0].status}`);
          // si el bot no es admin en algún grupo, no tiene caso seguir con los demás
          if(malos.some(x=>/administrador/i.test(x.error || ''))) break;
          continue;
        }
        if(res.every(x=>x.status === 'no-estaba')) noEstaban++; else sacados++;
        v.removidoVip = String(v.joinDate); v.status = 'inactive';
      }catch(e){
        fallos.push(`${v.name}: ${e.message}`);
        if(/conectado|conectar/i.test(e.message)) break;
      }
      await new Promise(ok=>setTimeout(ok, 3000 + Math.random()*3000));
    }
    await persist('vips');
    alert(`Terminé.\n• Sacados del grupo: ${sacados}\n• Ya no estaban: ${noEstaban}\n• Con problema: ${fallos.length}${fallos.length ? '\n\n' + fallos.slice(0,8).join('\n') : ''}`);
    openWinReconsumosModal();
    render();
  };
  const limpiar = document.getElementById('winReconLimpiar');
  if(limpiar) limpiar.onclick = async ()=>{
    const conNumero = vencidos.map(x=>({ v:x.v, num:waNumberFromPhone(x.v.contact || '') })).filter(x=>x.num);
    if(!confirm(`Voy a revisar en WhatsApp quién de los ${conNumero.length} vencidos ya no está en VIP ni en VIP Más Parley, y los quito de esta lista (siguen guardados en Miembros VIP, solo quedan como inactivos). ¿Seguimos?`)) return;
    limpiar.disabled = true; limpiar.textContent = 'Revisando…';
    try{
      const r = await withTimeout(fetch('/api/win-enviar', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ modo:'revisar', numeros:conNumero.map(x=>x.num), grupoIds:WIN_VIP_JIDS })
      }), 60000);
      const data = await r.json().catch(()=>({}));
      if(!r.ok) throw new Error(data.error || 'No se pudo revisar.');
      const noConfirmables = WIN_VIP_JIDS.filter(j=>!(data.grupos && data.grupos[j] && data.grupos[j].verificable));
      if(noConfirmables.length){
        alert('No puedo confirmar quién está en los grupos (WhatsApp esconde el número de algunos miembros). No quité a nadie de la lista, para no equivocarme.');
        limpiar.disabled = false; limpiar.textContent = '🧹 Quitar de la lista a los que ya no están en el grupo';
        return;
      }
      let quitados = 0;
      conNumero.forEach(({v,num})=>{
        if(!(data.presentes && data.presentes[num] && data.presentes[num].length)){
          v.removidoVip = String(v.joinDate); v.status = 'inactive'; quitados++;
        }
      });
      if(quitados) await persist('vips');
      alert(`Listo: quité ${quitados} de la lista. Quedan ${conNumero.length - quitados} vencidos que SÍ siguen en el grupo.`);
      openWinReconsumosModal();
      render();
    }catch(e){
      alert('Error: ' + e.message);
      limpiar.disabled = false; limpiar.textContent = '🧹 Quitar de la lista a los que ya no están en el grupo';
    }
  };
  document.querySelectorAll('[data-win-sacar]').forEach(btn=>{
    btn.onclick = async ()=>{
      const v = state.vips.find(x=>x.id === btn.dataset.winSacar);
      if(!v) return;
      const num = waNumberFromPhone(v.contact || '');
      if(!confirm(`¿Sacar a ${v.name} (+${num}) de los grupos VIP?`)) return;
      btn.disabled = true; btn.textContent = 'Sacando…';
      try{
        const r = await withTimeout(fetch('/api/win-enviar', {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ modo:'sacar', numero:num, grupoIds:WIN_VIP_JIDS })
        }), 45000);
        const data = await r.json().catch(()=>({}));
        if(!r.ok) throw new Error(data.error || 'No se pudo sacar.');
        const nombreGrupo = id => (id === WIN_VIP_JIDS[0] ? 'VIP' : 'VIP Más Parley');
        const detalle = (data.resultados || []).map(x=>`• ${nombreGrupo(x.grupoId)}: ${x.status === 'no-estaba' ? 'no estaba en el grupo' : (x.ok ? 'sacado ✅' : 'NO se pudo — ' + (x.error || x.status))}`).join('\n');
        const fallos = (data.resultados || []).filter(x=>!x.ok);
        if(fallos.length){
          alert('No se pudo sacar a ' + v.name + ':\n' + detalle);
          btn.disabled = false; btn.textContent = 'Sacar del VIP';
          return;
        }
        alert('Resultado para ' + v.name + ':\n' + detalle);
        v.removidoVip = String(v.joinDate);
        v.status = 'inactive';
        await persist('vips');
        openWinReconsumosModal();
        render();
      }catch(e){
        alert('Error: ' + e.message);
        btn.disabled = false; btn.textContent = 'Sacar del VIP';
      }
    };
  });
  document.querySelectorAll('[data-win-yarenovo]').forEach(btn=>{
    btn.onclick = ()=>{ closeModal(); alert('Para renovar, ve a Miembros VIP → Editar y actualiza la fecha de ingreso.'); };

}

// Paso 1: Win redacta UNA versión base (asertiva, directa -- el mismo tono que pediste para las
// publicaciones) a partir de la nota/dictado del dueño. La puede revisar, pedir otra versión
// (🔄) o dictarle/escribirle un ajuste (🎤) antes de mandar -- igual que en apuestas/contenido.
// "modo" decide qué pasa al final: 'bot' manda automático por el bot de WhatsApp (como antes);
// 'manual' arma un link de WhatsApp por contacto para que el dueño mande él mismo, a mano, sin
// usar el bot -- así evita que vuelvan a bloquear el número por mandar difusión masiva.
async function generarPreviewDifusion(listaId, contactos, modo){
  modo = modo === 'manual' ? 'manual' : 'bot';
  const nota = document.getElementById('f-winDifNota').value.trim();
  if(!nota){ alert('Escribe o dicta qué quieres avisar.'); return; }
  const btn = document.getElementById('winDifGenerarBtn');
  btn.disabled = true; btn.textContent = 'Generando...';
  try{
    const destino = winDifusionListaNombre(listaId);
    const foto = modo === 'manual' ? winDifFoto : null;
    const ctxFoto = foto ? { imageBase64: foto.base64, mediaType: foto.mediaType } : {};
    const res = await withTimeout(fetch('/api/win-redactar', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ kind: 'difusion_preview', destino, code: nota, ...ctxFoto })
    }), 25000);
    const data = await res.json().catch(()=>({}));
    const caption = (data && data.caption) || nota;
    const wrap = document.getElementById('winDifPreviewWrap');
    wrap.innerHTML = `
      <div class="field"><label>Así quedó (puedes editarlo antes de mandar)</label><textarea id="f-winCaptionConfirm" style="min-height:100px;">${escapeForTextarea(caption)}</textarea></div>
      ${winCaptionToolsHTML()}
      <button class="btn" id="winDifSendBtn" style="width:100%; margin-bottom:8px;">${modo === 'manual' ? `Armar mensajes para los ${contactos.length}` : `Mandar a los ${contactos.length}`}</button>
    `;
    wireWinCaptionTools({ kind: 'difusion_preview', destino, code: nota, ...ctxFoto });
    document.getElementById('winDifSendBtn').onclick = ()=> submitWinDifusionManual(listaId, contactos);
  }catch(e){
    console.error(e);
    alert('No se pudo generar el texto. Intenta de nuevo.');
  }finally{
    btn.disabled = false; btn.textContent = '✨ Generar texto';
  }
}

// Modo manual: en vez de mandar por el bot, arma un link wa.me (con el texto ya escrito, listo
// para revisar y enviar) por cada contacto, y lo deja en una lista para que el dueño vaya
// tocando uno por uno desde SU WhatsApp -- el envío real lo hace él, a mano, así que nunca pasa
// por el bot y no suma al riesgo de que WhatsApp lo vuelva a bloquear por patrón de bot.
function waNumberFromPhone(phoneRaw){
  let p = String(phoneRaw || '').replace(/[^\d]/g, '');
  if(!p) return '';
  if(p.startsWith('593')) { /* ya trae código de país */ }
  else if(p.startsWith('0')) p = '593' + p.slice(1);
  else p = '593' + p;
  return p;
}
async function submitWinDifusionManual(listaId, contactos){
  const box = document.getElementById('f-winCaptionConfirm');
  const base = box ? box.value.trim() : '';
  if(!base){ alert('Genera o escribe el texto primero.'); return; }
  if(!contactos.length){ alert('No hay contactos con teléfono en esta lista.'); return; }
  const btn = document.getElementById('winDifSendBtn');
  btn.disabled = true; btn.textContent = 'Armando mensajes...';
  try{
    const cantidad = Math.max(1, Math.min(contactos.length, 8));
    let variantes = [base];
    try{
      const res = await withTimeout(fetch('/api/win-redactar', {

async function handleMandarProtocoloManana(){

  }catch(e){
    console.error(e);
    winSpeak('No se pudo mandar el protocolo. Revisa la conexión e intenta de nuevo.');
  }
}

// ---------- Registro por voz: Cuadre Financiero y Venta de Stakes ----------
// A diferencia de mandar_regalito/mandar_publicidad_guardada (que abren un flujo o una
// confirmación visual), estas acciones registran el dato directo, sin ningún formulario
// ni modal -- Win nada más confirma hablando. La única excepción es el comprador de un
// stake que no es alguien ya conocido: ahí el jefe pidió explícitamente que Win NUNCA
// invente el registro -- avisa "contacto no encontrado" y deja el formulario manual
// abierto (prellenado) para que él mismo lo complete.
function winNormalizeText(s){
  return (s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').trim();
}

function findFinanceAccountByName(nombreDicho){
  const q = winNormalizeText(nombreDicho);
  if(!q) return null;
  const nombre = a => winNormalizeText(a.name);
  const alias = a => (a.alias || []).map(winNormalizeText);
  // 1) nombre exacto o alias exacto
  let acc = FINANCE_ACCOUNTS.find(a => nombre(a) === q || alias(a).includes(q));
  if(acc) return acc;
  // 2) la "cuenta jugador" va antes que la "caja más parley" para no confundirlas
  if(q.includes('jugador')) return FINANCE_ACCOUNTS.find(a => a.id === 'jugadormasparley');
  // 3) coincidencia parcial por nombre o alias
  acc = FINANCE_ACCOUNTS.find(a => nombre(a).includes(q) || q.includes(nombre(a)) || alias(a).some(x => q.includes(x)));
  return acc || null;
}

async function handleRegistrarCuadre(input){
  const acc = findFinanceAccountByName(input.cuenta);
  if(!acc){
    const nombres = FINANCE_ACCOUNTS.map(a=>a.name).join(', ');
    winSpeak(`No reconocí esa cuenta. Las que manejas son: ${nombres}.`);

  }
  const monto = Number(input.monto);
  if(!monto || monto <= 0){

  state.financeMovements.push({

    date: new Date().toISOString().slice(0,10),

  playWinSfx('confirm');
  winNoteFastBatchActivity();
}

function findStakeSectionByName(tituloDicho){
  if(!state.stakeSections.length) return null;
  const sorted = [...state.stakeSections].sort((a,b)=> new Date(b.day||0) - new Date(a.day||0));
  const q = winNormalizeText(tituloDicho);
  if(!q) return sorted[0]; // no dijo cuál -- se asume la sección más reciente
  return sorted.find(s => winNormalizeText(s.title).includes(q) || q.includes(winNormalizeText(s.title))) || sorted[0];
}

async function handleRegistrarVentaStake(input){
  const sec = findStakeSectionByName(input.seccion);
  if(!sec){
    winSpeak('Todavía no tienes ninguna sección de venta de stakes creada. Pídeme primero que cree una.');
    return;
  }
  const nombreDicho = (input.nombre || '').trim();
  if(!nombreDicho){
    winSpeak('No capté el nombre del comprador. Dímelo de nuevo.');
    return;
  }
  // "Contacto conocido" = ya compró un stake antes, o ya es cliente VIP registrado. Si no
  // aparece en ninguna de las dos listas, no se inventa el registro -- se avisa y se deja
  // el formulario manual abierto para que el jefe lo complete él mismo.
  const q = winNormalizeText(nombreDicho);
  const buyers = getKnownBuyers();
  const vipPools = state.vips || [];
  let match = buyers.find(b => winNormalizeText(b.name) === q)
    || vipPools.filter(v=>winNormalizeText(v.name)===q).map(v=>({ name:v.name, phone:v.contact||'' }))[0]
    || buyers.find(b => winNormalizeText(b.name).includes(q) || q.includes(winNormalizeText(b.name)))
    || vipPools.filter(v=>winNormalizeText(v.name).includes(q) || q.includes(winNormalizeText(v.name))).map(v=>({ name:v.name, phone:v.contact||'' }))[0];

  if(!match){
    winSpeak('Contacto no encontrado. Agrégalo manualmente -- te dejo el formulario abierto.');
    state.stakeSectionId = sec.id;
    openStakeSaleForm(sec.id);
    const nameEl = document.getElementById('f-saleName');
    if(nameEl) nameEl.value = nombreDicho;
    const phoneEl = document.getElementById('f-salePhone');
    if(input.telefono && phoneEl) phoneEl.value = input.telefono.trim();
    return;
  }

  state.stakeSales.push({
    id: uid(), sectionId: sec.id, day: sec.day,
    name: match.name,
    phone: (input.telefono && input.telefono.trim()) || match.phone || '',
    amount: Number(sec.price) || 0,
    status: 'paid'
  });
  state.stakeSectionId = sec.id;
  if(state.view === 'stakeSales') renderStakeSales();
  await persist('stakeSales');
  playWinSfx('confirm');
  winNoteFastBatchActivity();
}

// ---- Orbe: estado visual ----
function applyWinOrbState(mode, statusText){

// ---- Escucha continua: pide el micrófono UNA vez (toque inicial obligatorio del
// navegador), y desde ahí queda escuchando sola, sin que haya que volver a tocar nada
// cada vez que se le quiera hablar. Reacciona en vivo al volumen de la voz.
// ---- Secuencia de arranque "tipo Jarvis": barra de carga + anillos que arman el nombre.
// Puro SVG/CSS, se reproduce encima de todo cada vez que se activa el micrófono y se disuelve sola.
const WIN_INTRO_LOG = [
  'MONTANDO MEMORIA DE WIN ... OK',
  'VERIFICANDO CONEXIÓN CON EL PANEL ... OK',
  'CARGANDO VOZ Y RECONOCIMIENTO ... OK',
  'SINCRONIZANDO CON PAYWIN ... OK'
];
function playWinIntroSequence(){
  const intro = document.getElementById('winIntro');
  if(!intro) return;
  const seg = document.getElementById('winIntroSeg');
  const log = document.getElementById('winIntroLog');
  const bar = document.getElementById('winIntroBar');
  const ringsWrap = document.getElementById('winIntroRingsWrap');
  seg.innerHTML = Array.from({ length: 22 }, (_, i)=>`<span class="win-intro-seg-cell" style="animation-delay:${i*42}ms"></span>`).join('');
  log.innerHTML = WIN_INTRO_LOG.map((l,i)=>`<div class="win-intro-log-line" style="animation-delay:${300+i*210}ms">${l}</div>`).join('');
  bar.classList.remove('win-intro-bar-dim');
  ringsWrap.classList.remove('win-intro-rings-in');
  intro.style.display = 'block';
  intro.style.opacity = '1';
  intro.style.filter = 'none';
  playWinSfx('boot');
  setTimeout(()=>{ bar.classList.add('win-intro-bar-dim'); ringsWrap.classList.add('win-intro-rings-in'); }, 1300);
  setTimeout(()=>{ intro.style.opacity = '0'; intro.style.filter = 'blur(10px)'; }, 2550);
  setTimeout(()=>{ intro.style.display = 'none'; }, 3250);
}

async function startWinListening(){
  if(winListeningActive) return;
  applyWinOrbState('idle', 'Activando a Win...');
  playWinIntroSequence();
  try{
    winMicStream = await navigator.mediaDevices.getUserMedia({ audio: WIN_AUDIO_CONSTRAINTS });
  }catch(e){
    applyWinOrbState('idle', 'No se pudo activar el micrófono. Tócalo para intentar de nuevo.');
    return;
  }
  winListeningActive = true;
  if(winPowerRefresh) winPowerRefresh();
  winAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
  const source = winAudioCtx.createMediaStreamSource(winMicStream);
  winAnalyser = winAudioCtx.createAnalyser();
  winAnalyser.fftSize = 256;
  source.connect(winAnalyser);
  winVolumeLoop();
  winConversation = []; // conversación nueva cada vez que se activa el micrófono
  applyWinOrbState('listening', winHasSpeechRecognition ? 'Escuchando... dile "hola Win" para empezar' : 'Listo -- toca para hablar, y toca otra vez para mandar');
  // La cara despierta justo cuando la secuencia de arranque se disuelve, no de entrada.
  const orb = document.getElementById('winOrb');
  const auraWrap = document.getElementById('winAuraWrap');
  setTimeout(()=>{
    if(orb) orb.classList.add('win-boot-in');
    if(auraWrap) auraWrap.classList.add('win-booting');
    playWinSfx('wake');
    setTimeout(()=>{
      if(orb) orb.classList.remove('win-boot-in');
      if(auraWrap) auraWrap.classList.remove('win-booting');
    }, 950);
  }, 2500);
  // En navegadores sin reconocimiento de voz nativo (todo iPhone), el micrófono queda listo
  // (para el medidor de nivel y para grabar) pero no se arranca ningún dictado continuo solo --
  // se espera el toque de "mantén para hablar" (ver winPTTStart/winPTTStopAndSend y winOrbTap).
  if(winHasSpeechRecognition) startWinRecognitionEngine();
}

// ---- "Mantén tocado para hablar" (iPhone y cualquier navegador sin SpeechRecognition) ----
// En vez de escuchar continuo, se grava mientras el jefe mantiene tocado el círculo y, al
// soltarlo, se manda el audio a transcribir con ElevenLabs (api/win-transcribir.js) -- de ahí
// sale el texto que sigue el mismo camino de siempre (processWinVoiceCommand).
function winPTTPickMimeType(){
  const candidates = ['audio/mp4', 'audio/webm;codecs=opus', 'audio/webm', 'audio/ogg'];
  for(const type of candidates){
    if(window.MediaRecorder && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(type)) return type;
  }
  return '';
}

function winPTTStart(){
  if(!winMicStream || winPTTRecording) return;
  try{
    const mimeType = winPTTPickMimeType();
    winPTTRecorder = mimeType ? new MediaRecorder(winMicStream, { mimeType }) : new MediaRecorder(winMicStream);
    winPTTChunks = [];
    winPTTRecorder.ondataavailable = (e)=>{ if(e.data && e.data.size) winPTTChunks.push(e.data); };
    winPTTRecorder.onstop = ()=>{ winPTTFinish(winPTTRecorder.mimeType || mimeType || 'audio/mp4'); };
    winPTTRecorder.start();
    winPTTRecording = true;
    applyWinOrbState('listening', 'Grabando... toca para mandar');
    playWinSfx('wake');
  }catch(e){
    console.error('No se pudo empezar a grabar:', e);
    applyWinOrbState('idle', 'No se pudo grabar. Toca para intentar de nuevo.');
  }
}

function winPTTStopAndSend(){
  if(!winPTTRecorder || !winPTTRecording) return;
  applyWinOrbState('thinking', 'Mandando audio...');
  try{ winPTTRecorder.stop(); }catch(e){ winPTTRecording = false; }
  winPTTRecording = false;
}

async function winPTTFinish(mimeType){
  if(!winPTTChunks.length){
    applyWinOrbState('listening', 'No se grabó nada -- toca para hablar');
    return;
  }
  const blob = new Blob(winPTTChunks, { type: mimeType });
  winPTTChunks = [];
  try{
    const audioBase64 = await new Promise((resolve, reject)=>{
      const reader = new FileReader();
      reader.onload = ()=>resolve(String(reader.result).split(',')[1] || '');
      reader.onerror = reject;
      reader.readAsDataURL(blob);
    });
    const res = await fetch('/api/win-transcribir', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ audioBase64, mimeType })
    });
    const data = await res.json().catch(()=>({}));
    if(!res.ok || !data.text){ throw new Error((data && data.error) || 'No se pudo transcribir.'); }
    processWinVoiceCommand(data.text.trim());
  }catch(e){
    console.error('Error transcribiendo con ElevenLabs:', e);
    applyWinOrbState('listening', 'No te escuché bien -- toca para hablar de nuevo');
  }
}

// ---- Voz de Win (texto a voz del navegador) ----
// UN SOLO elemento <audio>, reusado para todas las respuestas -- crear uno nuevo (new Audio())
// en cada respuesta es justo lo que hacía que la voz se "bloqueara" después de la primera vez
// en iPhone: Safari solo deja sonar sin restricciones al elemento que ya tocaste/desbloqueaste,
// no a uno creado después.
let winAudioEl = null;
let winSfxCtx = null;

// Efectos de sonido de Win: generados con Web Audio (no son archivos, así que no hay nada que
// cargar ni hostear). Son decorativos -- si el navegador los bloquea o falla algo, se ignora
// en silencio y el resto de Win sigue funcionando igual.
function getWinSfxCtx(){
  if(!winSfxCtx) winSfxCtx = new (window.AudioContext || window.webkitAudioContext)();
  if(winSfxCtx.state === 'suspended') winSfxCtx.resume();
  return winSfxCtx;
}
function winSfxTone(ctx, { freq, freqEnd, start, dur, type='sine', gain=0.08 }){
  const osc = ctx.createOscillator();
  const g = ctx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, ctx.currentTime + start);
  if(freqEnd) osc.frequency.linearRampToValueAtTime(freqEnd, ctx.currentTime + start + dur);
  g.gain.setValueAtTime(0, ctx.currentTime + start);
  g.gain.linearRampToValueAtTime(gain, ctx.currentTime + start + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + start + dur);
  osc.connect(g); g.connect(ctx.destination);
  osc.start(ctx.currentTime + start);
  osc.stop(ctx.currentTime + start + dur + 0.05);
}
function playWinSfx(type){
  try{
    const ctx = getWinSfxCtx();
    if(type === 'boot'){
      winSfxTone(ctx, { freq:90, freqEnd:420, start:0, dur:1.1, type:'sawtooth', gain:.045 });
      winSfxTone(ctx, { freq:1200, start:.15, dur:.08, gain:.05 });
      winSfxTone(ctx, { freq:1500, start:.55, dur:.08, gain:.05 });
      winSfxTone(ctx, { freq:1800, start:.95, dur:.08, gain:.05 });
    } else if(type === 'wake'){
      winSfxTone(ctx, { freq:660, start:0, dur:.18, gain:.09 });
      winSfxTone(ctx, { freq:880, start:.1, dur:.22, gain:.09 });
    } else if(type === 'speakStart'){
      winSfxTone(ctx, { freq:980, start:0, dur:.06, gain:.035 });
    } else if(type === 'action'){
      winSfxTone(ctx, { freq:520, start:0, dur:.09, type:'triangle', gain:.08 });
      winSfxTone(ctx, { freq:780, start:.08, dur:.12, type:'triangle', gain:.08 });
    } else if(type === 'confirm'){
      // Sonidito corto para las ráfagas de registros rápidos -- confirma que esa acción puntual
      // ya quedó guardada, sin tener que esperar a que Win diga toda la frase.
      winSfxTone(ctx, { freq:1100, start:0, dur:.07, type:'sine', gain:.06 });
      winSfxTone(ctx, { freq:1450, start:.06, dur:.09, type:'sine', gain:.06 });
    }
  }catch(e){ /* efecto decorativo -- si falla, no pasa nada */ }
}

// Voz de Win: intenta primero la voz real de ElevenLabs (api/win-voz.js); si esa llamada falla
// por cualquier motivo (sin API key configurada todavía, sin internet, etc.) cae sola a la voz
// gratis del navegador, así que Win nunca se queda muda mientras se termina de configurar.
async function winSpeak(text, onDone){
  const goListen = ()=>{
    if(!winListeningActive) return;
    if(winHasSpeechRecognition){
      applyWinOrbState('listening', 'Escuchando... dime qué necesitas');
      startWinRecognitionEngine();
    } else {
      // Modo "mantén tocado para hablar" (iPhone) -- no hay nada que arrancar solo, queda
      // lista esperando el próximo toque.
      applyWinOrbState('listening', 'Toca para hablar');
    }
    if(onDone) onDone();
  };
  if(winRecognition){ try{ winRecognition.onend = null; winRecognition.stop(); }catch(e){} }

  try{
    const res = await fetch('/api/win-voz', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text })
    });
    if(!res.ok) throw new Error('voz no disponible');
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    if(!winAudioEl){ winAudioEl = new Audio(); winAudioEl.setAttribute('playsinline', 'true'); }
    try{ winAudioEl.pause(); }catch(e){}
    const prevUrl = winAudioEl.dataset.objectUrl;
    winAudioEl.src = url;
    winAudioEl.dataset.objectUrl = url;
    applyWinOrbState('speaking', text);
    playWinSfx('speakStart');
    winAudioEl.onended = ()=>{ URL.revokeObjectURL(url); goListen(); };
    winAudioEl.onerror = ()=>{ URL.revokeObjectURL(url); winSpeakBrowser(text, goListen); };
    if(prevUrl && prevUrl !== url){ try{ URL.revokeObjectURL(prevUrl); }catch(e){} }
    await winAudioEl.play();
  }catch(e){
    winSpeakBrowser(text, goListen);
  }
}

function winSpeakBrowser(text, goListen){
  if(!('speechSynthesis' in window)){ goListen(); return; }
  try{
    window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = 'es-EC';
    utter.rate = 1.03;
    applyWinOrbState('speaking', text);
    playWinSfx('speakStart');
    utter.onend = goListen;
    utter.onerror = goListen;
    window.speechSynthesis.speak(utter);
  }catch(e){ goListen(); }
}

function winVolumeLoop(){
  if(!winListeningActive || !winAnalyser) return;
  const data = new Uint8Array(winAnalyser.frequencyBinCount);
  winAnalyser.getByteFrequencyData(data);
  const avg = data.reduce((a,b)=>a+b,0) / data.length; // 0..255
  winFxLevel = Math.max(winFxLevel, Math.min(avg / 110, 1));
  const orb = document.getElementById('winOrb');
  if(orb && !orb.classList.contains('win-orb-thinking')){
    const scale = 0.85 + Math.min(avg / 130, 1) * 0.3;
    orb.style.transform = `scale(${scale.toFixed(3)})`;
  }
  const bars = document.getElementById('winBars');
  if(bars && !bars.classList.contains('win-bars-animate')){
    const barEls = bars.querySelectorAll('.win-bar');
    const bands = barEls.length;
    const step = Math.floor(data.length / (bands + 1)) || 1;
    barEls.forEach((bar, i)=>{
      const v = data[(i + 1) * step] || 0; // 0..255, salta la primera banda (suele ser ruido/graves)
      const h = 3 + Math.min(v / 255, 1) * 17;
      bar.style.height = h.toFixed(1) + 'px';
      bar.style.opacity = (0.35 + Math.min(v / 255, 1) * 0.6).toFixed(2);
    });
  }
  winAnimFrameId = requestAnimationFrame(winVolumeLoop);
}

function startWinRecognitionEngine(){
  const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  winRecognition = new Recognition();
  winRecognition.lang = 'es-EC';
  winRecognition.continuous = true;
  winRecognition.interimResults = true;
  winRecognition.onresult = (e)=>{
    let interim = '';
    for(let i = e.resultIndex; i < e.results.length; i++){
      const transcript = e.results[i][0].transcript;
      if(e.results[i].isFinal){
        winFinalBuffer += (winFinalBuffer ? ' ' : '') + transcript;
      } else {
        interim += transcript;
      }
    }
    const liveEl = document.getElementById('winLiveTranscript');
    if(liveEl) liveEl.textContent = (winFinalBuffer + ' ' + interim).trim();
    clearTimeout(winSilenceTimer);
    winSilenceTimer = setTimeout(()=>{
      if(winFinalBuffer.trim()) processWinVoiceCommand(winFinalBuffer.trim());
      winFinalBuffer = '';
    }, 1300);
  };
  winRecognition.onerror = (e)=>{
    if(e.error === 'not-allowed' || e.error === 'service-not-allowed'){
      winListeningActive = false;
      applyWinOrbState('idle', 'El navegador bloqueó el micrófono. Revisa los permisos y toca de nuevo.');
    }
    // 'no-speech' y otros errores menores se resuelven solos con el auto-reinicio de onend.
  };
  winRecognition.onend = ()=>{
    if(winListeningActive){
      try{ winRecognition.start(); }catch(e){ setTimeout(()=>{ if(winListeningActive) try{ winRecognition.start(); }catch(e2){} }, 300); }
    }
  };
  try{ winRecognition.start(); }catch(e){}
}

function stopWinListening(){
  winListeningActive = false;
  clearTimeout(winSilenceTimer);
  if(winAnimFrameId) cancelAnimationFrame(winAnimFrameId);
  if(winRecognition){ try{ winRecognition.onend = null; winRecognition.stop(); }catch(e){} winRecognition = null; }
  if(winMicStream){ winMicStream.getTracks().forEach(t=>t.stop()); winMicStream = null; }
  if(winAudioCtx){ try{ winAudioCtx.close(); }catch(e){} winAudioCtx = null; }
  if('speechSynthesis' in window){ try{ window.speechSynthesis.cancel(); }catch(e){} }
  // OJO: solo se pausa, nunca se descarta (winAudioEl = null) -- es el mismo elemento que ya
  // quedó desbloqueado para reproducir sin restricciones en iPhone, y crear uno nuevo más
  // adelante volvería a estar bloqueado.
  if(winAudioEl){ try{ winAudioEl.pause(); }catch(e){} }
  if(winPTTRecorder){ try{ winPTTRecorder.onstop = null; if(winPTTRecording) winPTTRecorder.stop(); }catch(e){} winPTTRecorder = null; winPTTRecording = false; }
  winPTTChunks = [];
  winFinalBuffer = '';
  winConversation = [];
  clearTimeout(winFastBatchTimer);
  winFastBatchPending = 0;
  winUpdateBurstBadge();
  const orb = document.getElementById('winOrb');
  if(orb){ orb.style.transform = ''; }
  applyWinOrbState('idle', 'Win apagado. Toca el círculo o "Encender Win" para activarlo');
  const liveEl = document.getElementById('winLiveTranscript');
  if(liveEl) liveEl.textContent = '';
  if(winPowerRefresh) winPowerRefresh();
}

// Frase corta que Win dice al activar una herramienta, por si el modelo no mandó texto
// propio junto con la acción (para que nunca se quede muda antes de abrir el formulario).
const WIN_TOOL_ACK = {
  abrir_formulario_apuesta: 'Dale, te abro el formulario.',
  abrir_formulario_contenido: 'Va, sube la imagen.',
  crear_recordatorio: 'Listo, te lo anoto.',

  mandar_stake_pago: 'Dale, sube la foto del stake.',
  mandar_partidos_dia: 'Dale, sube las fotos de los partidos.',

  abrir_difusion: 'Va, te abro las listas de difusión.'

// Estas tres se usan en ráfaga (varios registros por minuto) -- no esperan a que Win hable
// para seguir, y el "listo" no es frase por frase sino al final de la ráfaga (ver
// winNoteFastBatchActivity).
const WIN_FAST_BATCH_TOOLS = ['registrar_cuadre', 'crear_seccion_stake', 'registrar_venta_stake'];

async function processWinVoiceCommand(texto){
  const liveEl = document.getElementById('winLiveTranscript');
  if(liveEl) liveEl.textContent = '';
  winConversation.push({ role: 'user', content: texto });
  applyWinOrbState('thinking', 'Pensando...');
  try{
    const res = await fetch('/api/win-chat', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: winConversation, memory: state.winMemory.map(m=>m.text), publicidades: state.winTemplates.map(t=>t.nombre) })
    });
    const result = await res.json();
    if(!res.ok){
      console.error('Error de win-chat:', result);
      applyWinOrbState('listening', result.error || 'No se pudo entender. Intenta de nuevo.');
      return;
    }
    const tools = result.tools || [];
    const memoryTools = tools.filter(t=>t.name === 'guardar_recuerdo');
    const actionTools = tools.filter(t=>t.name !== 'guardar_recuerdo');

    // Guardar recuerdos nuevos pasa calladito, sin que Win tenga que anunciarlo.
    for(const mt of memoryTools){
      const texto2 = (mt.input && mt.input.texto || '').trim();
      if(texto2) saveWinMemory(texto2);
    }

    const firstAction = actionTools[0];

    // Ráfaga rápida: ni frase ni pausa del micrófono -- un sonidito nada más y se sigue
    // escuchando de una, para que el jefe pueda mandar varios registros seguidos sin esperar
    // a que Win termine de hablar cada vez.
    if(firstAction && WIN_FAST_BATCH_TOOLS.includes(firstAction.name)){
      winConversation.push({ role: 'assistant', content: `(${firstAction.name})` });
      applyWinOrbState('listening', 'Escuchando... dime qué necesitas');
      dispatchWinTool(firstAction);
      return;
    }

    // Un comando normal interrumpe/cierra cualquier ráfaga pendiente -- Win ya va a hablar
    // de todas formas, así que no hace falta un "listo" aparte después.
    winFastBatchPending = 0;
    clearTimeout(winFastBatchTimer);
    winUpdateBurstBadge();

    const spoken = (result.textReply && result.textReply.trim()) || (firstAction ? WIN_TOOL_ACK[firstAction.name] : null) || 'Ok.';
    winConversation.push({ role: 'assistant', content: firstAction ? `${spoken} (${firstAction.name})` : spoken });
    winSpeak(spoken, ()=>{ if(firstAction) dispatchWinTool(firstAction); });
  }catch(e){
    console.error(e);
    applyWinOrbState('listening', 'No se pudo conectar. Intenta de nuevo.');
  }
}

async function saveWinMemory(texto){
  state.winMemory.push({ id: uid(), text: texto, createdAt: new Date().toISOString() });
  await persist('winMemory');

async function sendWinCommand(){
  const input = document.getElementById('winCommandInput');
  const texto = input.value.trim();
  if(!texto) return;
  input.value = '';
  processWinVoiceCommand(texto);
}

function dispatchWinTool(tool){
  const input = tool.input || {};
  // Las de ráfaga rápida suenan solas cuando de verdad terminan de guardarse (ver los
  // handleRegistrar.../handleCrear... y winNoteFastBatchActivity) -- acá sonaría antes de
  // tiempo, mientras todavía se está guardando.
  if(!WIN_FAST_BATCH_TOOLS.includes(tool.name)) playWinSfx('action');
  if(tool.name === 'abrir_formulario_apuesta') openWinBetForm(input.kind === 'ganada' ? 'ganada' : 'nueva_apuesta', input.destino || '');
  else if(tool.name === 'abrir_formulario_contenido') openWinContentForm(input.nota || '', input.destino || '');
  else if(tool.name === 'crear_recordatorio') openWinReminderForm(input.texto || '', input.fecha || '', input.hora || '');
  else if(tool.name === 'mandar_regalito') openWinGiftFlow();
  else if(tool.name === 'mandar_protocolo_manana') handleMandarProtocoloManana();
  else if(tool.name === 'mandar_paso_protocolo_manana') handleMandarPasoProtocoloManana(tool.input);
  else if(tool.name === 'mandar_publicidad_guardada') handleMandarPublicidadGuardada(input);
  else if(tool.name === 'registrar_cuadre') handleRegistrarCuadre(input);
  else if(tool.name === 'crear_seccion_stake') handleCrearSeccionStake(input);
  else if(tool.name === 'registrar_venta_stake') handleRegistrarVentaStake(input);
  else if(tool.name === 'subir_testimonio') openTestimonioUploadModal();
  else if(tool.name === 'mandar_stake_pago') openStakePagoUploadModal();
  else if(tool.name === 'mandar_partidos_dia') openPartidosDiaModal();
  else if(tool.name === 'mandar_collage') openCollageUploadModal();
  else if(tool.name === 'abrir_difusion') handleAbrirDifusion(input);
}

  dropzone.ondrop = (e)=>{ e.preventDefault(); dropzone.style.borderColor='var(--border)'; if(e.dataTransfer.files[0]) setFile(e.dataTransfer.files[0]); };
  fileInput.onchange = ()=>{ if(fileInput.files[0]) setFile(fileInput.files[0]); };
  document.addEventListener('paste', function pasteHandler(e){
    if(!document.getElementById('winDropzone')){ document.removeEventListener('paste', pasteHandler); return; }
    const item = [...e.clipboardData.items].find(i=>i.type.startsWith('image/'));
    if(item) setFile(item.getAsFile());
  }, { once: true });
}

// ---------- Editor para censurar a mano ----------
// Muestra la imagen y dejas arrastrar recuadros negros encima de lo que quieres tapar (nombre,
// número, cuenta, etc.). Devuelve una promesa con el canvas ya censurado (null si cancelas).
// OJO: a diferencia del modo automático (que tapa todo menos el monto), aquí queda visible todo lo
// que tú no tapes -- por eso se pide revisar antes de mandar.
function winCensorEditor(file, titulo){
  return new Promise((resolve)=>{
    const reader = new FileReader();
    reader.onerror = ()=>resolve(null);
    reader.onload = ()=>{
      const img = new Image();
      img.onerror = ()=>resolve(null);
      img.onload = ()=>{
        const scale = Math.min(1, 1600 / img.width);
        const W = Math.max(1, Math.round(img.width * scale)), H = Math.max(1, Math.round(img.height * scale));
        const base = document.createElement('canvas'); base.width = W; base.height = H;
        base.getContext('2d').drawImage(img, 0, 0, W, H);
        const rects = [];
        let drag = null;
        openModal(`
          <h3>${titulo || 'Censurar imagen'}</h3>
          <div style="font-size:12.5px; color:var(--muted); margin-bottom:10px;">Arrastra con el dedo o el mouse para tapar con negro lo que NO debe verse (nombres, números, cuentas). Puedes hacer todos los recuadros que quieras. Lo que no tapes, se publica.</div>
          <div style="max-height:62vh; overflow:auto; border:1px solid var(--border); border-radius:8px;">
            <canvas id="winCensorCanvas" style="display:block; width:100%; touch-action:none; cursor:crosshair;"></canvas>
          </div>
          <div id="winCensorInfo" style="font-size:12px; color:var(--muted); margin:8px 0;">0 recuadros</div>
          <div class="modal-actions" style="flex-wrap:wrap;">
            <button class="btn secondary" id="winCensorUndo" type="button">↩️ Deshacer</button>
            <button class="btn secondary" id="winCensorClear" type="button">Limpiar</button>
            <button class="btn secondary" id="winCensorCancel" type="button">← Volver</button>
            <button class="btn" id="winCensorDone" type="button">Listo, continuar</button>
          </div>
        `);
        const cv = document.getElementById('winCensorCanvas');
        cv.width = W; cv.height = H;
        const ctx = cv.getContext('2d');
        const info = ()=>{ document.getElementById('winCensorInfo').textContent = `${rects.length} recuadro${rects.length===1?'':'s'}`; };
        const draw = ()=>{
          ctx.drawImage(base, 0, 0);
          ctx.fillStyle = '#000';
          rects.forEach(r=>ctx.fillRect(r.x, r.y, r.w, r.h));
          if(drag){
            ctx.fillStyle = 'rgba(0,0,0,0.65)';
            ctx.fillRect(Math.min(drag.x0, drag.x1), Math.min(drag.y0, drag.y1), Math.abs(drag.x1 - drag.x0), Math.abs(drag.y1 - drag.y0));
          }
        };
        const pos = (e)=>{
          const b = cv.getBoundingClientRect();
          return { x: Math.max(0, Math.min(W, (e.clientX - b.left) * W / b.width)), y: Math.max(0, Math.min(H, (e.clientY - b.top) * H / b.height)) };
        };
        cv.onpointerdown = (e)=>{ e.preventDefault(); cv.setPointerCapture(e.pointerId); const p = pos(e); drag = { x0:p.x, y0:p.y, x1:p.x, y1:p.y }; };
        cv.onpointermove = (e)=>{ if(!drag) return; const p = pos(e); drag.x1 = p.x; drag.y1 = p.y; draw(); };
        const fin = ()=>{
          if(!drag) return;
          const r = { x:Math.min(drag.x0, drag.x1), y:Math.min(drag.y0, drag.y1), w:Math.abs(drag.x1 - drag.x0), h:Math.abs(drag.y1 - drag.y0) };
          drag = null;
          if(r.w > 6 && r.h > 6) rects.push(r);
          draw(); info();
        };
        cv.onpointerup = fin; cv.onpointercancel = fin;
        document.getElementById('winCensorUndo').onclick = ()=>{ rects.pop(); draw(); info(); };
        document.getElementById('winCensorClear').onclick = ()=>{ rects.length = 0; draw(); info(); };
        document.getElementById('winCensorCancel').onclick = ()=>{ resolve(null); };
        document.getElementById('winCensorDone').onclick = ()=>{
          if(!rects.length && !confirm('No taparon nada: la imagen se publicaría COMPLETA, con todos los datos. ¿Seguro?')) return;
          const out = document.createElement('canvas'); out.width = W; out.height = H;
          const octx = out.getContext('2d');
          octx.drawImage(base, 0, 0);
          octx.fillStyle = '#000';
          rects.forEach(r=>octx.fillRect(r.x, r.y, r.w, r.h));
          resolve(out);
        };
        draw();
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

// Redibuja la imagen ORIGINAL (no la comprimida que se manda a leer, para mejor nitidez) en
// un canvas totalmente negro, y solo "recorta" de vuelta los recuadros de los montos
// detectados (con un margen de seguridad). Devuelve el canvas resultante.
function buildRedactedImage(file, montos){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        const maxW = 1600;
        const scale = Math.min(1, maxW / img.width);
        const w = Math.max(1, Math.round(img.width * scale));
        const h = Math.max(1, Math.round(img.height * scale));
        const src = document.createElement('canvas');
        src.width = w; src.height = h;
        src.getContext('2d').drawImage(img, 0, 0, w, h);

        const out = document.createElement('canvas');
        out.width = w; out.height = h;
        const octx = out.getContext('2d');
        octx.fillStyle = '#000';
        octx.fillRect(0, 0, w, h);

        const PAD = 0.025; // margen extra alrededor de cada monto, por si el recuadro vino muy justo
        (montos || []).forEach(m=>{
          const padX = w * PAD, padY = h * PAD;
          let bx = Math.max(0, (Number(m.x) || 0) * w - padX);
          let by = Math.max(0, (Number(m.y) || 0) * h - padY);
          let bw = Math.min(w - bx, (Number(m.w) || 0) * w + padX * 2);
          let bh = Math.min(h - by, (Number(m.h) || 0) * h + padY * 2);
          if(bw <= 0 || bh <= 0) return;
          octx.drawImage(src, bx, by, bw, bh, bx, by, bw, bh);
        });
        resolve(out);
      };
      img.onerror = ()=>reject(new Error('No se pudo leer la imagen.'));
      img.src = reader.result;
    };
    reader.onerror = ()=>reject(new Error('No se pudo leer el archivo.'));
    reader.readAsDataURL(file);
  });
}

// Mismas reglas de compresión/miniatura que fileToCompressedImage/fileToThumbnail, pero
// partiendo de un canvas ya en memoria (la imagen redactada) en vez de un File.
function canvasToCompressed(canvas){
  const dataUrl = canvas.toDataURL('image/jpeg', 0.82);
  return { base64: dataUrl.split(',')[1], mediaType: 'image/jpeg', previewUrl: dataUrl };
}
function canvasToThumbnail(canvas){
  const MAX_CHARS = 38000;
  const steps = [
    { w: 480, q: 0.55 }, { w: 480, q: 0.4 }, { w: 360, q: 0.5 },
    { w: 360, q: 0.35 }, { w: 260, q: 0.4 }, { w: 200, q: 0.35 }, { w: 160, q: 0.3 }
  ];
  let result = '';
  for(const step of steps){
    const scale = Math.min(1, step.w / canvas.width);
    const w = Math.max(1, Math.round(canvas.width * scale));
    const h = Math.max(1, Math.round(canvas.height * scale));
    const c2 = document.createElement('canvas');
    c2.width = w; c2.height = h;
    c2.getContext('2d').drawImage(canvas, 0, 0, w, h);
    const dataUrl = c2.toDataURL('image/jpeg', step.q);
    result = dataUrl;
    if(dataUrl.length <= MAX_CHARS) break;
  }
  return result.length <= MAX_CHARS ? result : '';
}

// Acomoda varios canvases ya censurados en una sola imagen tipo cuadrícula, cada uno dentro de
// su propia celda cuadrada (sin recortarlo -- lo que no entra queda con fondo oscuro alrededor,
// igual que el fondo del panel, para que no se note como un "parche").
function buildCollageImage(canvases){
  const n = canvases.length;
  const cols = Math.max(1, Math.ceil(Math.sqrt(n)));
  const rows = Math.max(1, Math.ceil(n / cols));
  const gap = 10;
  const targetW = 1200;
  const cell = Math.max(160, Math.floor((targetW - gap * (cols + 1)) / cols));
  const totalW = cols * cell + (cols + 1) * gap;
  const totalH = rows * cell + (rows + 1) * gap;
  const out = document.createElement('canvas');
  out.width = totalW; out.height = totalH;
  const ctx = out.getContext('2d');
  ctx.fillStyle = '#0D1117';
  ctx.fillRect(0, 0, totalW, totalH);
  canvases.forEach((c, i)=>{
    const col = i % cols, row = Math.floor(i / cols);
    const cx = gap + col * (cell + gap);
    const cy = gap + row * (cell + gap);
    ctx.fillStyle = '#000';
    ctx.fillRect(cx, cy, cell, cell);
    const scale = Math.min(cell / c.width, cell / c.height);
    const dw = c.width * scale, dh = c.height * scale;
    ctx.drawImage(c, cx + (cell - dw) / 2, cy + (cell - dh) / 2, dw, dh);
  });
  return out;
}

async function submitCollage(opts){

        return await buildRedactedImage(file, result.montos);
      }catch(e){ console.error('No se pudo procesar una de las capturas del collage:', e); return null; }
    }));
    const canvases = resultados.filter(Boolean);
    if(!canvases.length){
      alert('No pude identificar el monto con seguridad en ninguna de las capturas, así que no voy a arriesgarme a publicarlas. Intenta con fotos más claras.');

    const faltantes = winCollageFiles.length - canvases.length;
    openWinCaptionConfirm('collage', grupos, caption, thumb || compressed.previewUrl, { base64: compressed.base64, mediaType: compressed.mediaType }, { kind: 'collage', destino: grupos.join(', ')  }, ()=>submitCollage({ grupos, modo: 'manual' }));
    if(faltantes) setTimeout(()=>alert(`Ojo: ${faltantes} de las ${winCollageFiles.length} capturas no se pudieron leer bien y se quedaron FUERA del collage (por seguridad, no se publican si no se detecta el monto con claridad).`), 300);

// Número local guardado (ej: "0991234567") -> jid de WhatsApp para mandar un DM directo.
// Si ya viene con código de país (593...) se respeta tal cual.
function phoneToJid(phoneRaw){
  let p = String(phoneRaw || '').replace(/[^\d]/g, '');
  if(!p) return '';
  if(p.startsWith('593')) { /* ya trae código de país */ }
  else if(p.startsWith('0')) p = '593' + p.slice(1);
  else p = '593' + p;
  return p + '@s.whatsapp.net';
}

async function submitWinBet(kind, opts){
  opts = opts || {};
  const tipoSel = opts.tipo !== undefined ? opts.tipo : ((document.getElementById('f-winTipo') || {}).value || '');
  const ganadaSel = opts.ganada !== undefined ? opts.ganada : ((document.getElementById('f-winGanadaPick') || {}).value || '');
  winPreset = { tipo: tipoSel, ganada: ganadaSel };
  const grupos = opts.grupos || getCheckedWinGroups('f-winGroups');
  const code = opts.code !== undefined ? opts.code : (document.getElementById('f-winCode') ? document.getElementById('f-winCode').value.trim() : '');
  if(!grupos.length){ alert('Marca a qué grupo va.'); return; }
  if(opts.file) winPendingFile = opts.file;
  if(!winPendingFile){ alert('Sube la captura primero.'); return; }
  const archivoOriginal = winPendingFile;
  let censurada = null;
  const quiereCensurar = opts.censurar !== undefined ? opts.censurar : !!(document.getElementById('f-winCensurar') && document.getElementById('f-winCensurar').checked);
  if(quiereCensurar){
    const canvas = await winCensorEditor(winPendingFile, 'Censura la captura antes de mandarla');
    if(!canvas){ winVolverFormularioApuesta(kind, grupos, code, archivoOriginal, tipoSel, ganadaSel); return; }
    censurada = { ...canvasToCompressed(canvas), thumb: canvasToThumbnail(canvas) };
  }
  openModal(`<h3>Redactando...</h3><div style="text-align:center; padding:30px 0; color:var(--muted); font-size:13.5px;">Esto toma unos segundos.</div>`);
  try{
    const { base64, mediaType, previewUrl } = censurada || await fileToCompressedImage(winPendingFile);
    const thumb = censurada ? censurada.thumb : await fileToThumbnail(winPendingFile).catch(()=> '');
    const res = await fetch('/api/win-redactar', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ telefono: WIN_TELEFONO, kind, destino: grupos.join(', '), code, imageBase64: base64, mediaType })
    });
    const result = await res.json();
    const caption = (result && result.caption) || (isGanadaFallback(kind) ? '🔥 ¡GANADA CONFIRMADA! 🔥' : code || 'Nueva apuesta disponible.');
    openWinCaptionConfirm(kind, grupos, caption, thumb || previewUrl, { base64, mediaType }, { kind, destino: grupos.join(', '), code, imageBase64: base64, mediaType }, ()=> quiereCensurar ? submitWinBet(kind, { grupos, code, file: archivoOriginal, censurar: true, tipo: tipoSel, ganada: ganadaSel }) : winVolverFormularioApuesta(kind, grupos, code, archivoOriginal, tipoSel, ganadaSel));
  }catch(e){
    console.error(e);
    alert('No se pudo generar el texto. Intenta de nuevo.');
    closeModal();
    renderWin();
  }
}

// cuando el texto vino de la IA (win-redactar) -- un botón pide OTRA versión distinta, y el
// micrófono deja dictar (o escribir) qué corregir si la IA generó algo que no tiene nada que
// ver. "redactCtx" trae lo mínimo para volver a pedirle el texto a Win: { kind, destino, code,
// imageBase64?, mediaType?, images? }. El textarea objetivo es siempre #f-winCaptionConfirm.

// ---------- Ganadas guardadas para publicar al día siguiente ----------
// En la pantalla de una apuesta ganada se puede marcar "guardarla para mañana". Al día siguiente,
// el botón 📣 de Win ("Ganadas de ayer") junta todas las guardadas para reenviarlas con un toque.
async function winSubirImagenBlob(sendImage, nombre){
  if(!sendImage) return '';
  if(sendImage.url) return sendImage.url;
  if(!sendImage.base64) return '';
  const up = await withTimeout(fetch('/api/win-imagen', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ base64: sendImage.base64, mediaType: sendImage.mediaType, nombre }) }), 30000);
  const d = await up.json().catch(()=>({}));
  return (up.ok && d.url) ? d.url : '';
}
async function winGuardarGanadaParaManana(texto, grupos, sendImage){
  const hoy = new Date(Date.now() - 5*60*60*1000).toISOString().slice(0,10);
  const imageUrl = await winSubirImagenBlob(sendImage, 'ganada');
  if(!imageUrl && sendImage) throw new Error('No se pudo guardar la imagen. Revisa tu conexión e intenta de nuevo.');
  state.winGanadas.push({ id: uid(), date: hoy, caption: texto, imageUrl, grupos: (grupos || []).join(','), status: 'pendiente', publishedAt: '' });
  await persist('winGanadas');
}
function winGanadasPendientes(){
  return (state.winGanadas || []).filter(g=>g.status === 'pendiente').sort((a,b)=>String(a.date).localeCompare(String(b.date)));
}
function openWinGanadasAyerModal(){
  const hoy = new Date(Date.now() - 5*60*60*1000).toISOString().slice(0,10);
  const lista = winGanadasPendientes();
  const ayer = lista.filter(g=>g.date < hoy);
  const deHoy = lista.filter(g=>g.date >= hoy);
  const item = (g)=>`<div style="border:1px solid var(--border); border-radius:10px; padding:10px; margin-bottom:8px; display:flex; gap:10px;">

      <div style="flex:1; min-width:0;">

        <div style="font-size:13px; white-space:pre-wrap; max-height:64px; overflow:hidden;">${escapeForTextarea(g.caption)}</div>
        <button class="btn danger small" data-gan-del="${g.id}" style="margin-top:6px;">Descartar</button>
      </div>
    </div>`;
  openModal(`
    <h3>📣 Ganadas de ayer</h3>
    <div style="font-size:12.5px; color:var(--muted); margin-bottom:12px;">Las ganadas que guardaste para publicar después. Un toque las manda todas a sus grupos (con pausa entre cada una).</div>
    ${ayer.length ? ayer.map(item).join('') : '<div class="empty">No hay ganadas guardadas de días anteriores.</div>'}
    ${ayer.length ? `<button class="btn" id="winGanadasPublicarBtn" style="width:100%; margin:6px 0 12px;">📤 Publicar todas (${ayer.length})</button>` : ''}
    ${deHoy.length ? `<h4 style="margin:10px 0 6px;">Guardadas hoy (salen mañana) · ${deHoy.length}</h4>${deHoy.map(item).join('')}` : ''}
    <div class="modal-actions"><button class="btn secondary" onclick="closeModal(); renderWin();">Cerrar</button></div>
  `);
  document.querySelectorAll('[data-gan-del]').forEach(b=>b.onclick = async ()=>{
    if(!confirm('¿Descartar esta ganada guardada?')) return;
    state.winGanadas = state.winGanadas.filter(x=>x.id !== b.dataset.ganDel);
    await persist('winGanadas', { deletedIds: [b.dataset.ganDel] });
    openWinGanadasAyerModal();
  });
  const pub = document.getElementById('winGanadasPublicarBtn');
  if(pub) pub.onclick = async ()=>{
    if(!confirm(`Voy a publicar ${ayer.length} ganada${ayer.length>1?'s':''} en sus grupos. ¿Las mando?`)) return;
    pub.disabled = true;
    let ok = 0; const fallos = [];
    for(let i=0; i<ayer.length; i++){
      const g = ayer[i];
      pub.textContent = `Mandando ${i+1} de ${ayer.length}…`;
      const grupos = g.grupos.split(',').filter(Boolean);
      let todoOk = grupos.length > 0;
      for(const nombre of grupos){
        const jid = winGroupJid(nombre);
        if(!jid){ fallos.push(`${nombre}: sin conexión directa`); todoOk = false; continue; }
        try{
          const r = await withTimeout(fetch('/api/win-enviar', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ modo:'directo', grupoId: jid, texto: g.caption, imagenUrl: g.imageUrl || '' }) }), 60000);
          const d = await r.json().catch(()=>({}));
          if(!r.ok || !d.ok) throw new Error(d.error || 'falló');
        }catch(e){ fallos.push(`${nombre}: ${e.message}`); todoOk = false; }
      }
      if(todoOk){ g.status = 'publicada'; g.publishedAt = new Date().toISOString(); ok++; }
    }
    await persist('winGanadas');
    if(ok > 0) winNovedad('ganadas', 'Ganadas de ayer publicadas', `${ok} de ${ayer.length} publicadas en sus grupos.`);
    if(fallos.length) winNovedad('alerta', 'Algunas ganadas no se pudieron publicar', fallos.slice(0,4).join(' · '));
    alert(`Listo: ${ok} de ${ayer.length} publicadas.${fallos.length ? '\n\nProblemas:\n' + fallos.slice(0,6).join('\n') + '\n\nLas que fallaron siguen guardadas para reintentar.' : ''}`);
    openWinGanadasAyerModal();
  };
}

// ---------- CTA con el número de teléfono en TODOS los textos ----------
// El número va en WIN_TELEFONO. Win redacta el CTA adaptado a lo que se publica (ver "telefono"
// en api/win-redactar.js) y, por si el texto sale sin él (o lo editas), aquí se agrega uno
// estándar al final. No aplica a los regalitos ni a los mensajes de difusión uno a uno.
const WIN_TELEFONO = '0963852803';
const WIN_CTA_POR_TIPO = {
  nueva_apuesta: n => `📲 ¿Quieres entrar al VIP? Escríbenos al ${n}`,
  ganada: n => `📲 Súmate y gana con nosotros: escríbenos al ${n}`,
  partidos_dia: n => `📲 Pregúntanos por los picks de hoy: ${n}`,
  collage: n => `📲 Recarga y retira con confianza: ${n}`,
  stake_pago: n => `📲 Pide tu stake escribiéndonos al ${n}`,
  contenido: n => `📲 Escríbenos al ${n}`
};
function winAsegurarCTA(texto, kind){
  const tel = String(WIN_TELEFONO || '').trim();
  const t = String(texto || '').trim();
  if(!tel || !t || kind === 'regalito') return t;
  const digitos = tel.replace(/\D/g, '');
  if(digitos && t.replace(/\D/g, '').includes(digitos.slice(-9))) return t; // ya trae el número
  const make = WIN_CTA_POR_TIPO[kind] || WIN_CTA_POR_TIPO.contenido;
  return `${t}\n\n${make(tel)}`;
}

function wireWinCaptionTools(redactCtx){
  if(!redactCtx) return;

async function winRegenerateCaption(redactCtx, ajuste){

// Graba un audio cortito con un stream propio (no toca el micrófono principal de Win/el orbe),
// lo manda a transcribir (mismo /api/win-transcribir que usa el dictado por voz normal) y pasa
// el texto resultante a "onTranscribed". Toca una vez para grabar, otra vez para mandar -- igual
// que "mantén para hablar", pero sin mantener tocado. Reusable: lo usan tanto el micrófono de
// "dictar" (solo llena un campo) como el de "decirle cómo ajustar" (dispara una regeneración).
async function winToggleMicRecording(btn, onTranscribed){
  if(winAjusteRecording){
    if(winAjusteRecorder) try{ winAjusteRecorder.stop(); }catch(e){}
    return;
  }
  let stream;
  try{
    stream = await navigator.mediaDevices.getUserMedia({ audio: WIN_AUDIO_CONSTRAINTS });
  }catch(e){
    alert('No se pudo acceder al micrófono. Dale permiso del navegador, o escríbelo directo en el texto.');
    return;
  }
  winAjusteStream = stream;
  const mimeType = winPTTPickMimeType();
  winAjusteRecorder = mimeType ? new MediaRecorder(stream, { mimeType }) : new MediaRecorder(stream);
  winAjusteChunks = [];
  const textoOriginal = btn ? btn.textContent : '';
  winAjusteRecorder.ondataavailable = (e)=>{ if(e.data && e.data.size) winAjusteChunks.push(e.data); };
  winAjusteRecorder.onstop = async ()=>{
    winAjusteRecording = false;
    try{ winAjusteStream.getTracks().forEach(t=>t.stop()); }catch(e){}
    if(btn){ btn.disabled = true; btn.textContent = 'Escuchando...'; }
    if(!winAjusteChunks.length){
      if(btn){ btn.disabled = false; btn.textContent = textoOriginal; }
      return;
    }
    const blob = new Blob(winAjusteChunks, { type: winAjusteRecorder.mimeType || mimeType || 'audio/mp4' });
    winAjusteChunks = [];
    try{
      const audioBase64 = await new Promise((resolve, reject)=>{
        const reader = new FileReader();
        reader.onload = ()=>resolve(String(reader.result).split(',')[1] || '');
        reader.onerror = reject;
        reader.readAsDataURL(blob);
      });
      const res = await withTimeout(fetch('/api/win-transcribir', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ audioBase64, mimeType: blob.type })
      }), 20000);
      const data = await res.json().catch(()=>({}));
      if(!res.ok || !data.text) throw new Error((data && data.error) || 'No se pudo transcribir.');
      await onTranscribed(data.text.trim());
    }catch(e){
      console.error('Error transcribiendo:', e);
      alert('No te escuché bien. Intenta de nuevo o escríbelo directo en el texto.');
    }finally{
      if(btn){ btn.disabled = false; btn.textContent = textoOriginal; }
    }
  };
  winAjusteRecorder.start();
  winAjusteRecording = true;
  if(btn) btn.textContent = '⏹ Grabando... toca para mandar';
}

function winCaptionAjusteToggleMic(redactCtx){

// Paso final: Win ya redactó el texto solo (sin que el jefe tenga que escribir nada), y aquí se
// lo muestra listo para revisar/editar. Si el grupo ya tiene "jid" (el bot de WhatsApp dedicado
// ya está conectado y metido en ese grupo -- ver /whatsapp-bot/README.md), el botón manda el
// mensaje SOLO, sin tocar WhatsApp. Si todavía no, se ofrece el botón manual de siempre (copiar
// + abrir el grupo). "sendImage" es {base64, mediaType} de la imagen en buena calidad para el
// envío automático (puede ser null si es solo texto) -- separado de "thumb", que es la versión
// chiquita que se guarda en el historial de la bandeja.
// ---------- Registrar lo que mandas como apuesta VIP / gratis / regalito / stake ----------
// Al mandar un texto desde Win, se puede registrar también en las hojas del panel (con la fecha de
// hoy de Ecuador). Eso es lo que el recordatorio de Telegram cuenta para saber qué ya subiste hoy.
// Queda un registro básico (el texto como "pick", cuota 0): se completa después en su sección.
const WIN_REGISTRO_TIPOS = [
  { key:'', label:'No registrar' },
  { key:'vipBets', label:'Apuesta VIP' },
  { key:'freeBets', label:'Apuesta gratis' },
  { key:'liveBets', label:'Apuesta Live' },
  { key:'gifts', label:'Regalito del día' },
  { key:'stakes', label:'Stake del día' }
];
let winPreset = null; // lo que elegiste en el formulario (tipo de apuesta / cuál ganó); el confirm lo preselecciona
function winRegistroDefault(kind, grupos){
  if(kind === 'nueva_apuesta' && winPreset && winPreset.tipo === 'none') return '';
  if(kind === 'nueva_apuesta' && winPreset && winPreset.tipo) return winPreset.tipo;
  if(kind !== 'nueva_apuesta') return '';
  const g = (grupos || []).map(x=>String(x).toLowerCase());
  if(g.some(x=>x.includes('vip'))) return 'vipBets';
  if(g.some(x=>x.includes('gratis'))) return 'freeBets';
  return '';
}
async function winRegistrarEnPanel(key, texto, sendImage){
  if(!key) return false;
  const hoy = new Date(Date.now() - 5*60*60*1000).toISOString().slice(0,10);
  const pick = String(texto || '').replace(/\s+/g,' ').trim().slice(0,200) || 'Registrado desde Win';
  let row;
  if(key === 'vipBets' || key === 'freeBets' || key === 'liveBets') row = { id:uid(), sport:'', event:'', betType:'simple', pick, odds:0, stake:0, date:hoy, result:'pending', lines:'[]' };
  else if(key === 'gifts') row = { id:uid(), sport:'', pick, odds:0, stake:0, recipient:'', date:hoy, result:'pending' };
  else if(key === 'stakes') row = { id:uid(), description:pick, amount:0, date:hoy, result:'pending' };
  else return false;
  // La foto se guarda en Vercel Blob (en su calidad real) y en la hoja solo queda el link.
  try{
    if(sendImage && sendImage.url) row.imageUrl = sendImage.url;
    else if(sendImage && sendImage.base64){
      const up = await withTimeout(fetch('/api/win-imagen', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ base64: sendImage.base64, mediaType: sendImage.mediaType, nombre: key }) }), 30000);
      const d = await up.json().catch(()=>({}));
      if(up.ok && d.url) row.imageUrl = d.url;
    }
  }catch(e){ console.error('No se pudo guardar la foto del registro:', e); }
  state[key].push(row);
  await persist(key);
  return true;
}

// Apuestas pendientes (VIP, gratis y live) a las que se les puede marcar "ganada" desde Win.
function winApuestasPendientes(){
  const todas = [
    ...(state.vipBets||[]).map(b=>({ ...b, _key:'vipBets', _tag:'VIP' })),
    ...(state.freeBets||[]).map(b=>({ ...b, _key:'freeBets', _tag:'Gratis' })),
    ...(state.liveBets||[]).map(b=>({ ...b, _key:'liveBets', _tag:'Live' }))
  ].filter(b=>b.result==='pending');
  return todas.sort((a,b)=>String(b.date).localeCompare(String(a.date))).slice(0,25);
}
// Marca la apuesta como ganada y calcula la ganancia (cobrado - invertido).
async function winMarcarGanada(key, id, invertido, cobrado, sendImage){
  const b = (state[key]||[]).find(x=>x.id===id);
  if(!b) return false;
  b.result = 'won';
  if(invertido > 0) b.stake = invertido;
  if(cobrado > 0){
    b.returned = cobrado;
    if(invertido > 0){ b.ganancia = Math.round((cobrado - invertido)*100)/100; b.odds = Math.round((cobrado/invertido)*100)/100; }
  }
  if(!b.imageUrl && sendImage && sendImage.base64){
    try{
      const up = await withTimeout(fetch('/api/win-imagen', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ base64: sendImage.base64, mediaType: sendImage.mediaType, nombre: key + '-ganada' }) }), 30000);
      const d = await up.json().catch(()=>({}));
      if(up.ok && d.url) b.imageUrl = d.url;
    }catch(e){ console.error(e); }
  }
  await persist(key);
  return true;
}

  };
  const winRegistrarSiToca = async (texto)=>{
    await winGuardarGanadaSiToca(texto);
    if(winRegistrado) return;
    const gan = document.getElementById('f-winGanadaBet');
    if(gan){
      if(!gan.value) return;
      const [k, id] = gan.value.split('|');

    if(winRegistrado){ sel.disabled = true; }

  document.querySelectorAll('[data-win-send-group]').forEach(btn=>{
