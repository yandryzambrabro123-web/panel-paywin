<style>
  @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Inter:wght@400;500;600;700&display=swap');
  :root{
    --bg:#0D1117;
    --surface:#161B22;
    --surface-2:#1C2330;
    --border:#2A3140;
    --text:#E7ECF2;
    --muted:#7C8798;
    --accent:#D4AF6A;
    --accent-dim:#4A3A1F;
    --accent-light:#E8D4B0;
    --loss:#E5484D;
    --loss-dim:#5C2427;
    --pending:#E8B339;
    --display:'Montserrat', sans-serif;
    --body:'Inter', system-ui, sans-serif;
    --mono:'IBM Plex Mono', 'Courier New', monospace;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:var(--body); background:var(--bg); color:var(--text); min-height:100vh;}
  #app{display:flex; min-height:100vh;}
  .brand-title{font-family:var(--display); font-weight:800; text-transform:uppercase; letter-spacing:.5px;}

  /* Sidebar */
  #sidebar{width:230px; background:var(--surface); border-right:1px solid var(--border); padding:24px 0; flex-shrink:0; display:flex; flex-direction:column;}
  .brand{display:flex; align-items:center; gap:10px; padding:0 24px 20px; border-bottom:1px solid var(--border); margin-bottom:16px;}
  .brand img{width:38px; height:38px; border-radius:50%; object-fit:cover; flex-shrink:0;}
  .brand-text{font-family:var(--display); font-size:14px; font-weight:800; text-transform:uppercase; letter-spacing:.4px; line-height:1.25;}
  .nav-item{display:flex; align-items:center; gap:10px; padding:12px 24px; color:var(--muted); cursor:pointer; font-size:13.5px; font-weight:600; border-left:3px solid transparent; transition:all .15s;}
  .nav-item:hover{color:var(--text); background:var(--surface-2);}
  .nav-item.active{color:var(--accent); border-left-color:var(--accent); background:var(--surface-2);}
  .nav-icon{width:18px; text-align:center; font-size:15px;}

  /* Main */
  #main{flex:1; padding:28px 36px; max-width:1300px;}
  .page-title{font-family:var(--display); font-size:26px; text-transform:uppercase; letter-spacing:.5px; margin-bottom:4px; font-weight:800;}
  .page-sub{color:var(--muted); font-size:13px; margin-bottom:24px;}

  /* Scoreboard strip */
  .scoreboard{display:grid; grid-template-columns:repeat(4,1fr); gap:1px; background:var(--border); border:1px solid var(--border); border-radius:8px; overflow:hidden; margin-bottom:28px;}
  .score-cell{background:var(--surface); padding:16px 18px;}
  .score-label{font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.8px; margin-bottom:6px; font-weight:600;}
  .score-value{font-family:var(--mono); font-size:26px; font-weight:600;}
  .score-value.win{color:var(--accent);}
  .score-value.loss{color:var(--loss);}
  .score-sub{font-size:12px; color:var(--muted); margin-top:4px;}
  .score-sub .g{color:var(--accent); font-weight:600;}

  .grid-2{display:grid; grid-template-columns:1.3fr 1fr; gap:20px; margin-bottom:24px;}
  .card{background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:20px;}
  .card-title{font-size:13px; text-transform:uppercase; letter-spacing:.6px; color:var(--muted); margin-bottom:14px; font-weight:700;}

  /* Tables */
  table{width:100%; border-collapse:collapse; font-size:13.5px;}
  th{text-align:left; color:var(--muted); font-weight:700; font-size:11px; text-transform:uppercase; letter-spacing:.5px; padding:8px 10px; border-bottom:1px solid var(--border);}
  td{padding:10px; border-bottom:1px solid var(--border); vertical-align:middle;}
  tr:last-child td{border-bottom:none;}
  .mono{font-family:var(--mono);}
  .badge{display:inline-block; padding:3px 9px; border-radius:20px; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.3px;}
  .badge.active{background:var(--accent-dim); color:var(--accent);}
  .badge.inactive{background:#3A2020; color:#B04E52;}
  .badge.won{background:var(--accent-dim); color:var(--accent);}
  .badge.lost{background:var(--loss-dim); color:#FF8A8E;}
  .badge.pending{background:#4A3B14; color:var(--pending);}

  /* Forms / filters */
  .toolbar{display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:16px; gap:16px; flex-wrap:wrap;}
  .filters{display:flex; gap:10px; align-items:flex-end; flex-wrap:wrap;}
  .filters .field{margin-bottom:0;}
  .filters input{padding:8px 10px; font-size:13px;}
  .btn{background:var(--accent); color:#1A1206; border:none; padding:10px 18px; border-radius:6px; font-weight:700; font-size:13.5px; cursor:pointer; font-family:var(--body);}
  .btn:hover{filter:brightness(1.1);}
  .btn.secondary{background:var(--surface-2); color:var(--text); border:1px solid var(--border);}
  .btn.small{padding:5px 10px; font-size:12px;}
  .btn.danger{background:transparent; color:var(--loss); border:1px solid var(--loss-dim);}

  .modal-overlay{display:none; position:fixed; inset:0; background:rgba(0,0,0,.6); align-items:center; justify-content:center; z-index:50;}
  .modal-overlay.open{display:flex;}
  .modal{background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:24px; width:420px; max-height:85vh; overflow-y:auto;}
  .modal h3{font-family:var(--display); text-transform:uppercase; letter-spacing:.5px; margin-bottom:18px; font-size:18px; font-weight:800;}
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:12px; color:var(--muted); margin-bottom:6px; text-transform:uppercase; letter-spacing:.4px; font-weight:600;}
  .field input, .field select, .field textarea{width:100%; background:var(--bg); border:1px solid var(--border); border-radius:6px; padding:9px 10px; color:var(--text); font-family:var(--body); font-size:14px;}
  .field textarea{resize:vertical; min-height:60px;}
  .modal-actions{display:flex; gap:10px; margin-top:20px;}
  .modal-actions .btn{flex:1;}

  .empty{color:var(--muted); font-size:13px; padding:24px; text-align:center;}
  .loading{color:var(--muted); font-size:13px; padding:24px; text-align:center;}
  .row-actions{display:flex; gap:6px;}
  .list-item{padding:12px 0; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:flex-start;}
  .list-item:last-child{border-bottom:none;}
  .list-item .desc{font-size:14px; margin-bottom:3px;}
  .list-item .meta{font-size:12px; color:var(--muted);}
</style>

<div id="loginScreen" style="min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--bg);">
  <div style="width:340px; background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:32px; text-align:center;">
    <img src="logo-paywin.png" alt="Pay Win" style="width:72px; height:72px; border-radius:50%; object-fit:cover; margin-bottom:14px;">
    <div class="brand-title" style="font-size:18px; margin-bottom:4px;">Panel Administración Pay Win</div>
    <div style="color:var(--muted); font-size:13px; margin-bottom:24px;">Ingresa tus credenciales para continuar</div>
    <div class="field" style="text-align:left;"><label>Usuario</label><input id="loginUser" autocomplete="username"></div>
    <div class="field" style="text-align:left;"><label>Contraseña</label><input id="loginPass" type="password" autocomplete="current-password"></div>
    <div id="loginError" style="display:none; color:var(--loss); font-size:12.5px; margin-bottom:10px;">Usuario o contraseña incorrectos.</div>
    <button class="btn" id="loginBtn" style="width:100%; margin-top:6px;">Entrar</button>
  </div>
</div>

<div id="app" style="display:none;">
  <div id="sidebar">
    <div class="brand">
      <img src="logo-paywin.png" alt="Pay Win">
      <div class="brand-text">Panel<br>Administración<br>Pay Win</div>
    </div>
    <div id="syncStatus" style="display:none; margin:0 24px 16px; font-size:11px; color:var(--loss); border:1px solid var(--loss-dim); border-radius:6px; padding:8px 10px;">⚠ Error de sincronización con Sheets</div>
    <div class="nav-item active" data-view="dashboard"><span class="nav-icon">&#9635;</span> Dashboard</div>
    <div class="nav-item" data-view="vips"><span class="nav-icon">&#128100;</span> Miembros VIP</div>
    <div class="nav-item" data-view="freeBets"><span class="nav-icon">&#127919;</span> Apuestas Gratis</div>
    <div class="nav-item" data-view="vipBets"><span class="nav-icon">&#128142;</span> Apuestas VIP</div>
    <div class="nav-item" data-view="stakes"><span class="nav-icon">&#128176;</span> Stakes</div>
    <div class="nav-item" data-view="gifts"><span class="nav-icon">&#127873;</span> Regalitos</div>
    <div class="nav-item" id="logoutBtn" style="margin-top:auto; border-top:1px solid var(--border); padding-top:16px;"><span class="nav-icon">&#128274;</span> Cerrar sesión</div>
  </div>
  <div id="main"></div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modalBody"></div>
</div>

<script>
const SHEETS_API_URL = 'https://script.google.com/macros/s/AKfycbx63BsywQP0fTOhbzMCcoJ5jDjp1lgsaGjLMkGI47SVAfemVMuMnggWd_k-ubqzmBEMlA/exec';
const SHEET_NAMES = { vips: 'VIPs', freeBets: 'ApuestasGratis', vipBets: 'ApuestasVIP', stakes: 'Stakes', gifts: 'Regalitos' };

let state = {
  vips: [], freeBets: [], vipBets: [], stakes: [], gifts: [],
  view: 'dashboard', loaded: false, syncError: false,
  filters: { vips:{from:'',to:''}, freeBets:{from:'',to:''}, vipBets:{from:'',to:''}, stakes:{from:'',to:''}, gifts:{from:'',to:''} }
};

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function fmtMoney(n){ return '$' + (Number(n)||0).toFixed(2); }
function fmtDate(d){ if(!d) return '-'; const dt = new Date(d); return dt.toLocaleDateString('es-EC',{day:'2-digit',month:'short',year:'numeric'}); }
function resultLabel(r){ return r==='won'?'Ganada':r==='lost'?'Perdida':'Pendiente'; }

function coerceRow(key, row){
  if(key === 'vips'){
    return { id:String(row.id||''), name:row.name||'', contact:row.contact||'', plan:row.plan||'', joinDate:row.joinDate||'', notes:row.notes||'', status:row.status||'active' };
  }
  if(key === 'freeBets' || key === 'vipBets'){
    return { id:String(row.id||''), sport:row.sport||'', pick:row.pick||'', odds:Number(row.odds)||0, stake:Number(row.stake)||0, date:row.date||'', result:row.result||'pending' };
  }
  if(key === 'stakes'){
    return { id:String(row.id||''), description:row.description||'', amount:Number(row.amount)||0, date:row.date||'', result:row.result||'pending' };
  }
  return { id:String(row.id||''), description:row.description||'', recipient:row.recipient||'', date:row.date||'' };
}

async function loadAll(){
  const main = document.getElementById('main');
  main.innerHTML = '<div class="loading">Conectando con tu hoja de Google Sheets...</div>';
  for(const key of Object.keys(SHEET_NAMES)){
    try{
      const res = await fetch(`${SHEETS_API_URL}?sheet=${SHEET_NAMES[key]}`);
      const json = await res.json();
      state[key] = (json.data || []).map(row => coerceRow(key, row));
    }catch(e){ console.error('Error cargando', key, e); state[key] = []; state.syncError = true; }
  }
  state.loaded = true;
  render();
}

async function persist(key){
  try{
    await fetch(SHEETS_API_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ sheet: SHEET_NAMES[key], data: state[key] })
    });
    state.syncError = false;
  }catch(e){
    console.error('Error guardando', key, e);
    state.syncError = true;
  }
}

function exportCSV(key){
  const rows = state[key];
  if(!rows.length){ alert('No hay datos para exportar todavía.'); return; }
  const headers = Object.keys(rows[0]);
  const csvLines = [headers.join(',')].concat(
    rows.map(r => headers.map(h => `"${String(r[h]??'').replace(/"/g,'""')}"`).join(','))
  );
  const blob = new Blob([csvLines.join('\n')], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${SHEET_NAMES[key]}_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  URL.revokeObjectURL(url);
}

function setView(v){
  state.view = v;
  document.querySelectorAll('.nav-item[data-view]').forEach(el=>el.classList.toggle('active', el.dataset.view===v));
  render();
}
document.querySelectorAll('.nav-item[data-view]').forEach(el=>{ el.addEventListener('click', ()=>setView(el.dataset.view)); });

function closeModal(){ document.getElementById('modalOverlay').classList.remove('open'); }
function openModal(html){
  document.getElementById('modalBody').innerHTML = html;
  document.getElementById('modalOverlay').classList.add('open');
}
document.getElementById('modalOverlay').addEventListener('click', (e)=>{ if(e.target.id === 'modalOverlay') closeModal(); });

/* ---------- DATE FILTER HELPERS ---------- */
function filterByDate(rows, dateField, filterKey){
  const f = state.filters[filterKey];
  if(!f || (!f.from && !f.to)) return rows;
  return rows.filter(r=>{
    const d = r[dateField];
    if(!d) return false;
    if(f.from && d < f.from) return false;
    if(f.to && d > f.to) return false;
    return true;
  });
}
function dateFilterHTML(filterKey){
  const f = state.filters[filterKey];
  return `
    <div class="filters">
      <div class="field"><label>Desde</label><input type="date" id="filterFrom" value="${f.from||''}"></div>
      <div class="field"><label>Hasta</label><input type="date" id="filterTo" value="${f.to||''}"></div>
      <button class="btn secondary small" id="clearFilterBtn" style="height:37px;">Limpiar</button>
    </div>`;
}
function wireDateFilter(filterKey, rerenderFn){
  document.getElementById('filterFrom').onchange = (e)=>{ state.filters[filterKey].from = e.target.value; rerenderFn(); };
  document.getElementById('filterTo').onchange = (e)=>{ state.filters[filterKey].to = e.target.value; rerenderFn(); };
  document.getElementById('clearFilterBtn').onclick = ()=>{ state.filters[filterKey] = {from:'',to:''}; rerenderFn(); };
}

/* ---------- WEEK HELPERS ---------- */
function getWeekRange(){
  const now = new Date();
  const day = now.getDay(); // 0=Sun
  const diffToMonday = (day === 0 ? -6 : 1 - day);
  const monday = new Date(now); monday.setDate(now.getDate() + diffToMonday); monday.setHours(0,0,0,0);
  const sunday = new Date(monday); sunday.setDate(monday.getDate() + 6); sunday.setHours(23,59,59,999);
  return { start: monday, end: sunday };
}
function inCurrentWeek(dateStr){
  if(!dateStr) return false;
  const { start, end } = getWeekRange();
  const d = new Date(dateStr);
  return d >= start && d <= end;
}

/* ---------- DASHBOARD ---------- */
function renderDashboard(){
  const activeVips = state.vips.filter(v=>v.status==='active').length;

  const freeBetsWeek = state.freeBets.filter(b=>inCurrentWeek(b.date));
  const freeBetsWon = freeBetsWeek.filter(b=>b.result==='won').length;

  const stakesWeek = state.stakes.filter(s=>inCurrentWeek(s.date));
  const stakesWon = stakesWeek.filter(s=>s.result==='won').length;

  const giftsWeek = state.gifts.filter(g=>inCurrentWeek(g.date));

  const vipBetsRecent = [...state.vipBets].sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0,6);
  const recentGifts = [...state.gifts].sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0,4);

  document.getElementById('main').innerHTML = `
    <div class="page-title">Dashboard</div>
    <div class="page-sub">Resumen semanal de tu comunidad</div>

    <div class="scoreboard">
      <div class="score-cell">
        <div class="score-label">VIPs Activos</div>
        <div class="score-value win">${activeVips}</div>
      </div>
      <div class="score-cell">
        <div class="score-label">Apuestas Gratis (semana)</div>
        <div class="score-value">${freeBetsWeek.length}</div>
        <div class="score-sub">enviadas · <span class="g">${freeBetsWon}</span> ganadas</div>
      </div>
      <div class="score-cell">
        <div class="score-label">Stakes (semana)</div>
        <div class="score-value">${stakesWeek.length}</div>
        <div class="score-sub">enviados · <span class="g">${stakesWon}</span> ganados</div>
      </div>
      <div class="score-cell">
        <div class="score-label">Regalitos (semana)</div>
        <div class="score-value win">${giftsWeek.length}</div>
        <div class="score-sub">enviados esta semana</div>
      </div>
    </div>

    <div class="grid-2">
      <div class="card">
        <div class="card-title">Últimas apuestas VIP</div>
        ${vipBetsRecent.length ? `<table><thead><tr><th>Pick</th><th>Cuota</th><th>Stake</th><th>Resultado</th><th>Fecha</th></tr></thead><tbody>
          ${vipBetsRecent.map(b=>`<tr>
            <td>${b.pick}</td>
            <td class="mono">${Number(b.odds).toFixed(2)}</td>
            <td class="mono">${fmtMoney(b.stake)}</td>
            <td><span class="badge ${b.result}">${resultLabel(b.result)}</span></td>
            <td class="mono">${fmtDate(b.date)}</td>
          </tr>`).join('')}
        </tbody></table>` : '<div class="empty">Aún no has registrado apuestas VIP.</div>'}
      </div>
      <div class="card">
        <div class="card-title">Últimos regalitos</div>
        ${recentGifts.length ? recentGifts.map(g=>`
          <div class="list-item">
            <div>
              <div class="desc">${g.description}</div>
              <div class="meta">${g.recipient || 'Grupo general'} · ${fmtDate(g.date)}</div>
            </div>
          </div>`).join('') : '<div class="empty">Aún no has registrado regalitos.</div>'}
      </div>
    </div>
  `;
}

function addOneMonth(dateStr){
  if(!dateStr) return '';
  const d = new Date(dateStr);
  d.setMonth(d.getMonth() + 1);
  return d.toISOString().slice(0,10);
}
function membershipStatus(joinDate){
  const exp = addOneMonth(joinDate);
  if(!exp) return { label:'-', cls:'' };
  const today = new Date().toISOString().slice(0,10);
  const daysLeft = Math.ceil((new Date(exp) - new Date(today)) / 86400000);
  if(daysLeft < 0) return { label:'Vencida', cls:'inactive', exp };
  if(daysLeft <= 5) return { label:`Vence en ${daysLeft}d`, cls:'pending', exp };
  return { label:'Vigente', cls:'active', exp };
}

/* ---------- VIPS (Miembros VIP) ---------- */
function renderVips(){
  const rows = filterByDate(state.vips, 'joinDate', 'vips');
  document.getElementById('main').innerHTML = `
    <div class="toolbar">
      <div>
        <div class="page-title">Miembros VIP</div>
        <div class="page-sub">${rows.length} mostrados · ${state.vips.filter(v=>v.status==='active').length} activos en total</div>
      </div>
      ${dateFilterHTML('vips')}
      <div style="display:flex; gap:10px;">
        <button class="btn secondary" id="exportVipBtn">Exportar CSV</button>
        <button class="btn" id="addVipBtn">+ Nuevo VIP</button>
      </div>
    </div>
    <div class="card">
      ${rows.length ? `<table><thead><tr><th>Nombre</th><th>Contacto</th><th>Plan</th><th>Ingreso</th><th>Vence</th><th>Estado</th><th></th></tr></thead><tbody>
        ${rows.map(v=>{ const m = membershipStatus(v.joinDate); return `<tr>
          <td>${v.name}</td>
          <td class="mono">${v.contact||'-'}</td>
          <td>${v.plan||'-'}</td>
          <td class="mono">${fmtDate(v.joinDate)}</td>
          <td class="mono">${m.exp ? fmtDate(m.exp) : '-'} ${m.cls ? `<span class="badge ${m.cls}" style="margin-left:6px;">${m.label}</span>` : ''}</td>
          <td><span class="badge ${v.status}">${v.status==='active'?'Activo':'Inactivo'}</span></td>
          <td class="row-actions">
            <button class="btn secondary small" data-toggle-vip="${v.id}">${v.status==='active'?'Desactivar':'Activar'}</button>
            <button class="btn danger small" data-del-vip="${v.id}">Eliminar</button>
          </td>
        </tr>`;}).join('')}
      </tbody></table>` : '<div class="empty">No hay VIPs para mostrar con este filtro.</div>'}
    </div>
  `;
  wireDateFilter('vips', renderVips);
  document.getElementById('addVipBtn').onclick = openVipForm;
  document.getElementById('exportVipBtn').onclick = () => exportCSV('vips');
  document.querySelectorAll('[data-toggle-vip]').forEach(b=>b.onclick=()=>toggleVip(b.dataset.toggleVip));
  document.querySelectorAll('[data-del-vip]').forEach(b=>b.onclick=()=>delItem('vips', b.dataset.delVip, renderVips));
}

function openVipForm(){
  openModal(`
    <h3>Nuevo VIP</h3>
    <div class="field"><label>Nombre</label><input id="f-name" placeholder="Nombre del cliente"></div>
    <div class="field"><label>Contacto (WhatsApp)</label><input id="f-contact" placeholder="0999999999"></div>
    <div class="field"><label>Plan</label><input id="f-plan" placeholder="Mensual, trimestral..."></div>
    <div class="field"><label>Fecha de ingreso</label><input id="f-join" type="date"></div>
    <div class="field"><label>Notas</label><textarea id="f-notes" placeholder="Notas opcionales"></textarea></div>
    <div class="modal-actions">
      <button class="btn secondary" onclick="closeModal()">Cancelar</button>
      <button class="btn" id="saveVip">Guardar</button>
    </div>
  `);
  document.getElementById('saveVip').onclick = async ()=>{
    const name = document.getElementById('f-name').value.trim();
    if(!name){ alert('Ponle un nombre al VIP.'); return; }
    state.vips.push({
      id: uid(), name,
      contact: document.getElementById('f-contact').value.trim(),
      plan: document.getElementById('f-plan').value.trim(),
      joinDate: document.getElementById('f-join').value || new Date().toISOString().slice(0,10),
      notes: document.getElementById('f-notes').value.trim(),
      status: 'active'
    });
    closeModal();
    render();
    await persist('vips');
  };
}
async function toggleVip(id){
  const v = state.vips.find(x=>x.id===id);
  if(v){ v.status = v.status==='active' ? 'inactive' : 'active'; render(); await persist('vips'); }
}
async function delItem(key, id, rerenderFn){
  if(!confirm('¿Eliminar este registro?')) return;
  state[key] = state[key].filter(x=>x.id!==id);
  rerenderFn ? rerenderFn() : render();
  await persist(key);
}

/* ---------- PICKS (Apuestas Gratis / Apuestas VIP) — generic ---------- */
function renderPicks(key, title){
  const rows = filterByDate(state[key], 'date', key);
  const sorted = [...rows].sort((a,b)=>new Date(b.date)-new Date(a.date));
  document.getElementById('main').innerHTML = `
    <div class="toolbar">
      <div>
        <div class="page-title">${title}</div>
        <div class="page-sub">${rows.length} mostradas</div>
      </div>
      ${dateFilterHTML(key)}
      <div style="display:flex; gap:10px;">
        <button class="btn secondary" id="exportBtn">Exportar CSV</button>
        <button class="btn" id="addBtn">+ Nueva apuesta</button>
      </div>
    </div>
    <div class="card">
      ${sorted.length ? `<table><thead><tr><th>Deporte</th><th>Pick</th><th>Cuota</th><th>Stake</th><th>Resultado</th><th>Fecha</th><th></th></tr></thead><tbody>
        ${sorted.map(b=>`<tr>
          <td>${b.sport||'-'}</td>
          <td>${b.pick}</td>
          <td class="mono">${Number(b.odds).toFixed(2)}</td>
          <td class="mono">${fmtMoney(b.stake)}</td>
          <td>
            <select data-result="${b.id}" class="badge ${b.result}" style="background:transparent;border:1px solid var(--border);color:inherit;">
              <option value="pending" ${b.result==='pending'?'selected':''}>Pendiente</option>
              <option value="won" ${b.result==='won'?'selected':''}>Ganada</option>
              <option value="lost" ${b.result==='lost'?'selected':''}>Perdida</option>
            </select>
          </td>
          <td class="mono">${fmtDate(b.date)}</td>
          <td><button class="btn danger small" data-del="${b.id}">Eliminar</button></td>
        </tr>`).join('')}
      </tbody></table>` : '<div class="empty">No hay apuestas para mostrar con este filtro.</div>'}
    </div>
  `;
  const rerender = ()=>renderPicks(key, title);
  wireDateFilter(key, rerender);
  document.getElementById('addBtn').onclick = ()=>openPickForm(key, rerender);
  document.getElementById('exportBtn').onclick = () => exportCSV(key);
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>delItem(key, b.dataset.del, rerender));
  document.querySelectorAll('[data-result]').forEach(sel=>{
    sel.onchange = async ()=>{
      const item = state[key].find(x=>x.id===sel.dataset.result);
      if(item){ item.result = sel.value; await persist(key); rerender(); }
    };
  });
}
function openPickForm(key, rerender){
  openModal(`
    <h3>Nueva apuesta</h3>
    <div class="field"><label>Deporte</label><input id="f-sport" placeholder="Fútbol, tenis de mesa, UFC..."></div>
    <div class="field"><label>Pick</label><input id="f-pick" placeholder="Ej: Real Madrid gana"></div>
    <div class="field"><label>Cuota</label><input id="f-odds" type="number" step="0.01" placeholder="1.85"></div>
    <div class="field"><label>Stake ($)</label><input id="f-stake" type="number" step="0.01" placeholder="10"></div>
    <div class="field"><label>Fecha</label><input id="f-bdate" type="date"></div>
    <div class="field"><label>Resultado</label>
      <select id="f-result"><option value="pending">Pendiente</option><option value="won">Ganada</option><option value="lost">Perdida</option></select>
    </div>
    <div class="modal-actions">
      <button class="btn secondary" onclick="closeModal()">Cancelar</button>
      <button class="btn" id="savePick">Guardar</button>
    </div>
  `);
  document.getElementById('savePick').onclick = async ()=>{
    const pick = document.getElementById('f-pick').value.trim();
    const odds = document.getElementById('f-odds').value;
    if(!pick || !odds){ alert('Completa al menos el pick y la cuota.'); return; }
    state[key].push({
      id: uid(),
      sport: document.getElementById('f-sport').value.trim(),
      pick, odds: Number(odds),
      stake: Number(document.getElementById('f-stake').value)||0,
      date: document.getElementById('f-bdate').value || new Date().toISOString().slice(0,10),
      result: document.getElementById('f-result').value
    });
    closeModal();
    rerender();
    await persist(key);
  };
}

  const sorted = [...rows].sort((a,b)=>new Date(b.date)-new Date(a.date));

function openGiftForm(){
  openModal(`
    <h3>Nuevo regalito</h3>
    <div class="field"><label>Descripción</label><input id="f-gdesc" placeholder="Ej: Pick gratis de UFC"></div>
    <div class="field"><label>Para quién</label><input id="f-grecipient" placeholder="Grupo general o nombre del VIP"></div>
    <div class="field"><label>Fecha</label><input id="f-gdate" type="date"></div>
    <div class="modal-actions">
      <button class="btn secondary" onclick="closeModal()">Cancelar</button>
      <button class="btn" id="saveGift">Guardar</button>
    </div>
  `);
  document.getElementById('saveGift').onclick = async ()=>{
    const desc = document.getElementById('f-gdesc').value.trim();
    if(!desc){ alert('Describe el regalito.'); return; }
    state.gifts.push({
      id: uid(),
      description: desc,
      recipient: document.getElementById('f-grecipient').value.trim(),
      date: document.getElementById('f-gdate').value || new Date().toISOString().slice(0,10)
    });
    closeModal();
    renderGifts();
    await persist('gifts');
  };
}

/* ---------- ROUTER ---------- */
function render(){
  if(!state.loaded) return;
  document.getElementById('syncStatus').style.display = state.syncError ? 'block' : 'none';
  if(state.view==='dashboard') renderDashboard();
  else if(state.view==='vips') renderVips();
  else if(state.view==='freeBets') renderPicks('freeBets', 'Apuestas Gratis');
  else if(state.view==='vipBets') renderPicks('vipBets', 'Apuestas VIP');
  else if(state.view==='stakes') renderStakes();
  else if(state.view==='gifts') renderGifts();
}

/* ---------- AUTH ---------- */
async function attemptLogin(){
  const user = document.getElementById('loginUser').value.trim();
  const pass = document.getElementById('loginPass').value;
  const errEl = document.getElementById('loginError');
  const btn = document.getElementById('loginBtn');
  errEl.style.display = 'none';
  btn.textContent = 'Verificando...';
  btn.disabled = true;
  try{
    const res = await fetch(`${SHEETS_API_URL}?action=login&user=${encodeURIComponent(user)}&password=${encodeURIComponent(pass)}`);
    const json = await res.json();
    if(json.ok){
      localStorage.setItem('panelVipAuth', 'true');
      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('app').style.display = 'flex';
      loadAll();
    }else{
      errEl.style.display = 'block';
    }
  }catch(e){
    console.error('Error de login', e);
    errEl.textContent = 'No se pudo conectar. Intenta de nuevo.';
    errEl.style.display = 'block';
  }
  btn.textContent = 'Entrar';
  btn.disabled = false;
}
document.getElementById('loginBtn').addEventListener('click', attemptLogin);
document.getElementById('loginPass').addEventListener('keydown', (e)=>{ if(e.key==='Enter') attemptLogin(); });
document.getElementById('logoutBtn').addEventListener('click', ()=>{
  localStorage.removeItem('panelVipAuth');
  location.reload();
});

if(localStorage.getItem('panelVipAuth') === 'true'){
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  loadAll();
}
</script>
