      pushToOutbox(kind, grupo, finalCaption, thumb, true, 'enviado').then(()=>persist('winOutbox'));

      btn.disabled = true;
      btn.classList.add('secondary');

  document.querySelectorAll('[data-win-auto-group]').forEach(btn=>{
    const grupo = decodeURIComponent(btn.dataset.winAutoGroup);

      const box = document.getElementById('f-winCaptionConfirm');

    <div class="field"><label>¿Qué toca recordar?</label><textarea id="f-winRemText" placeholder="Ej: entregar los flyers">${prefillText||''}</textarea></div>
    <div class="field"><label>Fecha</label><input id="f-winRemDate" type="date" value="${prefillDate || ''}"></div>
    <div class="field"><label>Hora (opcional)</label><input id="f-winRemTime" type="time" value="${prefillTime || ''}"></div>
    <div class="modal-actions">
      <button class="btn secondary" onclick="closeModal()">Cancelar</button>
      <button class="btn" id="saveWinReminder">Guardar</button>
    </div>
  `);
  document.getElementById('saveWinReminder').onclick = async ()=>{
    const text = document.getElementById('f-winRemText').value.trim();
    if(!text){ alert('Escribe qué hay que recordar.'); return; }
    state.winReminders.push({
      id: uid(), text,
      dueDate: document.getElementById('f-winRemDate').value || '',
      dueTime: document.getElementById('f-winRemTime').value || '',
      done: false, createdAt: new Date().toISOString(),
      tipo: (document.getElementById('f-winRemTipo') || {}).value === 'cita' ? 'cita' : 'recordatorio'
    });
    closeModal();
    renderWin();
    updateNavBadges();
    await persist('winReminders');
  };
}

function openWinGiftFlow(){
  const tagged = [];
  VIP_GROUPS.forEach(({key})=>{
    (state[key]||[]).filter(v=>v.giftPending).forEach(v=>tagged.push({ key, id:v.id, name:v.name, contact:v.contact }));
  });
  if(!tagged.length){
    openModal(`<h3>Regalito del día</h3><div style="font-size:13px; color:var(--muted);">No hay nadie etiquetado con "Regalito pendiente" todavía. Márcalo desde la ficha del cliente en Miembros VIP cuando haga la recarga.</div><div class="modal-actions"><button class="btn secondary" onclick="closeModal()">Cerrar</button></div>`);
    return;
  }
  openModal(`
    <h3>Regalito del día</h3>
    <div style="font-size:12.5px; color:var(--muted); margin-bottom:12px;">Se va a mandar a estos ${tagged.length} cliente(s), y se les quita la etiqueta:</div>
    <div style="max-height:120px; overflow-y:auto; margin-bottom:14px; font-size:13px;">${tagged.map(t=>`<div>• ${t.name}${t.contact ? ' ('+t.contact+')' : ''}</div>`).join('')}</div>
    <div id="winDropzone" style="border:2px dashed var(--border); border-radius:10px; padding:26px 16px; text-align:center; cursor:pointer; margin-bottom:14px;">
      <div style="font-size:26px; margin-bottom:6px;">📎</div>
      <div style="font-size:13px; color:var(--muted);">Arrastra, haz clic o pega la imagen del regalito</div>
      <div id="winDropPreview"></div>
    </div>
    <input id="winFileInput" type="file" accept="image/*" style="display:none;">
    <div class="field"><label>Pick / descripción (opcional)</label><input id="f-winGiftNote" placeholder="Ej: Real Madrid gana, cuota 1.60"></div>
    <div class="modal-actions">
      <button class="btn secondary" onclick="closeModal()">Cancelar</button>
      <button class="btn" id="winGenerateBtn">Generar y mandar a la bandeja</button>
    </div>
  `);
  wireWinDropzone();
  document.getElementById('winGenerateBtn').onclick = ()=>submitWinGift(tagged);
}

async function submitWinGift(tagged){
  const nota = document.getElementById('f-winGiftNote').value.trim();
  if(!winPendingFile){ alert('Sube la imagen del regalito primero.'); return; }
  openModal(`<h3>Redactando...</h3><div style="text-align:center; padding:30px 0; color:var(--muted); font-size:13.5px;">Esto toma unos segundos.</div>`);
  try{
    // Igual que un testimonio: se intenta tapar todo menos el monto (por si la imagen trae
    // algún dato de transferencia/recarga). Pero un regalito normalmente es solo la captura del
    // pick/cuota de la apuesta de regalo -- sin ningún monto que detectar -- así que si no se
    // encuentra ninguno, se manda la imagen tal cual (no hay nada sensible que tapar ahí).
    let base64, mediaType, previewUrl, thumb;
    try{
      const comp = await fileToCompressedImage(winPendingFile);
      const lecturaRes = await withTimeout(fetch('/api/leer-testimonio', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ imageBase64: comp.base64, mediaType: comp.mediaType })
      }), 20000);
      const lectura = await lecturaRes.json().catch(()=>({}));
      if(lecturaRes.ok && lectura.montos && lectura.montos.length){
        const outCanvas = await buildRedactedImage(winPendingFile, lectura.montos);
        const compressed = canvasToCompressed(outCanvas);
        base64 = compressed.base64; mediaType = compressed.mediaType; previewUrl = compressed.previewUrl;
        thumb = canvasToThumbnail(outCanvas);
      } else {
        base64 = comp.base64; mediaType = comp.mediaType; previewUrl = comp.previewUrl;
        thumb = await fileToThumbnail(winPendingFile).catch(()=> '');
      }
    }catch(e){
      console.error('No se pudo revisar si el regalito tenía datos para tapar, se manda la imagen tal cual:', e);
      const comp = await fileToCompressedImage(winPendingFile);
      base64 = comp.base64; mediaType = comp.mediaType; previewUrl = comp.previewUrl;
      thumb = await fileToThumbnail(winPendingFile).catch(()=> '');
    }
    const res = await fetch('/api/win-redactar', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ kind: 'regalito', destino: 'Regalito del día', code: nota, imageBase64: base64, mediaType })
    });
    const result = await res.json();
    const caption = (result && result.caption) || nota || '🎁 ¡Tu regalito del día!';
    for(const t of tagged){
      await pushToOutbox('regalito', `${t.name}${t.contact ? ' ('+t.contact+')' : ''}`, caption, thumb || previewUrl, /*skipPersist*/ true);
      const v = state[t.key].find(x=>x.id===t.id);
      if(v) v.giftPending = false;
    }
    await persist('winOutbox');
    const touchedKeys = [...new Set(tagged.map(t=>t.key))];
    for(const k of touchedKeys) await persist(k);
    closeModal();
    renderWin();
  }catch(e){
    console.error(e);
    alert('No se pudo generar el texto. Intenta de nuevo.');
    closeModal();
    renderWin();
  }
}

async function pushToOutbox(kind, destino, caption, image, skipPersist, status){
  state.winOutbox.push({ id: uid(), kind, destino, caption, image: image || '', status: status || 'pendiente', createdAt: new Date().toISOString() });
  if(!skipPersist) await persist('winOutbox');
}

// ---------- Bandeja de novedades (solo situaciones, no cada envío) ----------
const esc = (t)=>String(t == null ? '' : t).replace(/[&<>"]/g, c=>({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
const NOV_ICONOS = { protocolo:'sol', ganadas:'trofeo', vencidos:'campana', alerta:'alerta', info:'info' };
async function winNovedad(tipo, titulo, detalle){
  state.novedades.unshift({ id: uid(), tipo, titulo, detalle: detalle || '', createdAt: new Date().toISOString(), leido: false });
  updateNavBadges();
  if(state.view === 'inbox') render();
  await persist('novedades');
}
function novTiempo(iso){
  const d = new Date(iso); if(isNaN(d)) return '';
  const hoy = new Date(); const mismo = d.toDateString() === hoy.toDateString();
  const hora = d.toLocaleTimeString('es-EC', { hour:'2-digit', minute:'2-digit' });
  return mismo ? 'Hoy ' + hora : d.toLocaleDateString('es-EC', { day:'numeric', month:'short' }) + ' ' + hora;
}
function renderInbox(){
  const filtro = state.inboxFilter || 'unread';
  const todas = [...state.novedades].sort((a,b)=>String(b.createdAt).localeCompare(String(a.createdAt)));
  const sinLeer = todas.filter(n=>!n.leido);
  const filas = filtro === 'unread' ? sinLeer : todas;
  const pend = (state.winOutbox||[]).filter(o=>o.status==='pendiente').length;
  document.getElementById('main').innerHTML = `
    <div class="toolbar">
      <div>
        <div class="page-title">Bandeja</div>
        <div class="page-sub">Novedades de Win y del sistema · ${sinLeer.length ? sinLeer.length + ' sin leer' : 'todo al día'}</div>
      </div>
      <div style="display:flex; gap:10px;">
        <button class="btn secondary" id="novFiltroBtn">${filtro === 'unread' ? 'Ver todas' : 'Ver solo sin leer'}</button>
        ${sinLeer.length ? '<button class="btn" id="novLeerTodoBtn">Marcar todo como leído</button>' : ''}
      </div>
    </div>
    ${pend ? `<div class="alert-banner" style="justify-content:space-between;"><span><strong>${pend}</strong> mensaje${pend>1?'s':''} por mandar a mano (regalitos).</span><button class="btn secondary small" id="novPendBtn">Abrir</button></div>` : ''}
    <div class="nov-list">
      ${filas.length ? filas.map(n=>`
        <div class="nov-item ${n.leido ? '' : 'unread'}" data-nov="${esc(n.id)}" title="${n.leido ? 'Marcar como no leída' : 'Marcar como leída'}">
          <div class="nov-ico nov-${esc(n.tipo)}">${winIcon(NOV_ICONOS[n.tipo] || 'info')}</div>
          <div class="nov-body">
            <div class="nov-title">${esc(n.titulo)}</div>
            ${n.detalle ? `<div class="nov-detail">${esc(n.detalle)}</div>` : ''}
          </div>
          <div class="nov-time">${esc(novTiempo(n.createdAt))}</div>
        </div>`).join('') : `<div class="empty">${filtro === 'unread' ? 'No hay novedades sin leer. Aquí te avisa Win cuando pasa algo: el protocolo de la mañana, las ganadas publicadas, miembros por renovar.' : 'Todavía no hay novedades.'}</div>`}
    </div>
  `;
  document.getElementById('novFiltroBtn').onclick = ()=>{ state.inboxFilter = filtro === 'unread' ? 'all' : 'unread'; renderInbox(); };
  const todo = document.getElementById('novLeerTodoBtn');
  if(todo) todo.onclick = async ()=>{ state.novedades.forEach(n=>{ n.leido = true; }); renderInbox(); updateNavBadges(); await persist('novedades'); };
  const pb = document.getElementById('novPendBtn'); if(pb) pb.onclick = openWinOutboxModal;
  document.querySelectorAll('[data-nov]').forEach(el=>el.onclick = async ()=>{
    const n = state.novedades.find(x=>x.id === el.dataset.nov); if(!n) return;
    n.leido = !n.leido; renderInbox(); updateNavBadges(); await persist('novedades');
  });
}

// ---------- Agenda: citas y recordatorios ----------
function renderReminders(){
  const hoy = new Date(Date.now() - 5*60*60*1000).toISOString().slice(0,10);
  const orden = (a,b)=>(a.dueDate||'9999').localeCompare(b.dueDate||'9999') || (a.dueTime||'99:99').localeCompare(b.dueTime||'99:99');
  const pend = state.winReminders.filter(r=>!r.done).sort(orden);
  const grupos = [
    { t:'Atrasados', list: pend.filter(r=>r.dueDate && r.dueDate < hoy), warn:true },
    { t:'Hoy', list: pend.filter(r=>r.dueDate === hoy) },
    { t:'Próximos', list: pend.filter(r=>r.dueDate && r.dueDate > hoy) },
    { t:'Sin fecha', list: pend.filter(r=>!r.dueDate) }
  ].filter(g=>g.list.length);
  const hechos = state.winReminders.filter(r=>r.done).sort((a,b)=>String(b.createdAt).localeCompare(String(a.createdAt))).slice(0,8);
  const fila = (r, done)=>`
    <div class="rem-row ${done ? 'done' : ''}">
      <input type="checkbox" ${done ? 'checked disabled' : `data-done-reminder="${esc(r.id)}"`}>
      <div class="rem-info">
        <div class="rem-text">${esc(r.text)}</div>
        <div class="rem-meta">${r.dueDate ? esc(fmtDate(r.dueDate)) + (r.dueTime ? ' · ' + esc(r.dueTime) : '') : 'Sin fecha'}</div>
      </div>
      <span class="badge ${r.tipo === 'cita' ? 'combo' : 'simple'}">${r.tipo === 'cita' ? 'Cita' : 'Recordatorio'}</span>
      <button class="btn danger small" data-del-reminder="${esc(r.id)}">Eliminar</button>
    </div>`;
  document.getElementById('main').innerHTML = `
    <div class="toolbar">
      <div>
        <div class="page-title">Agenda</div>
        <div class="page-sub">Citas y recordatorios · ${pend.length} pendiente${pend.length === 1 ? '' : 's'}</div>
      </div>
      <button class="btn" id="addReminderBtn">+ Nuevo</button>
    </div>
    ${grupos.length ? grupos.map(g=>`
      <div class="card" style="margin-bottom:16px;">
        <div class="card-title" ${g.warn ? 'style="color:#FF8A8E;"' : ''}>${g.t} (${g.list.length})</div>
        ${g.list.map(r=>fila(r,false)).join('')}
      </div>`).join('') : '<div class="card"><div class="empty">No tienes nada pendiente. Usa "+ Nuevo" o dile a Win: "recuérdame mañana a las 3 entregar los flyers".</div></div>'}
    ${hechos.length ? `<div class="card" style="opacity:.7;"><div class="card-title">Hechos recientemente</div>${hechos.map(r=>fila(r,true)).join('')}</div>` : ''}
  `;
  document.getElementById('addReminderBtn').onclick = ()=>openWinReminderForm('');
  document.querySelectorAll('[data-done-reminder]').forEach(cb=>cb.onchange=async ()=>{ await completeReminder(cb.dataset.doneReminder); updateNavBadges(); });
  document.querySelectorAll('[data-del-reminder]').forEach(b=>b.onclick=async ()=>{ await delItem('winReminders', b.dataset.delReminder, ()=>render()); updateNavBadges(); });
}

// ---------- Fábrica de apuestas (espacio creado; se configura después) ----------
function renderFactory(){
  const ganadas = winGanadasPendientes().length;
  document.getElementById('main').innerHTML = `
    <div class="toolbar">
      <div>
        <div class="page-title">Fábrica de apuestas</div>
        <div class="page-sub">Aquí se va a armar toda la producción de apuestas</div>
      </div>
    </div>
    <div class="grid-2">
      <div class="card">
        <div class="card-title">Espacio listo</div>
        <div class="empty">Esta sección está vacía a propósito. Dime cómo la quieres configurar y la armamos.</div>
      </div>
      <div class="card">
        <div class="card-title">Ganadas de ayer</div>
        <div class="meta" style="color:var(--muted); font-size:13px; margin-bottom:14px;">${ganadas ? `Tienes <strong style="color:var(--text);">${ganadas}</strong> guardada${ganadas>1?'s':''} para publicar.` : 'No hay ganadas guardadas para publicar.'}</div>
        <button class="btn" id="factoryGanadasBtn">Abrir ganadas de ayer</button>
      </div>
    </div>
  `;
  document.getElementById('factoryGanadasBtn').onclick = openWinGanadasAyerModal;
}

/* ---------- ROUTER ---------- */
function render(){
  if(!state.loaded) return;
  document.getElementById('syncStatus').style.display = state.syncError ? 'block' : 'none';
  updateNavBadges();
  if(state.view==='dashboard') renderDashboard();
  else if(state.view==='win') renderWin();
  else if(state.view==='inbox') renderInbox();
  else if(state.view==='reminders') renderReminders();
  else if(state.view==='factory') renderFactory();
  else if(state.view==='vips') renderVipGroup('vips', 'Miembros VIP');
  else if(state.view==='freeBets') renderPicks('freeBets', 'Apuestas Gratis');
  else if(state.view==='vipBets') renderPicks('vipBets', 'Apuestas VIP');
  else if(state.view==='liveBets') renderPicks('liveBets', 'Apuestas Live');
  else if(state.view==='stakes') renderStakes();
  else if(state.view==='stakeSales') renderStakeSales();
  else if(state.view==='gifts') renderGifts();
  else if(state.view==='finance') renderFinance();
}

/* ---------- AUTH ---------- */
function enterApp(role){
  state.role = role;
  state.view = 'dashboard';
  // Si se abre con ?win=1 (ej. desde el acceso directo del celular / gesto), entra directo a Win
  // en vez del dashboard.
  try{
    if(new URLSearchParams(window.location.search).get('win') === '1'){ state.view = 'win'; winTabJustOpened = true; }
  }catch(e){}
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  document.body.classList.toggle('win-locked', state.view === 'win');
  document.querySelectorAll('.nav-item[data-view]').forEach(el=>el.classList.toggle('active', el.dataset.view===state.view));
  applyRoleToNav();
  loadAll();
}

async function attemptLogin(){
  const user = document.getElementById('loginUser').value.trim();
  const pass = document.getElementById('loginPass').value;
  const errEl = document.getElementById('loginError');
  const btn = document.getElementById('loginBtn');
  errEl.style.display = 'none';

  btn.textContent = 'Verificando...';
  btn.disabled = true;
  try{
    const res = await fetch(`${SHEETS_API_URL}?action=login&user=${encodeURIComponent(user)}&password=${encodeURIComponent(pass)}`);
    const json = await res.json();
    if(json.ok){
      localStorage.setItem('panelVipAuth', 'true');
      localStorage.setItem('panelRole', 'admin');
      enterApp('admin');
    }else{
      errEl.style.display = 'block';
    }
  }catch(e){
    console.error('Error de login', e);
    errEl.textContent = 'No se pudo conectar. Intenta de nuevo.';
    errEl.style.display = 'block';
  }
  btn.textContent = 'Entrar';
  btn.disabled = false;
}
document.getElementById('loginBtn').addEventListener('click', attemptLogin);
document.getElementById('loginPass').addEventListener('keydown', (e)=>{ if(e.key==='Enter') attemptLogin(); });
document.getElementById('logoutBtn').addEventListener('click', ()=>{
  localStorage.removeItem('panelVipAuth');
  localStorage.removeItem('panelRole');
  location.reload();
});

if(localStorage.getItem('panelVipAuth') === 'true'){
  const savedRole = localStorage.getItem('panelRole');
  if(savedRole === 'socio' || savedRole === 'colaboradora'){
    // Sesión vieja guardada en el dispositivo de Ayrton o de Erika — ya no tienen acceso,
    // se cierra sola y los manda de vuelta al login.
    localStorage.removeItem('panelVipAuth');
    localStorage.removeItem('panelRole');
  } else {
    enterApp('admin');
  }
}
</script>
